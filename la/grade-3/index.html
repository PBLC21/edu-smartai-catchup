<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grade 3 Language Arts Catch-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a working notebook — skill map in the margin, one problem on graph paper in the main column */
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#132228; --muted:#566870; --line:#d3dee1; --grid:#e4ecee;
  --accent:#0a6a70; --accent-soft:#dcefef; --on-accent:#ffffff;
  --marker:#f0b429; --marker-soft:#fdf1cf;
  --good:#2b7d47; --good-soft:#dff0e4; --bad:#b63c28; --bad-soft:#f8e1dc;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171a; --surface:#152227; --ink:#e3ecee; --muted:#93a6ad; --line:#26383e; --grid:#1d2d32;
  --accent:#4cc3c4; --accent-soft:#163a3d; --on-accent:#08201f;
  --marker:#f3c14f; --marker-soft:#3a3018;
  --good:#6fcf8f; --good-soft:#173a25; --bad:#ff8f7a; --bad-soft:#40211b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171a; --surface:#152227; --ink:#e3ecee; --muted:#93a6ad; --line:#26383e; --grid:#1d2d32;
  --accent:#4cc3c4; --accent-soft:#163a3d; --on-accent:#08201f;
  --marker:#f3c14f; --marker-soft:#3a3018;
  --good:#6fcf8f; --good-soft:#173a25; --bad:#ff8f7a; --bad-soft:#40211b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,40px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.brand h1 span{background:linear-gradient(transparent 58%,var(--marker) 58%, var(--marker) 90%,transparent 90%);padding:0 2px}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.home{display:inline-flex;align-items:center;gap:8px;min-height:40px;margin-bottom:12px;padding:6px 14px 6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.home .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.home:hover{border-color:var(--accent);background:var(--accent-soft)}
.home:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.brand h1 #ttl-lv{background:none;padding:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}

.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)} .map{order:2}}

/* Skill map */
.map{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.map h2{font-family:var(--display);font-size:18px;margin:0}
.map .note{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.cat{display:flex;flex-direction:column;gap:4px}
.cat-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-bottom:2px;border-bottom:1px solid var(--line)}
.cat-h b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:7px 6px;border-radius:8px;width:100%}
.sk:hover{background:var(--grid)}
.sk[aria-current="true"]{background:var(--accent-soft)}
.code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sk .nm{font-size:14px;line-height:1.25}
.sk .nx{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;background:var(--marker);color:#2a2005;border-radius:4px;padding:0 5px;vertical-align:1px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st-new{color:var(--muted);border:1px solid var(--line)}
.st-working{background:var(--accent-soft);color:var(--accent)}
.st-gap{background:var(--bad-soft);color:var(--bad)}
.st-ok{background:var(--marker-soft);color:var(--ink)}
.st-mastered{background:var(--good-soft);color:var(--good)}

/* Main */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.banner{background:var(--marker-soft);border:1px solid var(--marker);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.banner h3{margin:0;font-family:var(--display);font-size:18px}
.banner p{margin:2px 0 0;font-size:14px;max-width:56ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.eyebrow .code{font-size:13px;margin-right:6px}
.pips{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.pip.on{background:var(--accent)}
.paper{padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.qtext{font-size:clamp(17px,2.2vw,20px);line-height:1.5;max-width:62ch;margin:0;background:var(--surface);box-shadow:0 0 0 6px var(--surface)}
.expr{font-family:var(--mono);font-size:clamp(18px,2.6vw,24px);background:var(--surface);display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%}
.vis{overflow-x:auto;max-width:100%}
.plot{width:300px;max-width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:block}
.plot .gl{stroke:var(--grid);stroke-width:1}
.plot .ax{stroke:var(--muted);stroke-width:1.5}
.plot .lab{fill:var(--muted);font:11px var(--body)}
.plot .tl{fill:var(--muted);font:700 11px var(--body)}
.plot .ln{stroke:var(--accent);stroke-width:2.5;fill:none}
.plot .pt{fill:var(--marker);stroke:var(--ink);stroke-width:1.5}
.plot .dot{fill:var(--accent);opacity:.75}
.plot .pl{fill:var(--ink);font:700 12px var(--mono)}
table.tb{border-collapse:collapse;background:var(--surface);font-family:var(--mono);font-variant-numeric:tabular-nums}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 14px;text-align:center}
table.tb th{background:var(--accent-soft);color:var(--accent)}
.answer{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.answer input{font:500 20px var(--mono);width:min(220px,100%);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.answer input:focus{border-color:var(--accent);outline:none}
.help{font-size:13px;color:var(--muted);margin:-8px 0 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{text-align:left;padding:12px 14px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-family:var(--mono);font-size:16px;min-width:0;overflow-wrap:anywhere}
.choice.txt{font-family:var(--body)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.hintbox{background:var(--marker-soft);border-left:4px solid var(--marker);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px;max-width:62ch}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--display);font-size:18px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb .ansv{font-family:var(--mono)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.steps li{padding-left:2px}
.steps .m{font-family:var(--mono)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sum h3{margin:0;font-family:var(--display);font-size:22px}
.sum p{margin:0;max-width:60ch}
.gaplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gaplist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.gaplist .w{font-size:12px;color:var(--muted);white-space:nowrap}

.ttl h2{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);margin:2px 0 0;line-height:1.15}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .tn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;border:2px solid currentColor}
.tabs button[aria-current="true"] .tn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
@media (max-width:760px){.lesson{grid-template-columns:minmax(0,1fr)}}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.idea p{margin:0;font-size:17px;max-width:62ch}
.formula{font-family:var(--mono);font-size:16px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:pre}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.words,.watch{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.watch{border-color:var(--marker);background:var(--marker-soft)}
.watch p{margin:0;font-size:15px}
.words dl{margin:0;display:flex;flex-direction:column;gap:6px}
.words dt{font-weight:700;font-size:15px}
.words dd{margin:0;font-size:13px;color:var(--muted);font-style:italic}
.example{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.example h3{margin:0;font-family:var(--display);font-size:18px}
.example .qtext{box-shadow:none}
.exans{margin:0;font-size:16px}
.m{font-family:var(--mono)}
.gsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gs{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gs p{margin:0}
.gs.now{border:2px solid var(--accent)}
.gs .gbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.gp{font-size:17px;max-width:62ch}
.gn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent);color:var(--on-accent)}
.gn.ok{background:var(--good);color:var(--surface)}
.gn.help{background:var(--marker);color:#2a2005}
.gs.done p{color:var(--muted);font-size:14px}
.gs.done .ga{color:var(--ink);font-size:16px;font-weight:500}
/* Grade 4 figures */
.plot .sh{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
.plot .rk{fill:none;stroke:var(--ink);stroke-width:1.5}
.plot .cell{fill:var(--surface);stroke:var(--line);stroke-width:1}
.plot .on{fill:var(--accent);fill-opacity:.75;stroke:var(--surface);stroke-width:1}
.plot .tk{stroke:var(--muted);stroke-width:1}
.plot .ray{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.plot .mk{fill:var(--marker);fill-opacity:.55}
.plot .in{fill:var(--accent);font:700 10px var(--body)}
.plot .x{fill:var(--accent);font:700 14px var(--body)}
/* Language Arts: passages and drafts */
.passage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:min(480px,62vh);overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.ptext{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.ptext+.ptext{border-top:2px dashed var(--line);padding-top:18px}
.ptext .eyebrow{margin:0;color:var(--accent)}
.ptext h3{font-family:var(--display);font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
.genre{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.pb{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.pb .pn{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:5px;text-align:right}
.pb p{margin:0;font-size:17px;line-height:1.7;max-width:64ch}
.pb.poem p{white-space:pre-line}
.passage mark{background:var(--marker-soft);color:inherit;border-bottom:2px solid var(--marker);border-radius:2px;padding:1px 0}
.wb{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:13px;align-items:center;margin-top:-6px}
.wb b{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.wb span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.qtr{margin:-12px 0 0;color:var(--muted);font-style:italic;font-size:15px;max-width:62ch;background:var(--surface);box-shadow:0 0 0 6px var(--surface)}
.draft{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:clamp(17px,2.2vw,19px);line-height:1.6;max-width:62ch}
.eyebrow .code{text-transform:none}
.formula{white-space:pre-wrap}
.fb .ansv,.gs.done .ga,.exans .m{font-family:var(--body)}
.choices:has(.choice.txt){grid-template-columns:minmax(0,1fr)}
.draft u{text-decoration-color:var(--bad);text-decoration-thickness:2px;text-underline-offset:3px}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fb,.hintbox{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <a class="home" href="../../" id="home-link"><span class="ic" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 2.5 4 7l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="home-txt">All grades</span></a>
      <h1><span id="ttl-lv">Grade 3 Language Arts</span> <span>Catch-Up</span></h1>
      <p id="sub"></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" data-lang="en">EN</button>
        <button id="lang-es" data-lang="es">ES</button>
      </div>
      <button class="btn" id="btn-check"></button>
      <button class="btn ghost" id="btn-reset"></button>
    </div>
  </header>
  <div class="layout">
    <aside class="map" id="map"></aside>
    <main class="main" id="main"></main>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script>
const LS='catchup.la.grade-3.v1';
const TTL_EN='Grade 3 Language Arts',TTL_ES='Lenguaje · Grado 3';
let S=null; try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||typeof S!=='object'||!S.p)S={lang:'en',p:{}};
try{const gl=localStorage.getItem('catchup.lang');if(gl==='en'||gl==='es')S.lang=gl}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const L=(en,es)=>({en,es});
const tx=v=>v==null?'':(typeof v==='object'?v[S.lang]:String(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=(a,b)=>{let v;do v=ri(a,b);while(v===0);return v};
const r2=n=>Math.round(n*100)/100;
const fm=n=>String(r2(n)).replace('-','−');
const f2=n=>n.toFixed(2).replace('-','−');
const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pt=(x,y)=>`(${fm(x)}, ${fm(y)})`;
function lin(m,b){let s=m===0?'':m===1?'x':m===-1?'−x':fm(m)+'x';
  if(b!==0){s=s?s+(b<0?' − ':' + ')+fm(Math.abs(b)):fm(b)}else if(!s)s='0';return s}
function mc(correct,others,n=4){const key=v=>JSON.stringify(v);const seen=new Set([key(correct)]);const list=[correct];
  for(const o of others){if(list.length>=n)break;const k=key(o);if(!seen.has(k)){seen.add(k);list.push(o)}}
  const sh=shuf(list);return{choices:sh,ans:sh.indexOf(correct)}}
function parseNum(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/[$,°]/g,'').replace(/^[a-z]\s*=\s*/i,'').replace(/\s*[a-záéíóúñ][a-záéíóúñ\s.²]*$/i,'').replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').trim();
  let m=s.match(/^(\d+) (\d+)\/(\d+)$/);if(m)return +m[1]+ +m[2]/+m[3];s=s.replace(/ /g,'');
  m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return +m[1]/+m[2];
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN}
/* one guided step: numeric answer, or multiple choice when o.choices is given (ans = index) */

function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}

/* ---------- coordinate plot (inline SVG) ---------- */
let clipN=0;
function plot(o){
  const W=300,H=260,PL=38,PB=30,PT=12,PR=14;const[x0,x1]=o.xr,[y0,y1]=o.yr;
  const sx=x=>PL+(x-x0)/(x1-x0)*(W-PL-PR), sy=y=>H-PB-(y-y0)/(y1-y0)*(H-PB-PT);
  const xs=o.xs||nice((x1-x0)/8), ys=o.ys||nice((y1-y0)/6), xl=o.xl||xs, yl=o.yl||ys;
  const ax=(y0<=0&&y1>=0)?sy(0):sy(y0), ay=(x0<=0&&x1>=0)?sx(0):sx(x0);
  let g='',t='';
  for(let i=Math.ceil(x0/xs-1e-9);i*xs<=x1+1e-9;i++){const x=r2(i*xs);g+=`<line class="gl" x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(y1)}"/>`;
    if(Math.abs(x/xl-Math.round(x/xl))<1e-6&&!(x===0&&ay!==sx(x0)))t+=`<text class="lab" x="${sx(x)}" y="${ax+15}" text-anchor="middle">${fm(x)}</text>`}
  for(let i=Math.ceil(y0/ys-1e-9);i*ys<=y1+1e-9;i++){const y=r2(i*ys);g+=`<line class="gl" x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(x1)}" y2="${sy(y)}"/>`;
    if(Math.abs(y/yl-Math.round(y/yl))<1e-6&&!(y===0&&ax!==sy(y0)))t+=`<text class="lab" x="${ay-5}" y="${sy(y)+4}" text-anchor="end">${fm(y)}</text>`}
  if(ay!==sx(x0)&&ax!==sy(y0))t+=`<text class="lab" x="${ay-5}" y="${ax+14}" text-anchor="end">0</text>`;
  const id='c'+(clipN++);
  let ln=(o.lines||[]).map(l=>`<line class="ln" clip-path="url(#${id})" x1="${sx(x0)}" y1="${sy(l.m*x0+l.b)}" x2="${sx(x1)}" y2="${sy(l.m*x1+l.b)}"/>`).join('');
  let dots=(o.dots||[]).map(([x,y])=>`<circle class="dot" cx="${sx(x)}" cy="${sy(y)}" r="4"/>`).join('');
  let pts=(o.pts||[]).map(p=>`<circle class="pt" cx="${sx(p.x)}" cy="${sy(p.y)}" r="5"/>`+(p.l?`<text class="pl" x="${sx(p.x)+8}" y="${sy(p.y)-8}">${esc(p.l)}</text>`:'')).join('');
  const axes=`<line class="ax" x1="${sx(x0)}" y1="${ax}" x2="${sx(x1)}" y2="${ax}"/><line class="ax" x1="${ay}" y1="${sy(y0)}" x2="${ay}" y2="${sy(y1)}"/>`;
  const titles=(o.xt?`<text class="tl" x="${W-PR}" y="${H-4}" text-anchor="end">${esc(o.xt)}</text>`:'')+(o.yt?`<text class="tl" x="${PL+4}" y="${PT+10}">${esc(o.yt)}</text>`:'');
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'graph')}"><defs><clipPath id="${id}"><rect x="${sx(x0)}" y="${sy(y1)}" width="${sx(x1)-sx(x0)}" height="${sy(y0)-sy(y1)}"/></clipPath></defs>${g}${axes}${ln}${dots}${pts}${t}${titles}</svg>`;
}

p1:{t:`The Lemonade Stand Problem`,g:'fic',b:[
`Nina had a plan for Saturday. She would sell lemonade and save money for a new soccer ball. Her little brother, Teo, wanted to help. "You can hold the sign," Nina told him.`,
`Nina set up her table at the end of Cedar Lane. She poured ice into the pitcher and lined up the cups in a neat row. Then she waited. The street was deserted. Not one car or person went by all morning.`,
`"Maybe we should move to the park," Teo said. "Lots of people go there on Saturdays."`,
`"I'm the one in charge," Nina said. "The stand stays here." But by noon, the ice had melted and her money jar was still empty. Nina sat down on the curb with a sigh.`,
`Teo sat next to her. "The soccer games at the park start at one o'clock," he said quietly. "Players get thirsty."`,
`Nina looked at her brother. He was right, and she knew it. Together they carried the table to the park. By three o'clock, every cup was gone. Nina handed Teo half of the money. "Next time," she said, "you're the one with the plan."`]},
p2:{t:`Why Armadillo Shares His Shell`,g:'folk',b:[
`Long ago, Armadillo had the hardest shell in all the land. He was very proud of it. Every day he polished it until it shined like the moon.`,
`One afternoon, dark clouds rolled across the sky. Hail began to fall, as big as pebbles. Mouse, Lizard, and little Quail scurried in every direction, looking for a place to hide.`,
`"Please, Armadillo," squeaked Mouse. "Let us hide under your shell!"`,
`Armadillo frowned. "My shell is for me," he said. "You will scratch it." He curled up tightly and shut his eyes.`,
`Then a hailstone landed right next to Quail's tiny nest. Armadillo heard Quail's chicks crying. He thought about how frightened they must be. Slowly, Armadillo uncurled and lifted his shell. "Come inside, all of you," he said.`,
`When the storm passed, Armadillo's shell was covered in small dents. But his friends thanked him again and again. From that day on, Armadillo cared more about his friends than about his shiny shell. And that is why, even today, an armadillo's shell is bumpy instead of smooth.`]},
p3:{t:`Abuela's Kitchen`,g:'poem',b:[
`In Abuela's kitchen on Sunday morning,\nthe comal sizzles without a warning.\nTortillas puff up like little moons,\nwhile Abuela hums her favorite tunes.`,
`Pat, pat, pat go her quick, warm hands,\nshaping the dough the way she planned.\nHers are perfectly round, but mine come out\nlumpy and lopsided, without a doubt.`,
`"Perfect," she says, and she gives me a wink.\nIt doesn't matter what others might think.\nThe best tortillas, I've come to see,\nare the ones my abuela makes with me.`]},
p4:{t:`The Lost Library Book`,g:'drama',b:[
`(The school library. MARCO is looking under a table. LILY walks in carrying a stack of books.)`,
`LILY: Marco, what are you doing under there?`,
`MARCO: (whispering) I can't find my library book. It's due today, and Ms. Bell is going to be upset.`,
`LILY: Did you look in your backpack?`,
`MARCO: Three times! Maybe I should just tell Ms. Bell I already returned it.`,
`LILY: (shaking her head) That wouldn't be true. Let's retrace your steps instead. Where did you read it last?`,
`MARCO: At lunch. I read it while I ate my sandwich. (He stops.) My lunchbox! I put it in my lunchbox so it wouldn't get wet.`,
`(MARCO runs off and comes back holding the book.)`,
`MS. BELL: (walking over) Is everything all right, you two?`,
`MARCO: It is now. I almost lost this book, and I almost told a fib about it. Lily helped me find it the honest way.`,
`MS. BELL: (smiling) Then you two make a great team.`]},
p5:{t:`Horned Lizards: Small but Tough`,g:'info',b:[
`The Texas horned lizard is a small reptile with a big reputation. It is the official state reptile of Texas. Many people call it a "horny toad," but it is not a toad at all. It is a lizard.`,
`Horned lizards have flat, round bodies covered in spiky scales. Two long horns stick out from the back of their heads. Their sandy colors help them blend in with the dry ground, so predators have a hard time spotting them.`,
`When a predator does come close, a horned lizard has some surprising ways to defend itself. First, it may stay perfectly still. If that does not work, it can puff up its body like a balloon so it looks too big to swallow. As a last trick, it can squirt a stream of blood from its eyes! The blood tastes terrible to coyotes and dogs.`,
`Horned lizards eat mostly harvester ants. One lizard can eat dozens of ants in a single meal. Its sticky tongue helps it scoop up the tiny insects quickly.`,
`Today, horned lizards are harder to find in Texas than they used to be. Many of the ants they eat have disappeared, and some of their habitat, or natural home, has been turned into roads and buildings. Scientists and volunteers are working to protect these tough little lizards.`]},
p6:{t:`Our City Should Build a Splash Pad`,g:'arg',b:[
`Every summer, the temperature in our city climbs above 100 degrees. Kids need a safe, cool place to play outside. Our city should build a splash pad in Central Park.`,
`A splash pad is a play area with fountains and sprayers but no deep water. Because there is no deep water, a splash pad is safer than a pool for young children. Splash pads also do not need lifeguards, so they cost less to run.`,
`Splash pads help kids stay active. Doctors say children should get at least one hour of exercise every day. On very hot days, many kids stay inside instead. A splash pad would give them a fun reason to run, jump, and play.`,
`Some people say a splash pad would waste water. However, many splash pads clean and reuse the same water again and again. Using water more than once means less water is wasted.`,
`A splash pad is the coolest idea for our community. I think it would be the best thing to happen to our park in years. The city council should vote yes!`]},
p7:{t:`Every Student Needs a Library Card`,g:'arg',b:[
`A library card is free, and it opens the door to thousands of books. Every student in our school should get a public library card.`,
`With a library card, students can borrow books, audiobooks, and movies for free. Families do not have to spend money to find something new to read.`,
`Reading every day helps students become stronger readers. Teachers say that students who read a little every day improve faster than students who do not.`,
`Libraries are more than books. Many libraries have free homework help, computer classes, and summer reading programs with prizes. I believe summer reading programs are the most fun part of the whole year.`,
`Some students say they already have books at home. That is great, but a library gets new books every month, so there is always something exciting to discover. Getting a library card is easy, and it is the smartest choice a student can make.`]},
p8:{t:`Sea Turtles of Padre Island`,g:'info',b:[
`Padre Island, on the Texas coast, is an important nesting place for Kemp's ridley sea turtles. Kemp's ridleys are the smallest sea turtles in the world, and they are also one of the most endangered. Endangered means there are so few left that they could disappear forever.`,
`Each spring, female turtles crawl out of the Gulf onto the beach. Each one digs a hole in the sand with her back flippers and lays about 100 eggs. Then she covers the nest and returns to the sea.`,
`Beach workers and volunteers watch for these nests. When they find one, they carefully move the eggs to a protected area. There, the eggs are safe from predators like coyotes and from people driving on the beach.`,
`After about 50 days, the tiny turtles hatch. Workers release the hatchlings on the beach so they can crawl to the water on their own. Crawling across the sand may help them remember the beach, and scientists believe that the females may return to the same area to lay their own eggs years later.`]},
p9:{t:`Hatchling Morning`,g:'fic',b:[
`Rosa had been waiting all summer for this day. Her family stood behind a rope on the Padre Island beach with many other people. Everyone was quiet.`,
`A park ranger carried a large cooler to the sand. "These hatchlings came from eggs we protected," she said. "Today, they begin their journey."`,
`The ranger tipped the cooler gently. Dozens of tiny gray turtles, each no bigger than a cookie, tumbled onto the sand. For a moment, they did not move. Rosa held her breath.`,
`Then the first turtle started flapping its flippers. It crawled toward the waves, leaving tiny tracks behind it. Soon all the hatchlings were scrambling toward the water. A wave rolled in and carried the first one out to sea.`,
`Rosa squeezed her dad's hand. "Will we ever see them again?" she asked.`,
`"Maybe," said the ranger, who had heard her. "If that one is a girl, she might come back to this very beach someday to lay her eggs." Rosa smiled. She decided right then that she would come back every year, just in case.`]},
p10:{t:`Bluebonnets: The Texas State Flower`,g:'info',b:[
`Every spring, fields along Texas highways turn bright blue. The color comes from bluebonnets, the state flower of Texas. Bluebonnets got their name because their petals look like the bonnets, or sun hats, that pioneer women wore long ago.`,
`Bluebonnets are tough plants. Their seeds have hard coats, and they can stay in the ground for years before they sprout. The seeds usually sprout in the fall. The young plants grow slowly through the winter, and the flowers bloom in March and April.`,
`Bluebonnets help other living things, too. Bees visit the flowers to collect pollen. The plants also add nutrients to the soil, which helps other plants grow.`,
`Many Texas families take pictures in bluebonnet fields each spring. It has become a tradition, something people do year after year. Visitors are asked to step carefully so they do not crush the plants. That way, the flowers can make seeds for the next spring.`]},
p11:{t:`Abuelo's Bluebonnet Picture`,g:'fic',b:[
`On the first warm Saturday in April, Abuelo honked the truck horn. "Vámonos, Sofía!" he called. "The bluebonnets are waiting."`,
`Every spring, Abuelo took a picture of the family in the same field outside of town. Sofía had seen all the old pictures. In one, her mom was a baby. In another, Abuelo had black hair instead of gray.`,
`When they arrived, the field looked like a blue ocean. Sofía wanted to run straight into the middle of it. Abuelo gently held her shoulder. "Walk on the path, mija," he said. "If we crush the flowers, they can't make seeds for next year."`,
`Sofía walked carefully and sat at the edge of the flowers. Abuelo set up his old camera. "Smile!" he said. Click.`,
`That night, Sofía added the new picture to the album. She looked at all the springs lined up together. For the first time, she understood why Abuelo never missed a year.`]}};

{p:'p1',s:'3.8C',q:`How is the problem solved at the end of the story?`,tr:`¿Cómo se resuelve el problema al final del cuento?`,c:[`Nina and Teo move the stand to the park, where thirsty players buy lemonade.`,`Nina buys a new soccer ball with her own money.`,`Teo makes a bigger sign for the stand on Cedar Lane.`,`Nina adds more ice so the lemonade stays cold.`],e:[`Together they carried the table to the park.`],x:[`They move to the park, and by three o'clock every cup is sold. Moving the stand solves the problem.`,`Se mudan al parque y para las tres ya vendieron todos los vasos. Mover el puesto resuelve el problema.`]},
{p:'p1',s:'3.8B',q:`How does Nina's opinion of Teo change from the beginning to the end?`,tr:`¿Cómo cambia lo que Nina piensa de Teo del principio al final?`,c:[`At first she thinks he can only hold the sign, but later she respects his ideas.`,`At first she likes his ideas, but later she gets angry at him.`,`At first she is afraid of him, but later she trusts him.`,`At first she ignores him, and at the end she still ignores him.`],e:[`"Next time," she said, "you're the one with the plan."`],x:[`In paragraph 1, Nina gives Teo a small job. At the end, she says he will make the plan next time, so she respects his ideas.`,`En el párrafo 1, Nina le da a Teo un trabajo pequeño. Al final dice que la próxima vez él hará el plan, así que ahora respeta sus ideas.`]},
{p:'p1',s:'3.3B',q:`In paragraph 2, what does the word "deserted" mean?`,tr:`En el párrafo 2, ¿qué significa la palabra "deserted"?`,c:[`empty, with no people`,`hot and sunny`,`long and curvy`,`busy and loud`],e:[`Not one car or person went by all morning.`],x:[`The next sentence says not one car or person went by, so "deserted" means empty, with no people.`,`La oración siguiente dice que no pasó ningún carro ni ninguna persona, así que significa vacía, sin gente.`]},
{p:'p1',s:'3.6F',q:`Why does Teo tell Nina about the soccer games?`,tr:`¿Por qué Teo le cuenta a Nina de los partidos de fútbol?`,c:[`He thinks the players will want to buy lemonade.`,`He wants to stop selling and go play soccer.`,`He wants Nina to buy him a soccer ball.`,`He is bored and wants to change the subject.`],e:[`"Players get thirsty."`],x:[`Teo points out that players get thirsty. He is hinting that the park is a better place to sell lemonade.`,`Teo dice que los jugadores tienen sed. Da a entender que el parque es un mejor lugar para vender limonada.`]},
{p:'p1',s:'3.10A',q:`What message does the author share in this story?`,tr:`¿Qué mensaje comparte la autora en este cuento?`,c:[`Listening to other people's ideas can help solve a problem.`,`Older children should always be in charge.`,`Selling lemonade is the best way to make money.`,`It is better to work alone than with family.`],e:[`He was right, and she knew it.`],x:[`Nina's plan fails until she listens to Teo. The message is that other people's ideas can help.`,`El plan de Nina fracasa hasta que escucha a Teo. El mensaje es que las ideas de otros pueden ayudar.`]},

{p:'p2',s:'3.8B',q:`How does Armadillo change in the story?`,tr:`¿Cómo cambia el Armadillo en el cuento?`,c:[`He goes from caring only about his shell to caring about his friends.`,`He goes from being kind to being selfish.`,`He goes from being afraid of hail to loving storms.`,`He goes from having a bumpy shell to having a smooth one.`],e:[`From that day on, Armadillo cared more about his friends than about his shiny shell.`],x:[`At first he will not share because his shell might get scratched. By the end, his friends matter more than his shell.`,`Al principio no quiere compartir porque se le puede rayar el caparazón. Al final, sus amigos le importan más que su caparazón.`]},
{p:'p2',s:'3.8C',q:`What does Armadillo do after he hears Quail's chicks crying?`,tr:`¿Qué hace el Armadillo después de oír llorar a los pollitos de la Codorniz?`,c:[`He lifts his shell so the animals can hide.`,`He polishes his shell until it shines.`,`He runs away to find a safer place.`,`He tells Mouse to go away.`],e:[`Slowly, Armadillo uncurled and lifted his shell.`],x:[`Hearing the chicks makes him think about how scared they are. Then he uncurls and lets everyone in.`,`Oír a los pollitos lo hace pensar en lo asustados que están. Luego se desenrolla y deja entrar a todos.`]},
{p:'p2',s:'3.3B',q:`In paragraph 2, what does the word "scurried" mean?`,tr:`En el párrafo 2, ¿qué significa la palabra "scurried"?`,c:[`ran quickly`,`slept soundly`,`sang loudly`,`ate slowly`],e:[`Mouse, Lizard, and little Quail scurried in every direction, looking for a place to hide.`],x:[`The animals are looking for a place to hide from the hail, so they must be running quickly in every direction.`,`Los animales buscan dónde esconderse del granizo, así que corren rápido de un lado a otro.`]},
{p:'p2',s:'3.10A',q:`What lesson does this folktale teach?`,tr:`¿Qué lección enseña este cuento folclórico?`,c:[`Helping others matters more than keeping things perfect.`,`Hard shells are the best protection in a storm.`,`Animals should always stay home when it rains.`,`It is important to polish your things every day.`],e:[`From that day on, Armadillo cared more about his friends than about his shiny shell.`],x:[`Armadillo's shell gets dents, but he saves his friends and learns they matter more. That is the lesson.`,`El caparazón se abolla, pero el Armadillo salva a sus amigos y aprende que ellos importan más. Esa es la lección.`]},
{p:'p2',s:'3.6F',q:`Why does Armadillo curl up and shut his eyes in paragraph 4?`,tr:`¿Por qué el Armadillo se enrolla y cierra los ojos en el párrafo 4?`,c:[`He does not want to share his shell with the other animals.`,`He is scared of the thunder.`,`He is tired and wants to sleep.`,`He is hiding from Quail's chicks.`],e:[`"My shell is for me," he said.`],x:[`He says his shell is for him, then curls up tight. He is shutting the other animals out.`,`Dice que su caparazón es solo para él y se enrolla. Está dejando afuera a los demás animales.`]},

{p:'p3',s:'3.6G',q:`What is the most important idea in the poem?`,tr:`¿Cuál es la idea más importante del poema?`,c:[`Cooking together is special because of the time spent with family.`,`Tortillas must be perfectly round to taste good.`,`A comal makes a sizzling sound.`,`Abuela likes to hum while she works.`],e:[`The best tortillas, I've come to see,`],x:[`The last stanza says the best tortillas are the ones made together. The poem is really about sharing time with Abuela.`,`La última estrofa dice que las mejores tortillas son las que se hacen juntas. El poema trata de compartir tiempo con Abuela.`]},

{p:'p4',s:'3.8C',q:`What is Marco's problem at the beginning of the play?`,tr:`¿Cuál es el problema de Marco al principio de la obra?`,c:[`He cannot find a library book that is due today.`,`He forgot to eat his lunch.`,`He does not like the book he is reading.`,`He is late for class.`],e:[`MARCO: (whispering) I can't find my library book.`],x:[`Marco is searching under a table because his library book is missing and due today.`,`Marco busca debajo de una mesa porque su libro de la biblioteca no aparece y hay que devolverlo hoy.`]},
{p:'p4',s:'3.8C',q:`How is Marco's problem solved?`,tr:`¿Cómo se resuelve el problema de Marco?`,c:[`He remembers that he put the book in his lunchbox.`,`Ms. Bell gives him a new copy of the book.`,`Lily lends him one of her books.`,`He tells Ms. Bell that he returned the book.`],e:[`I put it in my lunchbox so it wouldn't get wet.`],x:[`When Lily asks where he read it last, Marco remembers his lunchbox and finds the book.`,`Cuando Lily le pregunta dónde lo leyó por última vez, Marco se acuerda de su lonchera y encuentra el libro.`]},
{p:'p4',s:'3.8B',q:`How does Lily affect Marco's choice?`,tr:`¿Cómo influye Lily en la decisión de Marco?`,c:[`She convinces him to tell the truth and keep looking.`,`She helps him come up with an excuse.`,`She tells Ms. Bell that Marco lost the book.`,`She makes him feel worse about losing the book.`],e:[`Let's retrace your steps instead.`],x:[`Marco wants to say he returned the book. Lily says that is not true and helps him search instead.`,`Marco quiere decir que ya devolvió el libro. Lily le dice que eso no es verdad y lo ayuda a buscarlo.`]},
{p:'p4',s:'3.6F',q:`Why does Marco whisper in line 3?`,tr:`¿Por qué Marco susurra en la línea 3?`,c:[`He does not want Ms. Bell to hear that the book is lost.`,`He has a sore throat.`,`Lily asked him to be quiet.`,`He is reading the book out loud.`],e:[`It's due today, and Ms. Bell is going to be upset.`],x:[`Marco thinks Ms. Bell will be upset, and they are in the library where she works, so he keeps his voice down.`,`Marco cree que la maestra Bell se va a enojar, y están en la biblioteca donde ella trabaja, así que habla bajito.`]},
{p:'p4',s:'3.10A',q:`What message does the playwright share?`,tr:`¿Qué mensaje comparte la autora de la obra?`,c:[`Telling the truth is the right choice, even when it is hard.`,`Library books should never be taken to lunch.`,`Librarians are always upset about late books.`,`It is easier to work alone than with a friend.`],e:[`Lily helped me find it the honest way.`],x:[`Marco almost tells a fib, but Lily helps him solve the problem honestly. The message is about honesty.`,`Marco casi dice una mentira, pero Lily lo ayuda a resolverlo con honestidad. El mensaje trata de la honestidad.`]},
{p:'p4',s:'3.3B',q:`In line 6, what does the word "retrace" mean?`,tr:`En la línea 6, ¿qué significa la palabra "retrace"?`,c:[`go back over the same path`,`draw a new picture`,`run as fast as possible`,`give up and go home`],e:[`Where did you read it last?`],x:[`Lily asks where Marco read the book last. Retracing means going back over where you have been.`,`Lily le pregunta dónde leyó el libro por última vez. "Retrace" significa volver a recorrer el camino.`]},
// p5 Horned Lizards
{p:'p5',s:'3.9Di',q:`What is the central idea of the article?`,tr:`¿Cuál es la idea central del artículo?`,c:[`Horned lizards are unusual Texas reptiles with special ways to survive.`,`Horned lizards are a kind of toad that lives in Texas.`,`Coyotes and dogs do not like the taste of blood.`,`Harvester ants live in dry places.`],e:[`The Texas horned lizard is a small reptile with a big reputation.`],x:[`Every paragraph tells something special about horned lizards: their bodies, defenses, food, and protection.`,`Cada párrafo cuenta algo especial sobre los lagartos cornudos: su cuerpo, sus defensas, su comida y su protección.`]},
{p:'p5',s:'3.9Di',q:`Which detail best supports the idea that horned lizards can protect themselves?`,tr:`¿Qué detalle apoya mejor la idea de que los lagartos cornudos pueden protegerse?`,c:[`It can puff up its body like a balloon so it looks too big to swallow.`,`It is the official state reptile of Texas.`,`Horned lizards eat mostly harvester ants.`,`Many people call it a "horny toad."`],e:[`If that does not work, it can puff up its body like a balloon so it looks too big to swallow.`],x:[`Puffing up to look too big to swallow is a way to stay safe from predators.`,`Inflarse para parecer demasiado grande es una manera de protegerse de los depredadores.`]},
{p:'p5',s:'3.6G',q:`Which detail best explains why horned lizards are harder to find today?`,tr:`¿Qué detalle explica mejor por qué hoy es más difícil encontrar lagartos cornudos?`,c:[`Many of the ants they eat have disappeared.`,`They have spiky scales.`,`They can squirt blood from their eyes.`,`Their tongues are sticky.`],e:[`Many of the ants they eat have disappeared, and some of their habitat, or natural home, has been turned into roads and buildings.`],x:[`Paragraph 5 explains that their food and their homes are disappearing. That is the key reason.`,`El párrafo 5 explica que su comida y su hogar están desapareciendo. Esa es la razón clave.`]},
{p:'p5',s:'3.3B',q:`In paragraph 5, what does the word "habitat" mean?`,tr:`En el párrafo 5, ¿qué significa la palabra "hábitat"?`,c:[`a natural home`,`a kind of food`,`a predator`,`a spiky scale`],e:[`Many of the ants they eat have disappeared, and some of their habitat, or natural home, has been turned into roads and buildings.`],x:[`The words right after it, "or natural home," tell what habitat means.`,`Las palabras que siguen, "o hogar natural", dicen lo que significa hábitat.`]},
{p:'p5',s:'3.6F',q:`What can the reader infer about harvester ants?`,tr:`¿Qué puede inferir el lector sobre las hormigas cosechadoras?`,c:[`Horned lizards need them to survive.`,`They are dangerous to people.`,`They eat horned lizards.`,`They only live in cities.`],e:[`Horned lizards eat mostly harvester ants.`],x:[`The lizards eat mostly these ants, and fewer ants means fewer lizards. So the lizards depend on them.`,`Los lagartos comen sobre todo estas hormigas, y menos hormigas significa menos lagartos. Dependen de ellas.`]},
{p:'p5',s:'3.10A',q:`Why did the author write this article?`,tr:`¿Por qué el autor escribió este artículo?`,c:[`to inform readers about horned lizards and how they survive`,`to tell a funny story about a lizard and a toad`,`to convince readers to keep lizards as pets`,`to explain how to catch harvester ants`],e:[`The Texas horned lizard is a small reptile with a big reputation.`],x:[`The article gives facts about horned lizards. Its purpose is to inform.`,`El artículo da datos sobre los lagartos cornudos. Su propósito es informar.`]},
// p6 Splash pad
{p:'p6',s:'3.9E',q:`What is the author's claim?`,tr:`¿Cuál es la afirmación del autor?`,c:[`Our city should build a splash pad in Central Park.`,`Kids should exercise for one hour every day.`,`Pools need lifeguards.`,`Summers are very hot.`],e:[`Our city should build a splash pad in Central Park.`],x:[`The claim is what the author wants readers to agree with. The word "should" is a clue.`,`La afirmación es lo que el autor quiere que los lectores acepten. La palabra "debería" es una pista.`]},
{p:'p6',s:'3.9E',q:`Which sentence from the article is a fact?`,tr:`¿Qué oración del artículo es un dato (un hecho)?`,c:[`Splash pads also do not need lifeguards, so they cost less to run.`,`A splash pad is the coolest idea for our community.`,`I think it would be the best thing to happen to our park in years.`,`The city council should vote yes!`],e:[`Splash pads also do not need lifeguards, so they cost less to run.`],x:[`A fact can be checked and proven. Whether a splash pad needs lifeguards can be checked.`,`Un dato se puede comprobar. Se puede comprobar si un área de chapoteo necesita salvavidas.`]},
{p:'p6',s:'3.9E',q:`Which sentence from the article is an opinion?`,tr:`¿Qué oración del artículo es una opinión?`,c:[`A splash pad is the coolest idea for our community.`,`Every summer, the temperature in our city climbs above 100 degrees.`,`Doctors say children should get at least one hour of exercise every day.`,`A splash pad is a play area with fountains and sprayers but no deep water.`],e:[`A splash pad is the coolest idea for our community.`],x:[`"Coolest" tells what the author feels. People could disagree, so it is an opinion.`,`"La mejor idea" dice lo que siente el autor. Otras personas podrían no estar de acuerdo, así que es una opinión.`]},
{p:'p6',s:'3.10A',q:`Why does the author include paragraph 4?`,tr:`¿Por qué el autor incluye el párrafo 4?`,c:[`to answer people who think a splash pad would waste water`,`to explain what a splash pad looks like`,`to tell how hot the summers are`,`to describe what doctors say about exercise`],e:[`Some people say a splash pad would waste water.`],x:[`Paragraph 4 starts with what other people say, then argues back. It answers people who disagree.`,`El párrafo 4 empieza con lo que dicen otras personas y luego les responde. Contesta a quienes no están de acuerdo.`]},
{p:'p6',s:'3.3B',q:`In paragraph 4, what does the word "reuse" mean?`,tr:`En el párrafo 4, ¿qué significa la palabra "reutilizan"?`,c:[`use again`,`throw away`,`heat up`,`pour out`],e:[`Using water more than once means less water is wasted.`],x:[`The next sentence says "using water more than once," so reuse means use again.`,`La oración siguiente dice "usar el agua más de una vez", así que reutilizar significa volver a usar.`]},
// p7 Library card
{p:'p7',s:'3.9E',q:`What is the author's claim?`,tr:`¿Cuál es la afirmación del autor?`,c:[`Every student in our school should get a public library card.`,`Libraries have computer classes.`,`Students already have books at home.`,`Summer reading programs give prizes.`],e:[`Every student in our school should get a public library card.`],x:[`This sentence tells what the author wants readers to do. It uses "should."`,`Esta oración dice lo que el autor quiere que hagan los lectores. Usa "deberían".`]},
{p:'p7',s:'3.9E',q:`Which sentence from the article is an opinion?`,tr:`¿Qué oración del artículo es una opinión?`,c:[`I believe summer reading programs are the most fun part of the whole year.`,`With a library card, students can borrow books, audiobooks, and movies for free.`,`Many libraries have free homework help, computer classes, and summer reading programs with prizes.`,`A library card is free, and it opens the door to thousands of books.`],e:[`I believe summer reading programs are the most fun part of the whole year.`],x:[`"I believe" and "most fun" show the author's feelings. Not everyone would agree, so it is an opinion.`,`"Creo" y "lo más divertido" muestran lo que siente el autor. No todos estarían de acuerdo, así que es una opinión.`]},
{p:'p7',s:'3.9E',q:`Which reason does the author give to support the claim?`,tr:`¿Qué razón da el autor para apoyar su afirmación?`,c:[`Library cards let students borrow books and movies for free.`,`Libraries are quiet places to sleep.`,`Students should stop buying books.`,`Every family already has a library card.`],e:[`With a library card, students can borrow books, audiobooks, and movies for free.`],x:[`Saving money by borrowing for free is a reason that supports getting a library card.`,`Ahorrar dinero al pedir prestado gratis es una razón que apoya sacar una tarjeta de la biblioteca.`]},
{p:'p7',s:'3.10A',q:`Why does the author include paragraph 5?`,tr:`¿Por qué el autor incluye el párrafo 5?`,c:[`to respond to students who think they do not need a library card`,`to list the books the library has`,`to describe the library building`,`to explain how to read faster`],e:[`Some students say they already have books at home.`],x:[`The author shares what some students say, then explains why a library card still helps.`,`El autor cuenta lo que dicen algunos estudiantes y luego explica por qué la tarjeta sí ayuda.`]},
// p8 Sea turtles (alone)
{p:'p8',s:'3.9Di',q:`What is the central idea of "Sea Turtles of Padre Island"?`,tr:`¿Cuál es la idea central de "Las tortugas marinas de la isla del Padre"?`,c:[`Kemp's ridley sea turtles are endangered, so people work to protect their nests.`,`Coyotes like to eat turtle eggs.`,`Padre Island is a good place for a vacation.`,`Sea turtles have back flippers.`],e:[`Kemp's ridleys are the smallest sea turtles in the world, and they are also one of the most endangered.`],x:[`The article explains that the turtles are endangered and describes how people protect their eggs and babies.`,`El artículo explica que las tortugas están en peligro y cuenta cómo la gente protege sus huevos y crías.`]},
{p:'p8',s:'3.9Di',q:`Which detail supports the idea that people help the turtles?`,tr:`¿Qué detalle apoya la idea de que la gente ayuda a las tortugas?`,c:[`Beach workers and volunteers watch for these nests.`,`Each spring, female turtles crawl out of the Gulf onto the beach.`,`After about 50 days, the tiny turtles hatch.`,`Each one lays about 100 eggs.`],e:[`Beach workers and volunteers watch for these nests.`],x:[`Watching for nests and moving the eggs to safety are ways people help.`,`Vigilar los nidos y llevar los huevos a un lugar seguro son maneras en que la gente ayuda.`]},
{p:'p8',s:'3.3B',q:`In paragraph 1, what does the word "endangered" mean?`,tr:`En el párrafo 1, ¿qué significa "en peligro de extinción"?`,c:[`so few are left that they could disappear forever`,`very dangerous to people`,`able to swim very fast`,`living only on beaches`],e:[`Endangered means there are so few left that they could disappear forever.`],x:[`The author gives the definition in the very next sentence.`,`La autora da la definición en la oración siguiente.`]},
{p:'p8',s:'3.6G',q:`Which detail best explains why workers move the eggs?`,tr:`¿Qué detalle explica mejor por qué los trabajadores mueven los huevos?`,c:[`Predators and cars could harm the eggs on the open beach.`,`The eggs hatch after about 50 days.`,`The mother turtle uses her back flippers.`,`Kemp's ridleys are the smallest sea turtles.`],e:[`There, the eggs are safe from predators like coyotes and from people driving on the beach.`],x:[`In the protected area, the eggs are safe from coyotes and cars. Safety is the reason they are moved.`,`En el área protegida, los huevos están a salvo de los coyotes y los carros. Por eso los mueven.`]},
// p9 Hatchling Morning (alone)
{p:'p9',s:'3.8B',q:`How does the ranger's answer affect Rosa?`,tr:`¿Cómo afecta a Rosa la respuesta de la guardaparques?`,c:[`It gives Rosa hope and a reason to come back.`,`It makes Rosa sad that the turtles are leaving.`,`It makes Rosa want to become a ranger right away.`,`It makes Rosa angry that she cannot keep a turtle.`],e:[`"If that one is a girl, she might come back to this very beach someday to lay her eggs."`],x:[`After the ranger says the turtle might return, Rosa smiles and decides to come back every year.`,`Después de que la guardaparques dice que la tortuga podría volver, Rosa sonríe y decide regresar cada año.`]},
{p:'p9',s:'3.6F',q:`Why does Rosa hold her breath in paragraph 3?`,tr:`¿Por qué Rosa contiene la respiración en el párrafo 3?`,c:[`She is nervous and excited to see if the turtles will move.`,`The beach smells bad.`,`She is about to jump into the water.`,`She is trying not to laugh.`],e:[`For a moment, they did not move.`],x:[`The turtles are not moving yet, and Rosa has waited all summer. She is nervous and excited.`,`Las tortugas todavía no se mueven y Rosa esperó todo el verano. Está nerviosa y emocionada.`]},
{p:'p9',s:'3.8C',q:`What happens right after the ranger tips the cooler?`,tr:`¿Qué pasa justo después de que la guardaparques inclina la hielera?`,c:[`The tiny turtles tumble onto the sand.`,`A wave carries the first turtle out to sea.`,`Rosa squeezes her dad's hand.`,`Rosa decides to come back every year.`],e:[`Dozens of tiny gray turtles, each no bigger than a cookie, tumbled onto the sand.`],x:[`The next sentence tells what happens: the turtles tumble onto the sand. The other events happen later.`,`La oración siguiente dice lo que pasa: las tortugas caen a la arena. Lo demás pasa después.`]},
// Pair A: p8 + p9
{p:'pA',s:'3.6H',q:`What do both texts show about the hatchlings?`,tr:`¿Qué muestran ambos textos sobre las crías?`,c:[`People keep the eggs safe until the turtles can reach the water.`,`The hatchlings are carried into the sea by workers.`,`The hatchlings hatch in only a few days.`,`Coyotes help the turtles find the water.`],e:[[0,`When they find one, they carefully move the eggs to a protected area.`],[1,`"These hatchlings came from eggs we protected," she said.`]],x:[`Text 1 says workers move eggs to a protected area. Text 2 shows a ranger releasing turtles from protected eggs.`,`El Texto 1 dice que los trabajadores llevan los huevos a un área protegida. El Texto 2 muestra a una guardaparques soltando crías de huevos protegidos.`]},
{p:'pA',s:'3.6H',q:`How does Text 1 help readers understand why Rosa wants to come back every year?`,tr:`¿Cómo ayuda el Texto 1 a entender por qué Rosa quiere regresar cada año?`,c:[`It explains that female turtles may return to the same beach to lay eggs.`,`It explains that turtles lay about 100 eggs.`,`It explains that Kemp's ridleys are small.`,`It explains that coyotes eat turtle eggs.`],e:[[0,`Crawling across the sand may help them remember the beach, and scientists believe that the females may return to the same area to lay their own eggs years later.`],[1,`She decided right then that she would come back every year, just in case.`]],x:[`Text 1 says females may return to the same beach. That is why Rosa hopes to see the turtle again.`,`El Texto 1 dice que las hembras pueden volver a la misma playa. Por eso Rosa espera ver otra vez a la tortuga.`]},
{p:'pA',s:'3.6H',q:`Which idea is found in both texts?`,tr:`¿Qué idea aparece en ambos textos?`,c:[`The hatchlings crawl across the sand to the sea on their own.`,`Rosa's family visits Padre Island every spring.`,`Each turtle digs a nest with her back flippers.`,`The turtles are no bigger than a cookie.`],e:[[0,`Workers release the hatchlings on the beach so they can crawl to the water on their own.`],[1,`Soon all the hatchlings were scrambling toward the water.`]],x:[`Text 1 explains that hatchlings crawl to the water on their own, and Text 2 shows them scrambling to the waves.`,`El Texto 1 explica que las crías gatean solas hasta el agua, y el Texto 2 las muestra corriendo hacia las olas.`]},
// p10 Bluebonnets (alone)
{p:'p10',s:'3.9Di',q:`What is the central idea of "Bluebonnets: The Texas State Flower"?`,tr:`¿Cuál es la idea central de "El bluebonnet: la flor estatal de Texas"?`,c:[`Bluebonnets are tough Texas flowers that are important to people and nature.`,`Pioneer women wore bonnets long ago.`,`Bees collect pollen from many flowers.`,`Families like to take pictures in spring.`],e:[`Bluebonnets help other living things, too.`],x:[`The article tells how bluebonnets grow, how they help nature, and why people care about them.`,`El artículo cuenta cómo crecen los bluebonnets, cómo ayudan a la naturaleza y por qué la gente los cuida.`]},
{p:'p10',s:'3.9Di',q:`Which detail supports the idea that bluebonnets help other living things?`,tr:`¿Qué detalle apoya la idea de que los bluebonnets ayudan a otros seres vivos?`,c:[`Bees visit the flowers to collect pollen.`,`The flowers bloom in March and April.`,`Their petals look like sun hats.`,`Families take pictures in bluebonnet fields.`],e:[`Bees visit the flowers to collect pollen.`],x:[`Bees are living things, and the flowers give them pollen.`,`Las abejas son seres vivos, y las flores les dan polen.`]},
{p:'p10',s:'3.3B',q:`In paragraph 4, what does the word "tradition" mean?`,tr:`En el párrafo 4, ¿qué significa la palabra "tradición"?`,c:[`something people do year after year`,`a kind of camera`,`a field of flowers`,`a rule about walking`],e:[`It has become a tradition, something people do year after year.`],x:[`The words after the comma explain the word: something people do year after year.`,`Las palabras después de la coma explican la palabra: algo que la gente hace año tras año.`]},
{p:'p10',s:'3.6G',q:`What is the most important idea in paragraph 2?`,tr:`¿Cuál es la idea más importante del párrafo 2?`,c:[`Bluebonnets are tough plants that grow slowly and bloom in spring.`,`The seeds sprout in the fall.`,`The flowers bloom in April.`,`Seeds stay in the ground.`],e:[`Bluebonnets are tough plants.`],x:[`The first sentence states the key idea, and the other sentences give details about it.`,`La primera oración dice la idea clave y las demás dan detalles.`]},
// p11 Abuelo's Bluebonnet Picture (alone)
{p:'p11',s:'3.8B',q:`How does Sofía's understanding of Abuelo change by the end of the story?`,tr:`¿Cómo cambia lo que Sofía entiende de Abuelo al final del cuento?`,c:[`She understands why the yearly picture is important to him.`,`She learns that Abuelo does not like flowers.`,`She decides that Abuelo's camera is too old.`,`She realizes Abuelo is upset with her.`],e:[`For the first time, she understood why Abuelo never missed a year.`],x:[`Looking at all the pictures together, Sofía finally understands why the tradition matters to Abuelo.`,`Al ver todas las fotos juntas, Sofía por fin entiende por qué la tradición es importante para Abuelo.`]},
{p:'p11',s:'3.6F',q:`Why does Abuelo hold Sofía's shoulder in paragraph 3?`,tr:`¿Por qué Abuelo detiene a Sofía del hombro en el párrafo 3?`,c:[`He wants to stop her from running onto the flowers.`,`He is afraid she will get lost.`,`He wants her to look at the camera.`,`He needs help walking.`],e:[`Sofía wanted to run straight into the middle of it.`],x:[`Sofía wants to run into the field, and Abuelo tells her to walk on the path so the flowers are not crushed.`,`Sofía quiere correr por el campo, y Abuelo le pide caminar por el sendero para no aplastar las flores.`]},
// Pair B: p10 + p11
{p:'pB',s:'3.6H',q:`What do both texts suggest about visiting bluebonnet fields?`,tr:`¿Qué sugieren ambos textos sobre visitar los campos de bluebonnets?`,c:[`Visitors should be careful not to crush the flowers so they can make seeds.`,`Visitors should pick flowers to take home.`,`Visitors should only come in the fall.`,`Visitors should bring bees to the field.`],e:[[0,`Visitors are asked to step carefully so they do not crush the plants.`],[1,`"If we crush the flowers, they can't make seeds for next year."`]],x:[`Text 1 asks visitors to step carefully, and in Text 2 Abuelo tells Sofía to walk on the path for the same reason.`,`El Texto 1 pide a los visitantes caminar con cuidado, y en el Texto 2 Abuelo le pide lo mismo a Sofía por la misma razón.`]},
{p:'pB',s:'3.6H',q:`How does Text 2 show the tradition described in Text 1?`,tr:`¿Cómo muestra el Texto 2 la tradición que se describe en el Texto 1?`,c:[`Sofía's family takes a picture in the same field every spring.`,`Sofía plants bluebonnet seeds in the fall.`,`Abuelo buys a new camera each year.`,`The family visits a different field each year.`],e:[[0,`It has become a tradition, something people do year after year.`],[1,`Every spring, Abuelo took a picture of the family in the same field outside of town.`]],x:[`Text 1 says families take pictures each spring. Text 2 shows one family doing exactly that.`,`El Texto 1 dice que las familias se toman fotos cada primavera. El Texto 2 muestra a una familia haciéndolo.`]},
{p:'pB',s:'3.6H',q:`Using both texts, why can bluebonnets bloom in the same field year after year?`,tr:`Usando ambos textos, ¿por qué los bluebonnets pueden florecer en el mismo campo año tras año?`,c:[`The flowers make seeds that can sprout into new plants the next year.`,`Workers plant new flowers every spring.`,`Bluebonnets never die.`,`Families water the field every day.`],e:[[0,`Their seeds have hard coats, and they can stay in the ground for years before they sprout.`],[1,`"If we crush the flowers, they can't make seeds for next year."`]],x:[`Text 1 explains the seeds, and Text 2 shows that the flowers need to make seeds for next year. Together they explain the yearly bloom.`,`El Texto 1 explica las semillas, y el Texto 2 muestra que las flores necesitan hacer semillas para el año siguiente.`]}];


/* ---------- reading engine helpers ---------- */
function splitS(text){const out=[];let st=0;const abbr=/\b(Mr|Ms|Mrs|Dr|St)\.$/;
  for(let i=0;i<text.length;i++){const ch=text[i];if(ch!=='.'&&ch!=='!'&&ch!=='?')continue;let j=i+1;
    while(j<text.length&&'.!?'.includes(text[j]))j++;while(j<text.length&&'"”)'.includes(text[j]))j++;
    if(j>=text.length)break;if(text[j]!==' ')continue;let k=j;while(text[k]===' ')k++;
    if(!/[A-Z"“(¿¡ÁÉÍÓÚÑ]/.test(text[k]||''))continue;if(abbr.test(text.slice(st,j)))continue;
    out.push(text.slice(st,j).trim());st=k;i=k-1}
  const last=text.slice(st).trim();if(last)out.push(last);return out}
const unitsOf=T=>T.b.flatMap(b=>T.g==='poem'?b.split('\n'):splitS(b));
const blockOf=(T,s)=>T.b.findIndex(b=>b.includes(s))+1;
function passOf(pid){const ids=PAIRS[pid]||[pid];return{pair:!!PAIRS[pid],ids,texts:ids.map(i=>PS[i]),es:ids.map(i=>Object.assign({},PS[i],PSES[i]))}}
function textHTML(T,hl,label){let h=`<section class="ptext">${label?`<p class="eyebrow">${label}</p>`:''}<h3>${esc(T.t)}</h3><span class="genre">${tx(GEN[T.g])}</span>`;
  T.b.forEach((blk,i)=>{let s=blk;for(const e0 of hl){const e=tx(e0);if(e&&s.includes(e))s=s.replace(e,'\u0001'+e+'\u0002')}s=esc(s);
    if(T.g==='drama')s=s.replace(/^([A-Z][A-Z]+):/,'<b>$1:</b>').replace(/\(([^)]*)\)/g,'<i>($1)</i>');
    s=s.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
    h+=`<div class="pb${T.g==='poem'?' poem':''}"><span class="pn">${i+1}</span><p>${s}</p></div>`});
  return h+'</section>'}
function passageHTML(P,hl){let h=`<div class="passage" tabindex="0" aria-label="${esc(tx(L('Reading passage','Texto de lectura')))}">`;
  (S.lang==='es'?P.es:P.texts).forEach((T,i)=>{h+=textHTML(T,hl,P.pair?tx(L(`Text ${i+1}`,`Texto ${i+1}`)):'')});
  return h+'</div>'}

 '3.6F':L('Find a clue in the text, then add what you already know to figure out what the author does not say directly.','Busca una pista en el texto y súmale lo que ya sabes para descubrir lo que el autor no dice directamente.'),
 '3.6G':L('Ask which detail matters most. A key idea helps you understand the whole text or the big change, not just one small part.','Pregúntate qué detalle importa más. Una idea clave te ayuda a entender todo el texto o el gran cambio, no solo una parte pequeña.'),
 '3.3B':L('Reread the sentence and the ones around it. Try each answer in place of the word and see which one makes sense.','Vuelve a leer la oración y las que están cerca. Prueba cada respuesta en lugar de la palabra y ve cuál tiene sentido.'),
 '3.9Di':L('The central idea is what the whole article is mostly about. Supporting evidence is a fact or detail that proves it.','La idea central es de lo que trata principalmente todo el artículo. La evidencia de apoyo es un dato o detalle que lo demuestra.'),
 '3.6H':L('Find what each text says about the topic, then put the two ideas together.','Busca lo que dice cada texto sobre el tema y luego junta las dos ideas.'),
 '3.8B':L('Look at what characters say and do to each other. How does one character change how another one thinks or acts?','Fíjate en lo que los personajes se dicen y se hacen. ¿Cómo cambia un personaje lo que otro piensa o hace?'),
 '3.8C':L('The problem (conflict) is what the character must fix. The events happen in order. The solution (resolution) is how the problem is fixed.','El problema (conflicto) es lo que el personaje debe arreglar. Los sucesos pasan en orden. La solución (resolución) es cómo se arregla el problema.'),
 '3.10A':L('Ask yourself: why did the author write this, and what lesson or big idea should readers take away?','Pregúntate: ¿por qué el autor escribió esto y qué lección o gran idea quiere que se lleven los lectores?'),
 '3.9E':L('The claim is what the author wants you to believe. A fact can be proven. An opinion tells what someone thinks or feels.','La afirmación es lo que el autor quiere que creas. Un hecho se puede comprobar. Una opinión dice lo que alguien piensa o siente.')};

const DECK={};
function drawItem(sk){const all=IT.map((it,i)=>i).filter(i=>IT[i].s===sk);
  if(typeof mode!=='undefined'&&mode.t==='check'){if(!mode.used)mode.used=new Set(PAIRS[pick(['pA','pB'])]);
    const fit=all.filter(i=>passOf(IT[i].p).ids.every(id=>mode.used.has(id)));const k=fit.length?pick(fit):pick(all);passOf(IT[k].p).ids.forEach(id=>mode.used.add(id));return k}
  if(!DECK[sk]||!DECK[sk].length){const last=DECK[sk+'_last'];DECK[sk]=shuf(all);if(DECK[sk].length>1&&DECK[sk][DECK[sk].length-1]===last)DECK[sk].unshift(DECK[sk].pop())}
  const k=DECK[sk].pop();DECK[sk+'_last']=k;return k}
const LIT=['fic','folk','poem','drama'];
function readQ(sk){const k=drawItem(sk),it=IT[k],es=ITES[k],P=passOf(it.p);
  const ch=it.c.map((c,i)=>L(c,es.c[i])),m=mc(ch[0],ch.slice(1));
  const evs=it.e.map((e,i)=>{const t=Array.isArray(e)?e[0]:0;return{t,en:Array.isArray(e)?e[1]:e,es:Array.isArray(es.e[i])?es.e[i][1]:es.e[i]}});
  const where=evs.map(e=>{const T=P.texts[e.t],u=unitOf(T.g),n=blockOf(T,e.en);return P.pair?L(`Text ${e.t+1}, ${u.en} ${n}`,`Texto ${e.t+1}, ${u.es} ${n}`):L(`${u.en} ${n}`,`${u.es} ${n}`)});
  const q=L(it.q,es.q||it.tr),x=L(it.x[0],es.x||it.x[1]);
  const g=evs.map((e,i)=>{const pe=shuf(unitsOf(P.texts[e.t]).filter(s=>s!==e.en&&s.length>=24)),ps=shuf(unitsOf(P.es[e.t]).filter(s=>s!==e.es&&s.length>=24));
    const right=L(e.en,e.es),em=mc(right,[0,1,2].map(j=>L(pe[j],ps[j])));
    const st=S1(SKP[it.s][Math.min(i,SKP[it.s].length-1)],em.ans,J(L('Look at ','Revisa: '),where[i],'.'),{choices:em.choices});st.ev=[right];st.at=right;return st});
  g.push(S1(q,m.ans,SKS[it.s],{choices:m.choices}));
  const whereAll=where.length>1?J(where[0],L(' and ',' y '),where[1]):where[0];
  const quote=s=>s.startsWith('"')?s:`“${s}”`;
  const lit=!P.pair&&LIT.includes(P.texts[0].g);
  return{type:'mc',text:q,pre:hl=>passageHTML(P,hl),choices:m.choices,ans:m.ans,ansText:ch[0],evs:evs.map(e=>L(e.en,e.es)),
    exLabel:lit?L('Story','Cuento'):L('Reading Passage','Lectura'),
    hint:J(L('Reread ','Vuelve a leer: '),whereAll,'. ',SKS[it.s]),g,
    steps:[SKS[it.s],...evs.map(e=>P.pair?L(`Text ${e.t+1}: ${quote(e.en)}`,`Texto ${e.t+1}: ${quote(e.es)}`):L(`Evidence: ${quote(e.en)}`,`Evidencia: ${quote(e.es)}`)),x]}}
