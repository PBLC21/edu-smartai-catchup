const PSES={
p1:{t:`El problema del puesto de limonada`,b:[
`Nina tenía un plan para el sábado. Iba a vender limonada y ahorrar dinero para un balón de fútbol nuevo. Su hermanito, Teo, quería ayudar. "Tú puedes sostener el letrero", le dijo Nina.`,
`Nina puso su mesa al final de la calle Cedar. Echó hielo en la jarra y acomodó los vasos en una fila ordenada. Luego esperó. La calle estaba desierta. No pasó ni un carro ni una persona en toda la mañana.`,
`"Tal vez deberíamos irnos al parque", dijo Teo. "Mucha gente va allí los sábados."`,
`"Yo soy la que manda", dijo Nina. "El puesto se queda aquí." Pero al mediodía el hielo ya se había derretido y su frasco del dinero seguía vacío. Nina se sentó en la banqueta y suspiró.`,
`Teo se sentó junto a ella. "Los partidos de fútbol en el parque empiezan a la una", dijo en voz baja. "Los jugadores tienen sed."`,
`Nina miró a su hermano. Él tenía razón, y ella lo sabía. Juntos llevaron la mesa al parque. A las tres de la tarde ya no quedaba ni un vaso. Nina le dio a Teo la mitad del dinero. "La próxima vez", le dijo, "tú haces el plan."`]},
p2:{t:`Por qué el armadillo comparte su caparazón`,b:[
`Hace mucho tiempo, el Armadillo tenía el caparazón más duro de toda la tierra. Estaba muy orgulloso de él. Todos los días lo pulía hasta que brillaba como la luna.`,
`Una tarde, unas nubes oscuras cubrieron el cielo. Empezó a caer granizo, tan grande como piedritas. El Ratón, la Lagartija y la pequeña Codorniz corretearon por todas partes, buscando un lugar donde esconderse.`,
`"Por favor, Armadillo", chilló el Ratón. "¡Déjanos escondernos debajo de tu caparazón!"`,
`El Armadillo frunció el ceño. "Mi caparazón es para mí", dijo. "Me lo van a rayar." Se enrolló muy apretado y cerró los ojos.`,
`Entonces cayó una piedra de granizo justo al lado del nidito de la Codorniz. El Armadillo oyó llorar a los pollitos de la Codorniz. Pensó en lo asustados que debían estar. Poco a poco, el Armadillo se desenrolló y levantó su caparazón. "Entren todos", dijo.`,
`Cuando pasó la tormenta, el caparazón del Armadillo estaba lleno de golpecitos. Pero sus amigos le dieron las gracias una y otra vez. Desde ese día, al Armadillo le importaron más sus amigos que su caparazón brillante. Y por eso, todavía hoy, el caparazón del armadillo es disparejo en lugar de liso.`]},
p3:{t:`La cocina de Abuela`,b:[
`En la cocina de Abuela, el domingo al amanecer,\nchisporrotea el comal y empieza a oler.\nLas tortillas se inflan como lunitas,\nmientras Abuela tararea sus canciones favoritas.`,
`Pat, pat, pat, hacen sus manos ligeras,\ndándole forma a la masa a su manera.\nLas suyas salen redondas, pero las mías\nsalen chuecas y disparejas todavía.`,
`"Perfectas", me dice, y me guiña un ojo.\n"No importa la forma", me dice sin enojo.\nLas mejores tortillas, ahora lo sé,\nson las que hago con Abuela, una y otra vez.`]},
p4:{t:`El libro perdido de la biblioteca`,b:[
`(La biblioteca de la escuela. MARCO busca debajo de una mesa. LILY entra con una pila de libros.)`,
`LILY: Marco, ¿qué haces ahí abajo?`,
`MARCO: (susurrando) No encuentro mi libro de la biblioteca. Hay que devolverlo hoy, y la maestra Bell se va a enojar.`,
`LILY: ¿Ya buscaste en tu mochila?`,
`MARCO: ¡Tres veces! A lo mejor le digo a la maestra Bell que ya lo devolví.`,
`LILY: (moviendo la cabeza) Eso no sería verdad. Mejor volvamos sobre tus pasos. ¿Dónde lo leíste por última vez?`,
`MARCO: En el almuerzo. Lo leí mientras me comía mi sándwich. (Se detiene.) ¡Mi lonchera! Lo guardé en mi lonchera para que no se mojara.`,
`(MARCO sale corriendo y regresa con el libro en la mano.)`,
`MAESTRA BELL: (acercándose) ¿Todo bien, ustedes dos?`,
`MARCO: Ahora sí. Casi pierdo este libro, y casi digo una mentira. Lily me ayudó a encontrarlo de la manera honesta.`,
`MAESTRA BELL: (sonriendo) Entonces ustedes dos hacen un gran equipo.`]},
p5:{t:`El lagarto cornudo: pequeño pero fuerte`,b:[
`El lagarto cornudo de Texas es un reptil pequeño con una gran fama. Es el reptil oficial del estado de Texas. Mucha gente le dice "sapo cornudo", pero no es un sapo. Es un lagarto.`,
`Los lagartos cornudos tienen el cuerpo plano y redondo, cubierto de escamas con picos. Tienen dos cuernos largos en la parte de atrás de la cabeza. Sus colores arenosos los ayudan a confundirse con el suelo seco, así que a los depredadores les cuesta trabajo verlos.`,
`Cuando un depredador se acerca, el lagarto cornudo tiene maneras sorprendentes de defenderse. Primero, puede quedarse muy quieto. Si eso no funciona, puede inflar su cuerpo como un globo para parecer demasiado grande para tragárselo. Como último truco, ¡puede lanzar un chorrito de sangre por los ojos! La sangre les sabe horrible a los coyotes y a los perros.`,
`Los lagartos cornudos comen sobre todo hormigas cosechadoras. Un solo lagarto puede comerse docenas de hormigas en una comida. Su lengua pegajosa lo ayuda a atrapar rápido a los insectos diminutos.`,
`Hoy es más difícil encontrar lagartos cornudos en Texas que antes. Muchas de las hormigas que comen han desaparecido, y parte de su hábitat, o hogar natural, se ha convertido en calles y edificios. Científicos y voluntarios trabajan para proteger a estos pequeños y fuertes lagartos.`]},
p6:{t:`Nuestra ciudad debería construir un área de chapoteo`,b:[
`Cada verano, la temperatura en nuestra ciudad sube a más de 100 grados. Los niños necesitan un lugar seguro y fresco para jugar afuera. Nuestra ciudad debería construir un área de chapoteo en el Parque Central.`,
`Un área de chapoteo es un lugar de juegos con fuentes y rociadores, pero sin agua profunda. Como no hay agua profunda, un área de chapoteo es más segura que una alberca para los niños pequeños. Además, las áreas de chapoteo no necesitan salvavidas, así que cuesta menos mantenerlas.`,
`Las áreas de chapoteo ayudan a que los niños se mantengan activos. Los médicos dicen que los niños deben hacer por lo menos una hora de ejercicio al día. En los días de mucho calor, muchos niños se quedan adentro. Un área de chapoteo les daría una razón divertida para correr, brincar y jugar.`,
`Algunas personas dicen que un área de chapoteo desperdiciaría agua. Sin embargo, muchas áreas de chapoteo limpian y reutilizan la misma agua una y otra vez. Usar el agua más de una vez significa que se desperdicia menos.`,
`Un área de chapoteo es la mejor idea para nuestra comunidad. Creo que sería lo mejor que le ha pasado a nuestro parque en años. ¡El concejo de la ciudad debería votar que sí!`]},
p7:{t:`Todos los estudiantes necesitan una tarjeta de la biblioteca`,b:[
`La tarjeta de la biblioteca es gratis y abre la puerta a miles de libros. Todos los estudiantes de nuestra escuela deberían sacar una tarjeta de la biblioteca pública.`,
`Con una tarjeta de la biblioteca, los estudiantes pueden pedir prestados libros, audiolibros y películas gratis. Las familias no tienen que gastar dinero para encontrar algo nuevo que leer.`,
`Leer todos los días ayuda a los estudiantes a ser mejores lectores. Los maestros dicen que los estudiantes que leen un poco cada día mejoran más rápido que los que no leen.`,
`Las bibliotecas son más que libros. Muchas bibliotecas tienen ayuda gratis con la tarea, clases de computación y programas de lectura de verano con premios. Creo que los programas de lectura de verano son lo más divertido de todo el año.`,
`Algunos estudiantes dicen que ya tienen libros en casa. Eso es muy bueno, pero la biblioteca recibe libros nuevos cada mes, así que siempre hay algo emocionante por descubrir. Sacar una tarjeta de la biblioteca es fácil y es la decisión más inteligente que un estudiante puede tomar.`]},
p8:{t:`Las tortugas marinas de la isla del Padre`,b:[
`La isla del Padre, en la costa de Texas, es un lugar importante donde anidan las tortugas lora. Las tortugas lora son las tortugas marinas más pequeñas del mundo, y también están entre las que corren más peligro de extinción. Estar en peligro de extinción significa que quedan tan pocas que podrían desaparecer para siempre.`,
`Cada primavera, las tortugas hembras salen del golfo y se arrastran por la playa. Cada una cava un hoyo en la arena con sus aletas de atrás y pone unos 100 huevos. Luego tapa el nido y regresa al mar.`,
`Trabajadores de la playa y voluntarios vigilan estos nidos. Cuando encuentran uno, llevan los huevos con cuidado a un área protegida. Allí, los huevos están a salvo de depredadores como los coyotes y de la gente que maneja por la playa.`,
`Después de unos 50 días, nacen las tortuguitas. Los trabajadores sueltan a las crías en la playa para que lleguen gateando solas hasta el agua. Gatear por la arena podría ayudarlas a recordar la playa, y los científicos creen que las hembras podrían regresar a la misma zona a poner sus propios huevos años después.`]},
p9:{t:`La mañana de las crías`,b:[
`Rosa había esperado este día todo el verano. Su familia estaba detrás de una cuerda en la playa de la isla del Padre con muchas otras personas. Todos estaban callados.`,
`Una guardaparques llevó una hielera grande hasta la arena. "Estas crías salieron de huevos que nosotros protegimos", dijo. "Hoy empiezan su viaje."`,
`La guardaparques inclinó la hielera con cuidado. Docenas de tortuguitas grises, cada una no más grande que una galleta, cayeron sobre la arena. Por un momento no se movieron. Rosa contuvo la respiración.`,
`Entonces la primera tortuga empezó a mover sus aletas. Gateó hacia las olas y dejó unas huellitas detrás. Pronto todas las crías corrían hacia el agua. Llegó una ola y se llevó a la primera mar adentro.`,
`Rosa le apretó la mano a su papá. "¿Las volveremos a ver?", preguntó.`,
`"Tal vez", dijo la guardaparques, que la había oído. "Si esa es hembra, a lo mejor algún día regresa a esta misma playa a poner sus huevos." Rosa sonrió. En ese momento decidió que regresaría cada año, por si acaso.`]},
p10:{t:`El bluebonnet: la flor estatal de Texas`,b:[
`Cada primavera, los campos junto a las carreteras de Texas se pintan de azul. El color viene de los bluebonnets, la flor estatal de Texas. Los bluebonnets recibieron su nombre porque sus pétalos parecen los gorros para el sol que usaban las mujeres pioneras hace mucho tiempo.`,
`Los bluebonnets son plantas resistentes. Sus semillas tienen una cubierta dura y pueden quedarse en la tierra durante años antes de brotar. Las semillas casi siempre brotan en el otoño. Las plantitas crecen despacio durante el invierno, y las flores se abren en marzo y abril.`,
`Los bluebonnets también ayudan a otros seres vivos. Las abejas visitan las flores para juntar polen. Las plantas también le dan nutrientes a la tierra, y eso ayuda a crecer a otras plantas.`,
`Muchas familias de Texas se toman fotos en los campos de bluebonnets cada primavera. Se ha vuelto una tradición, algo que la gente hace año tras año. A los visitantes se les pide caminar con cuidado para no aplastar las plantas. Así, las flores pueden hacer semillas para la siguiente primavera.`]},
p11:{t:`La foto de los bluebonnets de Abuelo`,b:[
`El primer sábado caluroso de abril, Abuelo tocó el claxon de la camioneta. "¡Vámonos, Sofía!", gritó. "Los bluebonnets nos esperan."`,
`Cada primavera, Abuelo le tomaba una foto a la familia en el mismo campo, a las afueras del pueblo. Sofía había visto todas las fotos viejas. En una, su mamá era bebé. En otra, Abuelo tenía el pelo negro en lugar de canoso.`,
`Cuando llegaron, el campo parecía un océano azul. Sofía quería correr directo hasta el centro. Abuelo la detuvo con cariño del hombro. "Camina por el sendero, mija", le dijo. "Si aplastamos las flores, no pueden hacer semillas para el próximo año."`,
`Sofía caminó con cuidado y se sentó a la orilla de las flores. Abuelo preparó su cámara vieja. "¡Sonrían!", dijo. Clic.`,
`Esa noche, Sofía puso la foto nueva en el álbum. Miró todas las primaveras juntas, una tras otra. Por primera vez, entendió por qué Abuelo nunca faltaba ni un año.`]}};

{c:[`Los lagartos cornudos son reptiles poco comunes de Texas con maneras especiales de sobrevivir.`,`Los lagartos cornudos son un tipo de sapo que vive en Texas.`,`A los coyotes y a los perros no les gusta el sabor de la sangre.`,`Las hormigas cosechadoras viven en lugares secos.`],e:[`El lagarto cornudo de Texas es un reptil pequeño con una gran fama.`]},

{c:[`Nuestra ciudad debería construir un área de chapoteo en el Parque Central.`,`Los niños deben hacer una hora de ejercicio al día.`,`Las albercas necesitan salvavidas.`,`Los veranos son muy calurosos.`],e:[`Nuestra ciudad debería construir un área de chapoteo en el Parque Central.`]},

{c:[`Un área de chapoteo es la mejor idea para nuestra comunidad.`,`Cada verano, la temperatura en nuestra ciudad sube a más de 100 grados.`,`Los médicos dicen que los niños deben hacer por lo menos una hora de ejercicio al día.`,`Un área de chapoteo es un lugar de juegos con fuentes y rociadores, pero sin agua profunda.`],e:[`Un área de chapoteo es la mejor idea para nuestra comunidad.`]},

{c:[`Creo que los programas de lectura de verano son lo más divertido de todo el año.`,`Con una tarjeta de la biblioteca, los estudiantes pueden pedir prestados libros, audiolibros y películas gratis.`,`Muchas bibliotecas tienen ayuda gratis con la tarea, clases de computación y programas de lectura de verano con premios.`,`La tarjeta de la biblioteca es gratis y abre la puerta a miles de libros.`],e:[`Creo que los programas de lectura de verano son lo más divertido de todo el año.`]},

{c:[`Las tortugas lora están en peligro de extinción, así que la gente trabaja para proteger sus nidos.`,`A los coyotes les gusta comer huevos de tortuga.`,`La isla del Padre es un buen lugar para ir de vacaciones.`,`Las tortugas marinas tienen aletas de atrás.`],e:[`Las tortugas lora son las tortugas marinas más pequeñas del mundo, y también están entre las que corren más peligro de extinción.`]},
{c:[`Trabajadores de la playa y voluntarios vigilan estos nidos.`,`Cada primavera, las tortugas hembras salen del golfo y se arrastran por la playa.`,`Después de unos 50 días, nacen las tortuguitas.`,`Cada una pone unos 100 huevos.`],e:[`Trabajadores de la playa y voluntarios vigilan estos nidos.`]},
{c:[`quedan tan pocas que podrían desaparecer para siempre`,`son muy peligrosas para las personas`,`pueden nadar muy rápido`,`solo viven en las playas`],e:[`Estar en peligro de extinción significa que quedan tan pocas que podrían desaparecer para siempre.`]},
{c:[`Los depredadores y los carros podrían dañar los huevos en la playa abierta.`,`Los huevos nacen después de unos 50 días.`,`La tortuga mamá usa sus aletas de atrás.`,`Las tortugas lora son las tortugas marinas más pequeñas.`],e:[`Allí, los huevos están a salvo de depredadores como los coyotes y de la gente que maneja por la playa.`]},

{c:[`Le da esperanza y una razón para regresar.`,`La pone triste porque las tortugas se van.`,`Hace que Rosa quiera ser guardaparques en ese momento.`,`La hace enojar porque no puede quedarse con una tortuga.`],e:[`"Si esa es hembra, a lo mejor algún día regresa a esta misma playa a poner sus huevos."`]},

// pA
{c:[`La gente protege los huevos hasta que las tortugas pueden llegar al agua.`,`Los trabajadores llevan a las crías cargando hasta el mar.`,`Las crías nacen en unos pocos días.`,`Los coyotes ayudan a las tortugas a encontrar el agua.`],e:[[0,`Cuando encuentran uno, llevan los huevos con cuidado a un área protegida.`],[1,`"Estas crías salieron de huevos que nosotros protegimos", dijo.`]]},
{c:[`Explica que las hembras pueden regresar a la misma playa a poner huevos.`,`Explica que las tortugas ponen unos 100 huevos.`,`Explica que las tortugas lora son pequeñas.`,`Explica que los coyotes comen huevos de tortuga.`],e:[[0,`Gatear por la arena podría ayudarlas a recordar la playa, y los científicos creen que las hembras podrían regresar a la misma zona a poner sus propios huevos años después.`],[1,`En ese momento decidió que regresaría cada año, por si acaso.`]]},
{c:[`Las crías gatean solas por la arena hasta el mar.`,`La familia de Rosa visita la isla del Padre cada primavera.`,`Cada tortuga cava un nido con sus aletas de atrás.`,`Las tortugas no son más grandes que una galleta.`],e:[[0,`Los trabajadores sueltan a las crías en la playa para que lleguen gateando solas hasta el agua.`],[1,`Pronto todas las crías corrían hacia el agua.`]]},

{c:[`Los bluebonnets son flores resistentes de Texas, importantes para la gente y la naturaleza.`,`Las mujeres pioneras usaban gorros hace mucho tiempo.`,`Las abejas juntan polen de muchas flores.`,`A las familias les gusta tomarse fotos en primavera.`],e:[`Los bluebonnets también ayudan a otros seres vivos.`]},

{c:[`algo que la gente hace año tras año`,`un tipo de cámara`,`un campo de flores`,`una regla para caminar`],e:[`Se ha vuelto una tradición, algo que la gente hace año tras año.`]},

{c:[`Entiende por qué la foto de cada año es importante para él.`,`Aprende que a Abuelo no le gustan las flores.`,`Decide que la cámara de Abuelo es demasiado vieja.`,`Se da cuenta de que Abuelo está enojado con ella.`],e:[`Por primera vez, entendió por qué Abuelo nunca faltaba ni un año.`]},

{c:[`Los visitantes deben tener cuidado de no aplastar las flores para que puedan hacer semillas.`,`Los visitantes deben cortar flores para llevárselas.`,`Los visitantes solo deben ir en el otoño.`,`Los visitantes deben llevar abejas al campo.`],e:[[0,`A los visitantes se les pide caminar con cuidado para no aplastar las plantas.`],[1,`"Si aplastamos las flores, no pueden hacer semillas para el próximo año."`]]},
{c:[`La familia de Sofía se toma una foto en el mismo campo cada primavera.`,`Sofía siembra semillas de bluebonnet en el otoño.`,`Abuelo compra una cámara nueva cada año.`,`La familia visita un campo diferente cada año.`],e:[[0,`Se ha vuelto una tradición, algo que la gente hace año tras año.`],[1,`Cada primavera, Abuelo le tomaba una foto a la familia en el mismo campo, a las afueras del pueblo.`]]},
{c:[`Las flores hacen semillas que pueden brotar y convertirse en plantas nuevas al año siguiente.`,`Unos trabajadores siembran flores nuevas cada primavera.`,`Los bluebonnets nunca se mueren.`,`Las familias riegan el campo todos los días.`],e:[[0,`Sus semillas tienen una cubierta dura y pueden quedarse en la tierra durante años antes de brotar.`],[1,`"Si aplastamos las flores, no pueden hacer semillas para el próximo año."`]]}];

  watch:L('Joining two sentences with only a comma is a mistake. Add a connecting word like and, but, or so.','Unir dos oraciones solo con una coma es un error. Agrega una palabra de enlace como and, but o so.')},
'3.2B':{idea:[L("Homophones sound the same but are spelled differently and mean different things: their / there / they're. Decide what the sentence means, then pick the spelling.",'Los homófonos suenan igual, pero se escriben distinto y significan cosas distintas: their / there / they\'re. Decide qué quiere decir la oración y luego escoge la ortografía.'),
  L('A contraction joins two words with an apostrophe: do not → don\'t. A compound word joins two words with no space: sun + flower → sunflower.','Una contracción une dos palabras con un apóstrofo: do not → don\'t. Una palabra compuesta une dos palabras sin espacio: sun + flower → sunflower.'),
  M('Suffix rules:\ndrop e:      hope + ing → hoping\nchange y→i:  happy + ness → happiness\ndouble:      stop + ed → stopped')],
  vocab:[['homophone','homófono'],['contraction','contracción'],['compound word','palabra compuesta'],['suffix','sufijo']],
  watch:L('In a contraction, the apostrophe goes where the letters were taken out: did not → didn\'t, not did\'nt.','En una contracción, el apóstrofo va donde se quitaron letras: did not → didn\'t, no did\'nt.')}};

const LES_ES={
'3.11Di':{idea:['Una oración completa tiene sujeto (quién o qué) y predicado (lo que hace), y expresa una idea completa.',M('Concordancia:  El perro ladra.   Los perros ladran.\nLa caja de libros está aquí.  (caja = una)'),
  'Una oración compuesta une dos ideas completas con una palabra de enlace: y, pero, así que. Antes de "pero" y "así que" va coma.',
  'Un fragmento es solo una parte de una oración, como "Porque el autobús llegó tarde." Únelo a una oración completa.'],
  vocab:[['subject','sujeto'],['verb','verbo'],['agreement','concordancia'],['fragment','fragmento']],
  watch:'Si el sujeto es uno, el verbo va en singular (ella corre). Si son varios, va en plural (ellas corren).'},
'3.11Dii':{idea:['El tiempo verbal dice cuándo pasa una acción.',
  M('Pasado:    Ayer, Ana jugó en el parque.\nPresente:  Todos los días, Ana juega en el parque.\nFuturo:    Mañana, Ana jugará en el parque.'),
  'Las pistas de tiempo como ayer, todos los días y mañana te dicen qué tiempo usar. Fíjate también en el sujeto: Ana juega, mis amigos juegan.',
  M('Ser: cómo es, quién es, de dónde es → Mi hermana es alta.\nEstar: dónde está, cómo se siente ahora → La sopa está caliente.')],
  vocab:[['past tense','pasado (pretérito)'],['future tense','futuro'],['to be (permanent)','ser'],['to be (state or place)','estar']],
  watch:'Muchos verbos en pretérito y en futuro llevan tilde: jugó, comió, jugará. Para la ubicación siempre se usa estar: El perro está en el jardín.'},
'3.11C':{idea:['Revisar hace que la escritura sea más clara. En STAAR, escoges el mejor cambio para el borrador de un estudiante.',
  M('Combinar:  Mía corrió. Mía saltó. → Mía corrió y saltó.\nConectar:  Sin embargo, / Por ejemplo, / Como resultado, / Después,'),
  'Combina oraciones cortas que repiten palabras. Usa transiciones para mostrar cómo se conectan las ideas. Deja solo los detalles que hablan de la idea principal.'],
  vocab:[['revise','revisar'],['combine','combinar'],['transition','transición'],['main idea','idea principal']],
  watch:'Unir dos oraciones solo con una coma es un error. Combinar bien quita las palabras repetidas.'},
'3.2B':{idea:['Los homófonos suenan igual, pero se escriben distinto y significan cosas distintas: tuvo / tubo, hola / ola. Decide qué quiere decir la oración y luego escoge la ortografía.',
  'Para saber si una palabra lleva tilde (acento escrito), busca la sílaba que suena más fuerte, la sílaba tónica:',
  M('aguda (última sílaba): tilde si termina en n, s o vocal → can-CIÓN\nllana o grave (penúltima): tilde si NO termina en n, s o vocal → ÁR-bol\nesdrújula (antepenúltima): siempre lleva tilde → MÚ-si-ca')],
  vocab:[['homophone','homófono'],['accent mark','tilde'],['stressed syllable','sílaba tónica'],['syllable','sílaba']],
  watch:'Di la palabra en voz alta y aplaude las sílabas. La sílaba más fuerte decide la regla.'}};


const GRAM=['3.11Di','3.11Dii','3.11C','3.2B'];const GEN_EN={};for(const id of GRAM){GEN_EN[id]=G[id];G[id]=()=>S.lang==='es'?GES[id]():GEN_EN[id]()}
Object.assign(U,{learn:L('Learn','Aprende'),guided:L('Guided practice','Práctica guiada'),own:L('On my own','Por mi cuenta'),
 words:L('Key words','Palabras clave'),watch:L('Watch out','Cuidado'),example:L('Example','Ejemplo'),
 showStep:L('Show next step','Ver siguiente paso'),answerIs:L('Answer:','Respuesta:'),tryTogether:L('Try one together','Hagamos uno juntos'),another:L('Another example','Otro ejemplo'),
 stepOf:(i,n)=>L(`Step ${i} of ${n}`,`Paso ${i} de ${n}`),check1:L('Check step','Revisar paso'),stepHint:L('Hint:','Pista:'),
 shown:L('Here is this step. Read it, then continue.','Aquí está este paso. Léelo y luego continúa.'),cont:L('Continue','Continuar'),
 solved:L('Solved together!','¡Lo resolvimos juntos!'),solvedB:(n,h)=>L(`${n} steps, ${h} with help.`,`${n} pasos, ${h} con ayuda.`),
 readyOwn:L('Nice work with no help. You are ready to try one on your own.','Buen trabajo sin ayuda. Ya puedes intentar uno por tu cuenta.'),
 oneMore:L('Try one more guided problem before working on your own.','Haz otro problema guiado antes de trabajar por tu cuenta.'),
 anotherG:L('Another guided problem','Otro problema guiado'),goOwn:L('Try one on my own','Intentar uno por mi cuenta'),
 walk:L('Walk me through a similar one','Guíame con uno parecido'),review:L('Review the lesson','Repasar la lección'),
 stage:L('How to study each skill: read the lesson, solve one or two together, then practice on your own.','Cómo estudiar cada habilidad: lee la lección, resuelve uno o dos juntos y luego practica por tu cuenta.')});

/* ---------- state ---------- */
const prog=id=>S.p[id]||(S.p[id]={a:0,c:0,s:0,m:false,chk:null});
function status(id){const p=S.p[id];if(!p)return'new';if(p.m)return'mastered';if(p.chk===false||(p.a>=3&&p.c/p.a<.6))return'gap';if(p.a>0)return'working';if(p.chk===true)return'ok';return'new'}
function nextUp(exclude){for(const want of['gap','working','new','ok'])for(const id of ORDER)if(id!==exclude&&status(id)===want)return id;return null}
let mode={t:'study'};let cur=null;let resetArm=null;
function setView(view){cur.view=view;cur.err=false;cur.ps=0;cur.mk=0;
  if(view==='learn'){cur.ex=G[cur.id]();cur.exStep=1}
  else if(view==='guided'){cur.gq=G[cur.id]();cur.gi=0;cur.gt=0;cur.gshow=false;cur.gval='';cur.gpick=null;cur.glog=[]}
  else{cur.q=G[cur.id]();cur.done=false;cur.pick=null;cur.hint=false;cur.res=null;cur.val='';cur.justMastered=false}}
function openSkill(id,view){cur={id};if(!view){const st=status(id);view=(st==='new'||st==='gap')?'learn':'practice'}setView(view)}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
function renderChrome(){document.documentElement.lang=S.lang;$('#home-txt').textContent=S.lang==='es'?'Todos los grados':'All grades';$('#ttl-lv').textContent=S.lang==='es'?TTL_ES:TTL_EN;$('#sub').textContent=tx(U.sub);
  $('#lang-en').setAttribute('aria-pressed',S.lang==='en');$('#lang-es').setAttribute('aria-pressed',S.lang==='es');
  $('#btn-check').textContent=tx(U.check);$('#btn-reset').textContent=tx(resetArm?U.resetSure:U.reset);$('#btn-reset').classList.toggle('warn',!!resetArm);
  $('#foot').textContent=tx(U.foot)}
function renderMap(){const nu=nextUp();let h=`<h2>${tx(U.map)}</h2><p class="note">${tx(U.mapNote)}</p>`;
  for(const c of CATS){h+=`<div class="cat"><div class="cat-h"><span>${tx(c.n)}</span><b>${tx(c.items)}</b></div>`;
    for(const id of c.sk){const st=status(id),p=S.p[id],on=cur&&cur.id===id&&mode.t==='study';
      h+=`<button class="sk" data-skill="${id}" aria-current="${on}"><span class="code">${id}</span><span class="nm">${tx(NAMES[id])}${id===nu&&!on?`<span class="nx">${tx(U.nextUp)}</span>`:''}</span><span class="pill st-${st}" title="${p&&p.a?p.c+'/'+p.a:''}">${tx(U[st])}</span></button>`}
    h+='</div>'}
  $('#map').innerHTML=h}
const lineHTML=s=>s&&s.m?`<span class="m">${esc(tx(s.m))}</span>`:esc(tx(s));
function stepsHTML(st,n){return`<ol class="steps">${st.slice(0,n??st.length).map(s=>`<li${s&&s.m?' class="m"':''}>${lineHTML(s)}</li>`).join('')}</ol>`}
function probHTML(q,hl){return(q.pre?q.pre(hl||[]):'')+`<p class="qtext">${esc(tx(q.text))}</p>`+(q.tr&&S.lang==='es'?`<p class="qtr">${esc(q.tr)}</p>`:'')+(q.disp?`<div class="vis">${q.disp()}</div>`:'')}
function choicesHTML(list,attr,sel,done,ans,mono){return`<div class="choices">${list.map((ch,i)=>{let cl='choice'+(mono?'':' txt');
  if(done){if(i===ans)cl+=' right';else if(i===sel)cl+=' wrongpick'}else if(i===sel)cl+=' sel';
  return`<button class="${cl}" ${attr}="${i}" ${done?'disabled':''}>${esc(tx(ch))}</button>`}).join('')}</div>`}
function tabsHTML(){return`<nav class="tabs" aria-label="stages">${[['learn',U.learn],['guided',U.guided],['practice',U.own]].map(([v,l],i)=>`<button data-view="${v}" aria-current="${cur.view===v}"><span class="tn">${i+1}</span>${tx(l)}</button>`).join('')}</nav>`}

function learnHTML(){const les=S.lang==='es'&&LES_ES[cur.id]?LES_ES[cur.id]:LES[cur.id],q=cur.ex,n=q.steps.length,all=cur.exStep>=n;
  let h=`<div class="lesson"><div class="idea">${les.idea.map(x=>x.m?`<div class="formula">${esc(tx(x.m))}</div>`:`<p>${esc(tx(x))}</p>`).join('')}</div>
    <div class="side"><div class="words"><h4>${tx(U.words)}</h4><dl>${les.vocab.map(([e,s])=>`<div><dt>${esc(S.lang==='en'?e:s)}</dt>${S.lang==='en'?`<dd>${esc(s)}</dd>`:''}</div>`).join('')}</dl></div>
    <div class="watch"><h4>${tx(U.watch)}</h4><p>${esc(tx(les.watch))}</p></div></div></div>`;
  h+=`<div class="example"><h3>${tx(q.exLabel||U.example)}</h3>${probHTML(q,cur.exStep>=2?q.evs:null)}${stepsHTML(q.steps,cur.exStep)}`;
  if(all)h+=`<p class="exans"><b>${tx(U.answerIs)}</b> <span class="m">${esc(tx(q.ansText))}</span></p>`;
  h+=`<div class="actions">${all?`<button class="btn primary" data-act="to-guided">${tx(U.tryTogether)} →</button><button class="btn" data-act="new-example">${tx(U.another)}</button>`:`<button class="btn primary" data-act="ex-step">${tx(U.showStep)}</button>`}</div></div>`;
  return h}

function guidedHTML(){const q=cur.gq,g=q.g,n=g.length;let h=probHTML(q,g.slice(0,cur.gi).flatMap(s=>s.ev||[]))+`<ol class="gsteps">`;
  for(let i=0;i<n&&i<=cur.gi;i++){const s=g[i];
    if(i<cur.gi){const lg=cur.glog[i];h+=`<li class="gs done"><span class="gn ${lg?'help':'ok'}">${lg?'•':'✓'}</span><div><p>${esc(tx(s.p))}</p><p class="ga m">${esc(tx(s.at))}</p></div></li>`}
    else{h+=`<li class="gs now"><span class="gn">${i+1}</span><div class="gbody"><p class="eyebrow">${tx(U.stepOf(i+1,n))}</p><p class="gp">${esc(tx(s.p))}</p>`;
      if(s.type==='mc')h+=choicesHTML(s.choices,'data-gchoice',cur.gpick,cur.gshow,s.ans,s.mono);
      else h+=`<div class="answer"><input id="gans" inputmode="${s.type==='txt'?'text':'decimal'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="answer" ${cur.gshow?'disabled':''} value="${esc(cur.gshow?tx(s.at):cur.gval||'')}"></div>`;
      if(cur.err)h+=`<div class="hintbox">${tx(cur.errT?U.badT:U.bad)}</div>`;
      if(cur.gt>0&&!cur.gshow)h+=`<div class="hintbox"><b>${tx(U.stepHint)}</b> ${esc(tx(s.h))}</div>`;
      if(cur.gshow)h+=`<div class="hintbox"><b>${tx(U.answerIs)}</b> <span class="m">${esc(tx(s.at))}</span>. ${tx(U.shown)}</div>`;
      h+=`<div class="actions">${cur.gshow?`<button class="btn primary" data-act="g-cont">${tx(U.cont)}</button>`:`<button class="btn primary" data-act="g-check" ${s.type==='mc'&&cur.gpick==null?'disabled':''}>${tx(U.check1)}</button>`}</div></div></li>`}}
  h+='</ol>';
  if(cur.gi>=n){const helped=cur.glog.filter(Boolean).length;h+=`<div class="fb ok" aria-live="polite"><strong>${tx(U.solved)}</strong><div>${tx(U.solvedB(n,helped))} ${tx(helped===0?U.readyOwn:U.oneMore)}</div></div>
    <div class="actions">${helped===0?`<button class="btn primary" data-act="to-own">${tx(U.goOwn)} →</button><button class="btn" data-act="to-guided">${tx(U.anotherG)}</button>`:`<button class="btn primary" data-act="to-guided">${tx(U.anotherG)}</button><button class="btn" data-act="to-own">${tx(U.goOwn)}</button>`}</div>`}
  return h}

function practiceHTML(){const q=cur.q;let h=probHTML(q,cur.done?q.evs:null);
  if(q.type==='mc')h+=choicesHTML(q.choices,'data-choice',cur.pick,cur.done,q.ans,q.mono);
  else h+=`<div class="answer"><input id="ans" inputmode="${q.type==='txt'?'text':'decimal'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="answer" ${cur.done?'disabled':''} value="${esc(cur.val||'')}"></div><p class="help">${tx(q.type==='txt'?U.txtHelp:U.numHelp)}</p>`;
  if(cur.err)h+=`<div class="hintbox">${tx(cur.errT?U.badT:U.bad)}</div>`;
  if(cur.hint&&!cur.done)h+=`<div class="hintbox">${esc(tx(q.hint))}</div>`;
  if(cur.done){const ok=cur.res;h+=`<div class="fb ${ok?'ok':'no'}" aria-live="polite"><strong>${ok?tx(U.correct):tx(U.wrong)+' '}${ok?'':`<span class="ansv">${esc(tx(q.ansText))}</span>`}</strong>`;
    if(cur.justMastered)h+=`<div>${tx(U.masteredNow)}</div>`;
    h+=ok?`<details><summary>${tx(U.steps)}</summary>${stepsHTML(q.steps)}</details>`:`<div><b>${tx(U.steps)}</b>${stepsHTML(q.steps)}</div>`;h+='</div>'}
  h+=`<div class="actions">`;
  if(!cur.done){h+=`<button class="btn primary" data-act="submit" ${q.type==='mc'&&cur.pick==null?'disabled':''}>${tx(U.submit)}</button>`;if(mode.t==='study'&&!cur.hint)h+=`<button class="btn" data-act="hint">${tx(U.hint)}</button>`}
  else{h+=`<button class="btn primary" data-act="next">${tx(U.next)}</button>`;
    if(mode.t==='study'&&!cur.res)h+=`<button class="btn" data-act="to-guided">${tx(U.walk)}</button><button class="btn ghost" data-act="to-learn">${tx(U.review)}</button>`;
    if(mode.t==='study'&&cur.justMastered&&nextUp(cur.id))h+=`<button class="btn" data-act="go-next">${tx(U.goNext)} · ${tx(NAMES[nextUp(cur.id)])}</button>`}
  return h+'</div>'}

function renderMain(){const m=$('#main');let h='';
  if(mode.t==='summary'){const res=mode.results;const n=Object.keys(res).length,ok=Object.values(res).filter(Boolean).length;const gaps=ORDER.filter(id=>res[id]===false);
    h=`<section class="sum"><h3>${tx(U.sumT)}</h3><p>${tx(U.sumB(ok,n))}</p>`+(gaps.length?`<ol class="gaplist">${gaps.map(id=>`<li><span class="code">${id}</span><span>${tx(NAMES[id])}</span><span class="w">${tx(catOf(id).items)}</span></li>`).join('')}</ol>`:`<p>${tx(U.noGaps)}</p>`)+
      `<p class="help">${tx(U.stage)}</p><div class="actions"><button class="btn primary" data-act="practice-first">${tx(U.practice)}</button></div></section>`;m.innerHTML=h;return}
  const anyWork=Object.values(S.p).some(p=>p.a>0||p.chk!==null);
  if(mode.t==='study'&&!anyWork)h+=`<div class="banner"><div><h3>${tx(U.welT)}</h3><p>${tx(U.welB)}</p></div><button class="btn primary" data-act="start-check">${tx(U.start)}</button></div>`;
  const p=prog(cur.id),c=catOf(cur.id);
  const top=mode.t==='check'?`<span class="eyebrow">${tx(U.qOf(mode.i+1,mode.queue.length))}</span><button class="btn ghost" data-act="exit-check">${tx(U.exit)}</button>`
    :`<div class="ttl"><span class="eyebrow"><span class="code">${cur.id}</span>${tx(c.n)}</span><h2>${tx(NAMES[cur.id])}</h2></div>`+(cur.view==='practice'?`<span class="pips" aria-label="${Math.min(p.s,3)} ${tx(U.streak)}">${[0,1,2].map(i=>`<span class="pip ${i<Math.min(p.s,3)?'on':''}"></span>`).join('')} ${tx(U.streak)}</span>`:'');
  h+=`<section class="card"><div class="card-top">${top}</div>${mode.t==='study'?tabsHTML():''}<div class="paper">${cur.view==='learn'?learnHTML():cur.view==='guided'?guidedHTML():practiceHTML()}</div></section>`;
  m.innerHTML=h;
  const pz=$('.passage');if(pz){const mk=pz.querySelectorAll('mark');if(mk.length&&mk.length!==cur.mk)pz.scrollTop=Math.max(0,mk[0].offsetTop-48);else pz.scrollTop=cur.ps||0;
    cur.mk=mk.length;pz.addEventListener('scroll',()=>{cur.ps=pz.scrollTop},{passive:true})}
  const inp=$('#ans');if(inp&&!cur.done){inp.addEventListener('input',e=>{cur.val=e.target.value});inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}
  const gin=$('#gans');if(gin&&!cur.gshow){gin.addEventListener('input',e=>{cur.gval=e.target.value});gin.addEventListener('keydown',e=>{if(e.key==='Enter')gCheck()})}}
function render(){renderChrome();renderMap();renderMain()}
const focusSoon=sel=>{const el=document.querySelector(sel);if(el)el.focus({preventScroll:true})};

/* ---------- actions ---------- */
function submit(){const q=cur.q;let ok;
  if(q.type==='mc'){if(cur.pick==null)return;ok=cur.pick===q.ans}
  else if(q.type==='txt'){const v=normT(cur.val);if(!v){cur.err=true;cur.errT=true;renderMain();return}ok=q.acc.includes(v)}
  else{const v=parseNum(cur.val||'');if(isNaN(v)){cur.err=true;cur.errT=false;renderMain();return}ok=Math.abs(v-q.ans)<=(q.tol??.001)}
  cur.err=false;cur.done=true;cur.res=ok;const p=prog(cur.id);
  if(mode.t==='check'){p.chk=ok;mode.results[cur.id]=ok}
  else{p.a++;if(ok){p.c++;p.s++;if(p.s>=3&&!p.m){p.m=true;cur.justMastered=true}}else p.s=0}
  save();render();focusSoon('[data-act="next"]')}
function gCheck(){const s=cur.gq.g[cur.gi];let ok;
  if(s.type==='mc'){if(cur.gpick==null)return;ok=cur.gpick===s.ans}
  else if(s.type==='txt'){const v=normT(cur.gval);if(!v){cur.err=true;cur.errT=true;renderMain();return}ok=s.acc.includes(v)}
  else{const v=parseNum(cur.gval||'');if(isNaN(v)){cur.err=true;cur.errT=false;renderMain();return}ok=Math.abs(v-s.ans)<=s.tol}
  cur.err=false;
  if(ok){cur.glog.push(cur.gt>0);gAdvance()}
  else{cur.gt++;cur.gpick=null;if(cur.gt>=2)cur.gshow=true;renderMain();focusSoon(cur.gshow?'[data-act="g-cont"]':'#gans')}}
function gAdvance(){cur.gi++;cur.gt=0;cur.gshow=false;cur.gval='';cur.gpick=null;renderMain();focusSoon('#gans')}
function goStudy(id,view){mode={t:'study'};openSkill(id,view);render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.lang){S.lang=t.dataset.lang;save();try{localStorage.setItem('catchup.lang',S.lang)}catch(e){}if(cur&&GRAM.includes(cur.id)&&mode.t!=='summary'&&!(cur.view==='practice'&&cur.done))setView(cur.view);render();return}
  if(t.id==='btn-reset'){if(resetArm){clearTimeout(resetArm);resetArm=null;S.p={};save();goStudy(nextUp())}else{resetArm=setTimeout(()=>{resetArm=null;renderChrome()},4000);renderChrome()}return}
  if(t.id==='btn-check'||t.dataset.act==='start-check'){mode={t:'check',queue:ORDER.slice(),i:0,results:{}};cur={id:ORDER[0]};setView('practice');render();return}
  if(t.dataset.skill){goStudy(t.dataset.skill);return}
  if(t.dataset.view){setView(t.dataset.view);render();return}
  if(t.dataset.choice!=null){cur.pick=+t.dataset.choice;renderMain();return}
  if(t.dataset.gchoice!=null){cur.gpick=+t.dataset.gchoice;renderMain();return}
  const a=t.dataset.act;
  if(a==='submit')submit();
  else if(a==='hint'){cur.hint=true;renderMain()}
  else if(a==='ex-step'){cur.exStep++;renderMain()}
  else if(a==='new-example'){setView('learn');renderMain()}
  else if(a==='to-guided'){setView('guided');render();focusSoon('#gans')}
  else if(a==='to-own'){setView('practice');render();focusSoon('#ans')}
  else if(a==='to-learn'){setView('learn');render()}
  else if(a==='g-check')gCheck();
  else if(a==='g-cont'){cur.glog.push(true);gAdvance()}
  else if(a==='next'){if(mode.t==='check'){mode.i++;if(mode.i>=mode.queue.length){mode={t:'summary',results:mode.results};renderMain();renderMap()}else{cur={id:mode.queue[mode.i]};setView('practice');render()}}else{setView('practice');render();focusSoon('#ans')}}
  else if(a==='go-next')goStudy(nextUp(cur.id));
  else if(a==='exit-check'||a==='practice-first')goStudy(nextUp()||ORDER[0]);
});
goStudy(nextUp()||ORDER[0]);
</script>

</body></html>
