{p:'p3',s:'4.10A',q:`What is the message of this folktale?`,tr:`¿Cuál es el mensaje de este cuento folclórico?`,c:[`Everyone can help in a small way, and small efforts can add up.`,`Big animals are stronger than small animals.`,`It is best to stay away from danger.`,`Animals should not live near rivers.`],e:[`As she zoomed past them once more, she called out, "I am doing what I can."`],x:[`The hummingbird does what she can, and her small effort inspires everyone. Together they put out the fire.`,`El colibrí hace lo que puede, y su pequeño esfuerzo inspira a todos. Juntos apagan el fuego.`]},
{p:'p3',s:'4.8B',q:`How do the other animals change in this folktale?`,tr:`¿Cómo cambian los otros animales en este cuento?`,c:[`They stop watching and start helping because of the hummingbird.`,`They become afraid of the hummingbird.`,`They decide to move to a new forest.`,`They start laughing at the bear.`],e:[`One by one, they looked at the river and then at the fire.`],x:[`At first the animals only watch and laugh. After the hummingbird keeps working, they join in.`,`Al principio los animales solo miran y se burlan. Como el colibrí sigue trabajando, se unen a ayudar.`]},
{p:'p3',s:'4.8C',q:`What happens in the resolution of the folktale?`,tr:`¿Qué sucede en la resolución del cuento?`,c:[`The animals work together, and the fire goes out.`,`The bear laughs at the hummingbird.`,`The fire spreads across the valley.`,`The hummingbird flies away from the fire.`],e:[`Together, they did what one small bird could never have done alone, and at last the fire hissed and went out.`],x:[`The resolution is how the problem ends. The problem is the fire, and it is solved when everyone works together.`,`La resolución es cómo termina el problema. El problema es el fuego, y se resuelve cuando todos trabajan juntos.`]},
{p:'p3',s:'4.6F',q:`Why does the jaguar tell the hummingbird she is "wasting your strength"?`,tr:`¿Por qué el jaguar le dice al colibrí que está "gastando su fuerza"?`,c:[`He thinks her tiny drops cannot make a difference.`,`He wants her to save her strength for a race.`,`He is worried that she is too close to the bear.`,`He thinks she is carrying the wrong kind of water.`],e:[`"It is hopeless."`],x:[`The jaguar says it is hopeless, so he believes a few drops cannot stop such a big fire.`,`El jaguar dice que es inútil; cree que unas gotas no pueden detener un fuego tan grande.`]},
{p:'p3',s:'4.7D',q:`Which is the best summary of the folktale?`,tr:`¿Cuál es el mejor resumen del cuento folclórico?`,c:[`When a fire burns the forest, a hummingbird carries water drop by drop. Her effort inspires the other animals, and together they put out the fire.`,`A bear and a jaguar stand by the river and talk about a fire.`,`A hummingbird is the smallest bird in the forest. She drinks water from the river.`,`The animals watch the fire. The deer and the monkeys carry water.`],e:[`A tiny hummingbird flew to the river, scooped up a single drop of water in her beak, and carried it back to the flames.`,`Together, they did what one small bird could never have done alone, and at last the fire hissed and went out.`],x:[`The best summary includes the problem (the fire), what the hummingbird does, and how it ends.`,`El mejor resumen incluye el problema (el fuego), lo que hace el colibrí y cómo termina.`]},
{p:'p3',s:'4.3B',q:`In paragraph 1, what does the word "swept" mean?`,tr:`En el párrafo 1, ¿qué significa la palabra "swept"?`,c:[`moved quickly across`,`cleaned with a broom`,`slowly died out`,`jumped over`],e:[`In only a few minutes, it raced from tree to tree and covered the whole valley.`],x:[`"Swept" has more than one meaning. Here the next sentence says the fire raced and covered the valley, so it moved quickly.`,`"Swept" tiene varios significados. Aquí la siguiente oración dice que el fuego corrió y cubrió el valle: se movió rápidamente.`]},
// p4 Prairie Storm
{p:'p4',s:'4.3B',q:`In stanza 4, what does the word "glistened" mean?`,tr:`En la estrofa 4, ¿qué significa la palabra "glistened"?`,c:[`shone brightly`,`grew darker`,`dried out`,`made a loud noise`],e:[`The whole washed world sparkled and glistened`],x:[`"Glistened" is paired with "sparkled," and the puddles reflect the sun, so it means shone brightly.`,`"Glistened" aparece junto a "sparkled" (destelló) y los charcos reflejan el sol, así que significa brilló.`]},
{p:'p4',s:'4.10A',q:`Why does the poet most likely include stanza 4?`,tr:`¿Por qué el poeta probablemente incluye la estrofa 4?`,c:[`to show the calm, fresh feeling after the storm`,`to explain how storms are formed`,`to describe the noise of the thunder`,`to show that Grandpa is afraid of storms`],e:[`Then quiet. The clouds drifted eastward.`],x:[`Stanza 4 begins with "Then quiet" and describes sunshine and sparkle, which shows the calm after the storm.`,`La estrofa 4 empieza con "Then quiet" y describe el sol y el brillo: muestra la calma después de la tormenta.`]},
{p:'p4',s:'4.6F',q:`How does the speaker most likely feel at the end of the poem?`,tr:`¿Cómo se siente probablemente el hablante al final del poema?`,c:[`peaceful and amazed at how fresh everything looks`,`scared that another storm is coming`,`bored from watching the rain`,`sad that the windmill stopped`],e:[`as if a new day had begun.`],x:[`The speaker describes the world sparkling "as if a new day had begun," which sounds peaceful and amazed.`,`El hablante describe el mundo brillando "como si empezara un nuevo día", lo cual suena tranquilo y asombrado.`]},
{p:'p4',s:'4.6G',q:`What is the poem mostly about?`,tr:`¿De qué trata principalmente el poema?`,c:[`a storm that sweeps across a prairie and then passes`,`a farmer who takes care of cattle`,`a train that travels across the prairie`,`a grandfather who teaches his grandchild to count`],e:[`Then thunder rolled in like a freight train`],x:[`Each stanza follows the storm: before, during, and after. The train is only a comparison for the thunder.`,`Cada estrofa sigue la tormenta: antes, durante y después. El tren es solo una comparación con el trueno.`]},
// p5 The Missing Map
{p:'p5',s:'4.8B',q:`How does Maya's reaction help solve the problem?`,tr:`¿Cómo ayuda la reacción de Maya a resolver el problema?`,c:[`She stays calm and suggests retracing their steps.`,`She blames Owen and leaves the park.`,`She asks an adult to give them a new map.`,`She guesses the answer to the last clue.`],e:[`Let's retrace our steps.`],x:[`Instead of arguing, Maya takes a deep breath and suggests going back the way they came. That leads to finding the map.`,`En vez de discutir, Maya respira hondo y propone regresar por el mismo camino. Así encuentran el mapa.`]},
{p:'p5',s:'4.8B',q:`How does Owen change by the end of the play?`,tr:`¿Cómo cambia Owen al final de la obra?`,c:[`He goes from blaming Maya to admitting his mistake.`,`He goes from being calm to being angry.`,`He stops wanting to finish the treasure hunt.`,`He decides Maya should read all the clues.`],e:[`I'm sorry I blamed you.`],x:[`Owen first says "This is all your fault." When he finds the map, he apologizes.`,`Owen primero dice "Todo es tu culpa". Cuando encuentra el mapa, se disculpa.`]},
{p:'p5',s:'4.6F',q:`Why is Owen embarrassed in line 7?`,tr:`¿Por qué está avergonzado Owen en la línea 7?`,c:[`He had the map all along even though he blamed Maya.`,`He cannot read the clue out loud.`,`Maya laughs at his jacket.`,`He thinks they have lost the treasure hunt.`],e:[`It was in my pocket the whole time.`],x:[`Owen blamed Maya, but the map was in his own pocket. That would make anyone embarrassed.`,`Owen culpó a Maya, pero el mapa estaba en su propio bolsillo. Eso le da vergüenza.`]},
{p:'p5',s:'4.8C',q:`Which event is the climax of the play?`,tr:`¿Qué suceso es el clímax de la obra?`,c:[`Owen finds the map in his pocket.`,`Owen and Maya argue about the map.`,`Maya explains where they walked.`,`Maya says, "Apology accepted."`],e:[`It was in my pocket the whole time.`],x:[`The tension builds as they search. Finding the map is the turning point that ends the argument.`,`La tensión aumenta mientras buscan. Encontrar el mapa es el momento decisivo que termina la discusión.`]},
{p:'p5',s:'4.3B',q:`In line 5, what does "retrace" mean?`,tr:`En la línea 5, ¿qué significa "retrace"?`,c:[`go back over the same path`,`draw a new map`,`run as fast as possible`,`give up and go home`],e:[`We should go back the same way we came: first the bench, then the slide, then the fountain.`],x:[`Maya explains right after: go back the same way we came. That is what "retrace" means.`,`Maya lo explica enseguida: regresar por el mismo camino. Eso significa "retrace".`]},
// p6 Bats
{p:'p6',s:'4.6G',q:`What is the central idea of the article?`,tr:`¿Cuál es la idea central del artículo?`,c:[`The bats under the Congress Avenue Bridge were once feared but are now valued because they help people.`,`Austin, Texas, has many parades and concerts.`,`Bats fly out from under the bridge at sunset.`,`Farmers use chemicals to protect their fields.`],e:[`The bats under the bridge show that people and wild animals can share a city, and both can benefit.`],x:[`The whole article explains how people's view of the bats changed and how bats help. The other choices are small details.`,`Todo el artículo explica cómo cambió la opinión sobre los murciélagos y cómo ayudan. Las otras opciones son detalles pequeños.`]},
{p:'p6',s:'4.6G',q:`Which detail best supports the idea that the bats are helpful?`,tr:`¿Qué detalle apoya mejor la idea de que los murciélagos son útiles?`,c:[`They eat moths that damage farmers' crops.`,`They live in narrow cracks under the bridge.`,`They came to the bridge in the 1980s.`,`They fly out in a twisting ribbon.`],e:[`In one night, the bats under the bridge can eat thousands of pounds of insects, including moths that damage farmers' crops.`],x:[`Eating crop-damaging moths helps farmers. The other details describe the bats but do not show they help.`,`Comerse las polillas que dañan los cultivos ayuda a los agricultores. Los otros detalles describen a los murciélagos, pero no muestran que ayudan.`]},
{p:'p6',s:'4.6F',q:`Why did some people want the bats removed in the 1980s?`,tr:`¿Por qué algunas personas querían quitar a los murciélagos en los años 80?`,c:[`They did not know much about the bats and thought they were dangerous.`,`The bats were damaging the bridge.`,`The bats were eating farmers' crops.`,`The bats were keeping visitors away from Austin.`],e:[`Scientists explained that the bats were not dangerous if people left them alone.`],x:[`Scientists had to explain the bats were not dangerous, which tells us people thought they were.`,`Los científicos tuvieron que explicar que no eran peligrosos, lo que indica que la gente creía que sí lo eran.`]},
{p:'p6',s:'4.3B',q:`In paragraph 2, what does "colony" mean?`,tr:`En el párrafo 2, ¿qué significa "colony"?`,c:[`a large group of animals living together`,`an area ruled by another country`,`a type of bridge`,`a city park`],e:[`These bats live together in a group called a colony, and it is the largest city bat colony in North America.`],x:[`"Colony" has more than one meaning. Here the sentence says the bats live together in a group.`,`"Colony" tiene varios significados. Aquí la oración dice que los murciélagos viven juntos en un grupo.`]},
{p:'p6',s:'4.10A',q:`What is the author's main purpose for writing this article?`,tr:`¿Cuál es el propósito principal del autor al escribir este artículo?`,c:[`to inform readers about the bats and why they are helpful`,`to persuade readers to move to Austin`,`to entertain readers with a made-up story about a bat`,`to explain how to build a bridge`],e:[`Today, the bats are a source of pride for the city.`],x:[`The article gives facts about the bats and how they help. Giving facts is informing.`,`El artículo da datos sobre los murciélagos y cómo ayudan. Dar datos es informar.`]},
{p:'p6',s:'4.7D',q:`Which is the best summary of the article?`,tr:`¿Cuál es el mejor resumen del artículo?`,c:[`A huge bat colony lives under a bridge in Austin. People once feared the bats, but now they value them because the bats eat insects and attract visitors.`,`Bats are scary animals that live under bridges in Texas.`,`Crowds gather near a bridge in Austin. They watch the sunset every evening.`,`Scientists study bats. Bats eat moths. Farmers grow crops.`],e:[`About a million and a half Mexican free-tailed bats live in the narrow cracks under the bridge.`,`Today, the bats are a source of pride for the city.`],x:[`A good summary states the main ideas from beginning to end. The others include opinions, small details, or a list of facts.`,`Un buen resumen presenta las ideas principales del principio al final. Las otras opciones tienen opiniones, detalles pequeños o una lista de datos.`]},
// p7 Recess
{p:'p7',s:'4.9E',q:`What is the author's claim?`,tr:`¿Cuál es la afirmación (postura) del autor?`,c:[`The school should give students at least thirty minutes of recess every day.`,`Students get fifteen minutes of recess a day.`,`Doctors recommend sixty minutes of activity.`,`Students make up games on the playground.`],e:[`Our school should give students at least thirty minutes of recess every day.`],x:[`The claim is what the author wants readers to agree with. The other choices are facts used as support.`,`La afirmación es lo que el autor quiere que los lectores acepten. Las otras opciones son datos que la apoyan.`]},
{p:'p7',s:'4.9E',q:`How does the author use facts in paragraph 3?`,tr:`¿Cómo usa el autor los datos en el párrafo 3?`,c:[`to show that recess helps students get the exercise they need`,`to explain how school buses work`,`to show that doctors enjoy recess`,`to argue that students should walk to school`],e:[`Doctors recommend that children get at least sixty minutes of physical activity every day.`],x:[`The doctors' recommendation is a fact that supports the claim: students need exercise, and recess gives it.`,`La recomendación de los médicos es un dato que apoya la afirmación: los niños necesitan ejercicio y el recreo lo ofrece.`]},
{p:'p7',s:'4.9E',q:`How does the author respond to people who disagree?`,tr:`¿Cómo responde el autor a las personas que no están de acuerdo?`,c:[`by explaining that active breaks actually help students learn more`,`by saying that those people are wrong about everything`,`by agreeing that recess wastes learning time`,`by asking those people to visit the playground`],e:[`However, the research shows the opposite: active breaks help students learn more.`],x:[`The author names the worry (less learning time) and answers it with research.`,`El autor menciona la preocupación (menos tiempo para aprender) y la responde con una investigación.`]},
{p:'p7',s:'4.10A',q:`Why does the author include paragraph 4?`,tr:`¿Por qué el autor incluye el párrafo 4?`,c:[`to give another reason that recess is valuable`,`to describe the playground at Oak Hill`,`to explain how to solve disagreements`,`to show that desks are uncomfortable`],e:[`Finally, recess teaches skills that are hard to learn at a desk.`],x:[`Paragraph 4 starts with "Finally," which signals one more reason supporting the claim.`,`El párrafo 4 empieza con "Finally" (por último), que indica una razón más que apoya la afirmación.`]},
{p:'p7',s:'4.3B',q:`In paragraph 2, what does "focused" mean?`,tr:`En el párrafo 2, ¿qué significa "focused"?`,c:[`paying close attention`,`moving around a lot`,`feeling very tired`,`sitting near a window`],e:[`Studies show that children who take active breaks pay better attention when they return to class.`],x:[`The paragraph says active breaks help children pay better attention, and "focused" is the opposite of "wiggly."`,`El párrafo dice que los descansos ayudan a prestar más atención, y "focused" es lo contrario de "wiggly" (inquieto).`]},
// p8 Swim
{p:'p8',s:'4.9E',q:`What is the author's claim?`,tr:`¿Cuál es la afirmación (postura) del autor?`,c:[`Every elementary school in Texas should offer free swimming lessons.`,`Texas has thousands of lakes and rivers.`,`Swimming is fun exercise.`,`Some cities have public pools.`],e:[`Every elementary school in Texas should offer free swimming lessons to its students.`],x:[`The claim uses "should" to say what the author wants. The other choices are facts.`,`La afirmación usa "should" (debería) para decir lo que quiere el autor. Las otras opciones son datos.`]},
{p:'p8',s:'4.9E',q:`Why does the author include information from the American Academy of Pediatrics?`,tr:`¿Por qué el autor incluye información de la Academia Estadounidense de Pediatría?`,c:[`to show that experts agree swimming lessons can keep children safe`,`to show that doctors like to swim`,`to explain how to join a swim team`,`to tell readers where to find a pool`],e:[`Children who have had swimming lessons are less likely to drown, according to the American Academy of Pediatrics.`],x:[`Citing experts makes the safety reason stronger and more believable.`,`Citar a expertos hace que la razón de seguridad sea más fuerte y creíble.`]},
{p:'p8',s:'4.9E',q:`In paragraph 4, how does the author answer people who say lessons cost too much?`,tr:`En el párrafo 4, ¿cómo responde el autor a quienes dicen que las clases cuestan demasiado?`,c:[`by suggesting schools use public pools that are empty during the day`,`by saying that money does not matter`,`by asking families to pay for lessons`,`by explaining that kayaking is cheap`],e:[`But many cities already have public pools that sit empty during the school day.`],x:[`The author offers a solution: use pools that are already empty during school hours.`,`El autor ofrece una solución: usar las albercas que ya están vacías durante el horario escolar.`]},
{p:'p8',s:'4.10A',q:`What is the author's purpose for writing this essay?`,tr:`¿Cuál es el propósito del autor al escribir este ensayo?`,c:[`to persuade readers that schools should teach swimming`,`to entertain readers with a story about a beach trip`,`to explain how to swim`,`to describe the lakes in Texas`],e:[`Our schools should make sure every student has the chance to learn.`],x:[`The essay tries to convince readers to agree with a claim, so the purpose is to persuade.`,`El ensayo intenta convencer a los lectores de una postura, así que el propósito es persuadir.`]},
{p:'p8',s:'4.3B',q:`In paragraph 4, what does "partner" mean?`,tr:`En el párrafo 4, ¿qué significa "partner"?`,c:[`work together with`,`compete against`,`build a new`,`close down`],e:[`Schools could partner with these pools and work together with them to keep costs low.`],x:[`The sentence explains it right away: partner means work together with.`,`La oración lo explica enseguida: "partner" significa trabajar junto con alguien.`]},
// p9 Honeybees
{p:'p9',s:'4.6G',q:`What is the central idea of "Honeybees at Work"?`,tr:`¿Cuál es la idea central de "Honeybees at Work"?`,c:[`Honeybees do important work that helps plants and people, so they need protection.`,`Honeybees make honey inside wax comb.`,`The queen bee lays all the eggs in the hive.`,`Almonds and blueberries are popular foods.`],e:[`A honeybee may be small, but it has a big job.`],x:[`Every paragraph connects to the bees' big job and why it matters. The others are single details.`,`Cada párrafo se relaciona con el gran trabajo de las abejas y su importancia. Las otras opciones son detalles.`]},
{p:'p9',s:'4.3B',q:`What does "pollination" mean in this article?`,tr:`¿Qué significa "pollination" en este artículo?`,c:[`moving pollen from flower to flower so plants make seeds`,`drinking nectar from a flower`,`building wax comb in a hive`,`guarding the entrance of a hive`],e:[`Moving pollen from one flower to another helps the plant make seeds.`],x:[`Paragraph 2 explains the process step by step and ends by naming what pollination does.`,`El párrafo 2 explica el proceso paso a paso y termina diciendo lo que hace la polinización.`]},
{p:'p9',s:'4.6F',q:`Why are the tiny hairs on a honeybee's body important?`,tr:`¿Por qué son importantes los pelitos del cuerpo de la abeja?`,c:[`They help the bee carry pollen between flowers.`,`They keep the bee warm in winter.`,`They help the bee make honey.`,`They protect the bee from stings.`],e:[`When a honeybee lands on a flower to drink its sweet nectar, a yellow powder called pollen sticks to the tiny hairs on its body.`],x:[`Pollen sticks to the hairs and rubs off at the next flower, so the hairs help move pollen.`,`El polen se pega a los pelitos y se cae en la siguiente flor, así que los pelitos ayudan a mover el polen.`]},
{p:'p9',s:'4.10A',q:`Why does the author include paragraph 5?`,tr:`¿Por qué el autor incluye el párrafo 5?`,c:[`to explain problems bees face and how people can help`,`to describe what the queen bee does`,`to list foods that need bees`,`to explain how pollen sticks to bees`],e:[`People can help by planting flowers, avoiding harmful chemicals in their gardens, and buying honey from local beekeepers.`],x:[`Paragraph 5 names problems (disease, fewer wildflowers) and then gives ways people can help.`,`El párrafo 5 nombra problemas (enfermedades, menos flores silvestres) y luego da maneras de ayudar.`]},
{p:'p9',s:'4.7D',q:`Which is the best summary of "Honeybees at Work"?`,tr:`¿Cuál es el mejor resumen de "Honeybees at Work"?`,c:[`Honeybees pollinate many plants that people depend on for food. Bees work together in hives, but they face problems, and people can help protect them.`,`Honeybees are the most important animals in the world.`,`A bee drinks nectar. Pollen sticks to its hairs. Then it flies to another flower.`,`The queen lays eggs, and worker bees build wax comb.`],e:[`Honeybees help plants make seeds and fruit through a process called pollination.`,`People can help by planting flowers, avoiding harmful chemicals in their gardens, and buying honey from local beekeepers.`],x:[`The best summary covers the main idea of each part of the article without small details or opinions.`,`El mejor resumen incluye la idea principal de cada parte del artículo sin detalles pequeños ni opiniones.`]},
// p10 Beehive Next Door
{p:'p10',s:'4.8B',q:`How does Sofía change during the story?`,tr:`¿Cómo cambia Sofía durante el cuento?`,c:[`She goes from fearing the bees to caring about them.`,`She goes from liking bees to being afraid of them.`,`She decides to become a beekeeper right away.`,`She stops talking to Mr. Okafor.`],e:[`Now, instead of hiding, she spent afternoons watching the bees zip from flower to flower.`],x:[`At first Sofía refuses to go outside. By the end she plants flowers for the bees and watches them.`,`Al principio Sofía no quiere salir. Al final siembra flores para las abejas y las observa.`]},
{p:'p10',s:'4.8B',q:`How does Mr. Okafor help Sofía?`,tr:`¿Cómo ayuda el señor Okafor a Sofía?`,c:[`He shows her the bees up close so she can learn about them.`,`He moves his hives to another yard.`,`He tells her to stay inside.`,`He gives her a bee costume.`],e:[`"Would you like to see how the bees made it?"`],x:[`Mr. Okafor invites Sofía to see the hives and explains how bees behave, which helps her stop being afraid.`,`El señor Okafor invita a Sofía a ver las colmenas y le explica cómo se comportan las abejas; eso le quita el miedo.`]},
{p:'p10',s:'4.8C',q:`Which event is the climax of the story?`,tr:`¿Qué suceso es el clímax del cuento?`,c:[`Sofía watches Mr. Okafor lift a frame covered with bees.`,`Sofía sees the white boxes from her window.`,`Mr. Okafor knocks on the door with honey.`,`Sofía plants lavender and sunflowers.`],e:[`He lifted a frame covered with bees, and Sofía held her breath.`],x:[`Standing next to the bees is Sofía's most tense moment. It is the turning point when she sees they are not dangerous.`,`Estar junto a las abejas es el momento de mayor tensión. Es el punto decisivo cuando ve que no son peligrosas.`]},
{p:'p10',s:'4.6F',q:`Why does Sofía hold her breath in paragraph 4?`,tr:`¿Por qué Sofía contiene la respiración en el párrafo 4?`,c:[`She is nervous about being so close to the bees.`,`She is trying not to smell the honey.`,`She is excited to taste the honey.`,`She is tired from walking to the hives.`],e:[`Sofía hid behind her mother.`],x:[`Sofía was afraid of bees and hid behind her mother, so holding her breath shows she is nervous.`,`Sofía tenía miedo de las abejas y se escondió detrás de su mamá, así que contener la respiración muestra nervios.`]},
{p:'p10',s:'4.7D',q:`Which is the best summary of the story?`,tr:`¿Cuál es el mejor resumen del cuento?`,c:[`Sofía is afraid of her neighbor's bees until he shows her how they work. She learns that bees are busy, not mean, and she plants flowers to help them.`,`Mr. Okafor gives Sofía a jar of honey.`,`Sofía wears a hat with a net veil. Then she sees white boxes.`,`Bees make wax, care for babies, and guard the door.`],e:[`For the rest of the week, Sofía refused to play in her own yard.`,`That spring, Sofía helped her mother plant lavender and sunflowers along the fence.`],x:[`A summary tells the problem, the key events, and the ending in order. The others are single details or out of order.`,`Un resumen cuenta el problema, los sucesos clave y el final en orden. Las otras opciones son detalles sueltos o están en desorden.`]},
{p:'p10',s:'4.10A',q:`What lesson does the story teach?`,tr:`¿Qué lección enseña el cuento?`,c:[`Learning about something can replace fear with understanding.`,`Bees are dangerous and should be avoided.`,`Neighbors should always share their honey.`,`Flowers are the best gifts to give.`],e:[`They only sting if they think the hive is in danger."`],x:[`Once Sofía learns how bees really act, her fear goes away. The lesson is that knowledge can replace fear.`,`Cuando Sofía aprende cómo actúan las abejas, se le quita el miedo. La lección es que conocer algo puede reemplazar el miedo.`]},
// p11 Monarchs
{p:'p11',s:'4.6G',q:`What is the central idea of "The Monarch's Long Trip"?`,tr:`¿Cuál es la idea central de "The Monarch's Long Trip"?`,c:[`Monarchs make a long journey each year and need milkweed and flowers along the way to survive.`,`Monarchs are orange butterflies.`,`Fir trees grow high in the mountains of Mexico.`,`Students like to plant gardens.`],e:[`Each fall, millions of monarch butterflies begin one of the longest journeys of any insect.`],x:[`The article follows the journey and ends with what monarchs need to survive it. The others are details.`,`El artículo sigue el viaje y termina con lo que necesitan las mariposas para sobrevivir. Las otras opciones son detalles.`]},
{p:'p11',s:'4.3B',q:`In paragraph 2, what does "clusters" mean?`,tr:`En el párrafo 2, ¿qué significa "clusters"?`,c:[`groups packed close together`,`single butterflies flying alone`,`kinds of flowers`,`long flights south`],e:[`In October, people in Texas may see clusters of orange butterflies, packed close together, resting in trees and drinking nectar from fall flowers.`],x:[`The sentence says the butterflies are "packed close together," which explains "clusters."`,`La oración dice que las mariposas están "packed close together" (muy juntas), lo que explica "clusters".`]},
{p:'p11',s:'4.6F',q:`What would most likely happen if milkweed disappeared completely?`,tr:`¿Qué pasaría probablemente si el algodoncillo desapareciera por completo?`,c:[`Monarchs would have nowhere to lay eggs, and their numbers would drop.`,`Monarchs would eat a different plant.`,`Monarchs would stay in Mexico all year.`,`Monarchs would fly faster.`],e:[`Her caterpillars eat only milkweed.`],x:[`Caterpillars eat only milkweed, so without it new monarchs could not grow.`,`Las orugas comen solo algodoncillo; sin él, no podrían crecer nuevas mariposas.`]},
{p:'p11',s:'4.10A',q:`Why does the author describe the monarchs' trip in the order it happens?`,tr:`¿Por qué el autor describe el viaje de las mariposas en el orden en que sucede?`,c:[`to help readers follow the journey from start to finish`,`to compare monarchs with other insects`,`to persuade readers to visit Mexico`,`to tell a made-up story about one butterfly`],e:[`Then, in spring, they begin flying north again.`],x:[`Words like "each fall," "when they reach," and "then, in spring" put the journey in time order so it is easy to follow.`,`Palabras como "each fall" y "then, in spring" ordenan el viaje en el tiempo para que sea fácil de seguir.`]},
{p:'p11',s:'4.7D',q:`Which is the best summary of the article?`,tr:`¿Cuál es el mejor resumen del artículo?`,c:[`Monarchs fly up to 3,000 miles to Mexico each fall and return north over several generations. Planting milkweed helps protect them on their journey.`,`Monarchs are beautiful and everyone should love them.`,`In October, monarchs rest in trees in Texas.`,`A monarch lays eggs on milkweed. Then it dies.`],e:[`They fly from Canada and the northern United States all the way to the mountains of central Mexico, a trip of up to 3,000 miles.`,`Scientists, students, and families are planting milkweed gardens along the monarchs' path.`],x:[`The best summary includes the journey south, the trip back north, and how people help, without opinions.`,`El mejor resumen incluye el viaje al sur, el regreso al norte y cómo ayuda la gente, sin opiniones.`]},
// p12 Waiting for the Monarchs
{p:'p12',s:'4.8B',q:`How does Abuelita influence Diego?`,tr:`¿Cómo influye Abuelita en Diego?`,c:[`She helps him turn his worry into action by planting a balcony garden.`,`She tells him to forget about the monarchs.`,`She moves him back to their old house.`,`She buys him a book about butterflies.`],e:[`Then she took Diego to a garden center, where they bought three pots, a bag of soil, and two small milkweed plants.`],x:[`Diego thinks nothing can be done. Abuelita takes him to buy plants so they can make a place for the monarchs.`,`Diego cree que no se puede hacer nada. Abuelita lo lleva a comprar plantas para crear un lugar para las mariposas.`]},
{p:'p12',s:'4.8C',q:`What is the climax of the story?`,tr:`¿Cuál es el clímax del cuento?`,c:[`Diego sees a monarch on his balcony.`,`Diego's family moves to San Antonio.`,`Diego and Abuelita buy milkweed.`,`Diego waters the plants every day.`],e:[`A single monarch was perched on a zinnia, sitting very still as it slowly opened and closed its wings.`],x:[`Diego has been worrying, and the moment the first monarch appears is the turning point.`,`Diego estaba preocupado, y el momento en que aparece la primera mariposa es el punto decisivo.`]},
{p:'p12',s:'4.6F',q:`Why does Diego gasp in paragraph 5?`,tr:`¿Por qué Diego se queda sin aliento en el párrafo 5?`,c:[`He is surprised and excited that a monarch came.`,`He is scared of the butterfly.`,`He is upset that his plants died.`,`He is cold because it is October.`],e:[`Diego began to worry that his balcony was too small to matter.`],x:[`Diego worried no monarchs would come, so seeing one is a happy surprise.`,`Diego temía que no llegaran mariposas, así que ver una es una sorpresa feliz.`]},
{p:'p12',s:'4.3B',q:`In paragraph 5, what does "perched" mean?`,tr:`En el párrafo 5, ¿qué significa "perched"?`,c:[`resting on top of something`,`flying in circles`,`hiding under leaves`,`eating quickly`],e:[`A single monarch was perched on a zinnia, sitting very still as it slowly opened and closed its wings.`],x:[`The monarch is "sitting very still" on the flower, so perched means resting on top of it.`,`La mariposa está "sitting very still" (muy quieta) sobre la flor; "perched" significa posada encima.`]},
{p:'p12',s:'4.7D',q:`Which is the best summary of the story?`,tr:`¿Cuál es el mejor resumen del cuento?`,c:[`After moving to an apartment, Diego worries that monarchs won't visit. He and Abuelita plant a small balcony garden, and the monarchs stop there.`,`Abuelita has a calendar with October 15 circled.`,`Diego likes orange zinnias and milkweed.`,`Monarchs travel south every fall to Mexico.`],e:[`"The butterflies won't stop here," Diego said sadly.`,`"Even a small garden can be a stop on a long journey."`],x:[`The best summary gives the problem, what Diego and Abuelita do, and how it ends.`,`El mejor resumen da el problema, lo que hacen Diego y Abuelita, y cómo termina.`]},
{p:'p12',s:'4.10A',q:`What is the theme of the story?`,tr:`¿Cuál es el tema del cuento?`,c:[`Small actions can make a big difference.`,`Moving to a new place is always hard.`,`Grandparents should keep calendars.`,`Butterflies prefer large gardens.`],e:[`"Even a small garden can be a stop on a long journey."`],x:[`Diego's small balcony garden helps the monarchs, and Abuelita says even a small garden matters.`,`El pequeño jardín de Diego ayuda a las mariposas, y Abuelita dice que hasta un jardín pequeño importa.`]},
// paired texts
{p:'pA',s:'4.6H',q:`What idea about bees appears in BOTH texts?`,tr:`¿Qué idea sobre las abejas aparece en AMBOS textos?`,c:[`Bees in a hive have different jobs.`,`Bees sting anyone who comes near them.`,`Bees only visit sunflowers.`,`Bees sleep all winter.`],e:[[0,`Inside the hive, every bee has a role.`],[1,`"Each bee has a job," Mr. Okafor explained.`]],x:[`Text 1 says every bee has a role, and Mr. Okafor says each bee has a job. Both texts share this idea.`,`El Texto 1 dice que cada abeja tiene un papel, y el señor Okafor dice que cada abeja tiene un trabajo. Ambos comparten la idea.`]},
{p:'pA',s:'4.6H',q:`How is Sofía's choice to plant flowers connected to "Honeybees at Work"?`,tr:`¿Cómo se relaciona la decisión de Sofía de sembrar flores con "Honeybees at Work"?`,c:[`Text 1 says planting flowers is one way people can help bees.`,`Text 1 says bees only like lavender.`,`Text 1 says flowers keep bees away from houses.`,`Text 1 says people should not plant flowers near hives.`],e:[[0,`People can help by planting flowers, avoiding harmful chemicals in their gardens, and buying honey from local beekeepers.`],[1,`That spring, Sofía helped her mother plant lavender and sunflowers along the fence.`]],x:[`Sofía plants flowers "for the bees," which is exactly one of the ways Text 1 says people can help.`,`Sofía siembra flores "para las abejas", que es una de las maneras de ayudar que menciona el Texto 1.`]},
{p:'pA',s:'4.6H',q:`How are the two texts different?`,tr:`¿En qué se diferencian los dos textos?`,c:[`Text 1 gives facts about bees, while Text 2 tells a story about a girl who learns about bees.`,`Text 1 tells a story, while Text 2 gives facts.`,`Text 1 is about butterflies, while Text 2 is about bees.`,`Both texts are poems about honey.`],e:[[0,`A honeybee may be small, but it has a big job.`],[1,`When Mr. Okafor set up two white boxes in his backyard, Sofía watched from her bedroom window.`]],x:[`Text 1 is informational and explains facts. Text 2 is fiction with characters and a plot.`,`El Texto 1 es informativo y explica datos. El Texto 2 es ficción, con personajes y trama.`]},
{p:'pB',s:'4.6H',q:`Which information from Text 1 best explains why Abuelita buys milkweed?`,tr:`¿Qué información del Texto 1 explica mejor por qué Abuelita compra algodoncillo?`,c:[`Monarchs lay their eggs on milkweed, and their caterpillars eat only milkweed.`,`Monarchs rest on fir trees in Mexico.`,`Monarchs fly up to 3,000 miles.`,`Monarchs drink nectar from fall flowers.`],e:[[0,`A monarch lays her eggs on milkweed plants and then dies.`],[1,`Then she took Diego to a garden center, where they bought three pots, a bag of soil, and two small milkweed plants.`]],x:[`Text 1 explains that monarchs need milkweed to lay eggs and feed caterpillars, which is why Abuelita chooses it.`,`El Texto 1 explica que las mariposas necesitan algodoncillo para poner huevos y alimentar a las orugas; por eso Abuelita lo elige.`]},
{p:'pB',s:'4.6H',q:`What do BOTH texts show?`,tr:`¿Qué muestran AMBOS textos?`,c:[`People can help monarchs by planting gardens along their path.`,`Monarchs are afraid of people.`,`Monarchs only live in San Antonio.`,`Monarchs travel alone.`],e:[[0,`Scientists, students, and families are planting milkweed gardens along the monarchs' path.`],[1,`"Even a small garden can be a stop on a long journey."`]],x:[`Text 1 says families plant milkweed gardens, and Diego's balcony garden becomes a stop for monarchs.`,`El Texto 1 dice que las familias siembran jardines de algodoncillo, y el balcón de Diego se convierte en una parada para las mariposas.`]},
{p:'pB',s:'4.6H',q:`How does Text 1 help explain why monarchs come through San Antonio in October?`,tr:`¿Cómo ayuda el Texto 1 a explicar por qué las mariposas pasan por San Antonio en octubre?`,c:[`It says many monarchs pass through Texas in October on their way to Mexico.`,`It says monarchs are born in San Antonio.`,`It says monarchs like apartments.`,`It says monarchs fly north in October.`],e:[[0,`In October, people in Texas may see clusters of orange butterflies, packed close together, resting in trees and drinking nectar from fall flowers.`],[1,`"That is when the monarchs come through," Abuelita said.`]],x:[`Text 1 explains that monarchs cross Texas each October going south. That is why Abuelita circles October 15.`,`El Texto 1 explica que las mariposas cruzan Texas cada octubre rumbo al sur. Por eso Abuelita marca el 15 de octubre.`]}];

/* ---------- reading engine helpers ---------- */
function splitS(text){const out=[];let st=0;const abbr=/\b(Mr|Ms|Mrs|Dr|St)\.$/;
  for(let i=0;i<text.length;i++){const ch=text[i];if(ch!=='.'&&ch!=='!'&&ch!=='?')continue;let j=i+1;
    while(j<text.length&&'.!?'.includes(text[j]))j++;while(j<text.length&&'"”)'.includes(text[j]))j++;
    if(j>=text.length)break;if(text[j]!==' ')continue;let k=j;while(text[k]===' ')k++;
    if(!/[A-Z"“(¿¡ÁÉÍÓÚÑ]/.test(text[k]||''))continue;if(abbr.test(text.slice(st,j)))continue;
    out.push(text.slice(st,j).trim());st=k;i=k-1}
  const last=text.slice(st).trim();if(last)out.push(last);return out}
const unitsOf=T=>T.b.flatMap(b=>T.g==='poem'?b.split('\n'):splitS(b));
const blockOf=(T,s)=>T.b.findIndex(b=>b.includes(s))+1;
function passOf(pid){const ids=PAIRS[pid]||[pid];return{pair:!!PAIRS[pid],ids,texts:ids.map(i=>PS[i]),es:ids.map(i=>Object.assign({},PS[i],PSES[i]))}}
function textHTML(T,hl,label){let h=`<section class="ptext">${label?`<p class="eyebrow">${label}</p>`:''}<h3>${esc(T.t)}</h3><span class="genre">${tx(GEN[T.g])}</span>`;
  T.b.forEach((blk,i)=>{let s=blk;for(const e0 of hl){const e=tx(e0);if(e&&s.includes(e))s=s.replace(e,'\u0001'+e+'\u0002')}s=esc(s);
    if(T.g==='drama')s=s.replace(/^([A-Z][A-Z]+):/,'<b>$1:</b>').replace(/\(([^)]*)\)/g,'<i>($1)</i>');
    s=s.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
    h+=`<div class="pb${T.g==='poem'?' poem':''}"><span class="pn">${i+1}</span><p>${s}</p></div>`});
  return h+'</section>'}
function passageHTML(P,hl){let h=`<div class="passage" tabindex="0" aria-label="${esc(tx(L('Reading passage','Texto de lectura')))}">`;
  (S.lang==='es'?P.es:P.texts).forEach((T,i)=>{h+=textHTML(T,hl,P.pair?tx(L(`Text ${i+1}`,`Texto ${i+1}`)):'')});
  return h+'</div>'}
const SKS={
 '4.6F':L('Find a clue in the text, then add what you already know to figure out what the author does not say directly.','Busca una pista en el texto y súmale lo que ya sabes para descubrir lo que el autor no dice directamente.'),
 '4.6G':L('Look for the idea the whole text keeps coming back to. A detail that appears only once is usually not the key idea.','Busca la idea a la que todo el texto regresa una y otra vez. Un detalle que aparece una sola vez casi nunca es la idea clave.'),
 '4.3B':L('Reread the sentence and the ones around it. Try each answer in place of the word and see which one makes sense.','Vuelve a leer la oración y las que están cerca. Prueba cada respuesta en lugar de la palabra y ve cuál tiene sentido.'),
 '4.7D':L('A good summary tells the most important ideas from beginning to end, in order, without small details or opinions.','Un buen resumen cuenta las ideas más importantes del principio al final, en orden, sin detalles pequeños ni opiniones.'),
 '4.6H':L('Find what each text says about the topic, then put the two ideas together.','Busca lo que dice cada texto sobre el tema y luego junta las dos ideas.'),
 '4.8B':L('Compare what the character says, does, and feels at the beginning and at the end. What caused the change?','Compara lo que el personaje dice, hace y siente al principio y al final. ¿Qué causó el cambio?'),
 '4.8C':L('The climax is the turning point, the moment of greatest tension. The resolution is how the problem is solved at the end.','El clímax es el punto decisivo, el momento de mayor tensión. La resolución es cómo se soluciona el problema al final.'),
 '4.10A':L('Ask yourself: why did the author write this, and what big idea should readers take away?','Pregúntate: ¿por qué el autor escribió esto y qué gran idea quiere que se lleven los lectores?'),
 '4.9E':L('The claim is what the author wants you to believe. Facts and expert information are the evidence that supports it.','La afirmación es lo que el autor quiere que creas. Los datos y la información de expertos son la evidencia que la apoya.')};
const SKP={
 '4.6F':[L('Which sentence from the text is the best clue?','¿Qué oración del texto es la mejor pista?')],
 '4.6G':[L('Which sentence best states an important idea?','¿Qué oración expresa mejor una idea importante?')],
 '4.3B':[L("Which sentence gives the best clue to the word's meaning?",'¿Qué oración da la mejor pista sobre el significado de la palabra?')],
 '4.7D':[L('Which sentence tells an important idea from the beginning?','¿Qué oración cuenta una idea importante del principio?'),L('Which sentence tells an important idea from the end?','¿Qué oración cuenta una idea importante del final?')],
 '4.6H':[L('Which sentence from Text 1 helps answer the question?','¿Qué oración del Texto 1 ayuda a responder la pregunta?'),L('Which sentence from Text 2 helps answer the question?','¿Qué oración del Texto 2 ayuda a responder la pregunta?')],
 '4.8B':[L('Which sentence shows what the character says, does, or feels?','¿Qué oración muestra lo que el personaje dice, hace o siente?')],
 '4.8C':[L('Which sentence describes that part of the plot?','¿Qué oración describe esa parte de la trama?')],
 '4.10A':[L("Which sentence best shows the author's message or purpose?",'¿Qué oración muestra mejor el mensaje o el propósito del autor?')],
 '4.9E':[L('Which sentence supports your answer?','¿Qué oración apoya tu respuesta?')]};
const DECK={};
function drawItem(sk){const all=IT.map((it,i)=>i).filter(i=>IT[i].s===sk);
  if(typeof mode!=='undefined'&&mode.t==='check'){if(!mode.used)mode.used=new Set(PAIRS[pick(['pA','pB'])]);
    const fit=all.filter(i=>passOf(IT[i].p).ids.every(id=>mode.used.has(id)));const k=fit.length?pick(fit):pick(all);passOf(IT[k].p).ids.forEach(id=>mode.used.add(id));return k}
  if(!DECK[sk]||!DECK[sk].length){const last=DECK[sk+'_last'];DECK[sk]=shuf(all);if(DECK[sk].length>1&&DECK[sk][DECK[sk].length-1]===last)DECK[sk].unshift(DECK[sk].pop())}
  const k=DECK[sk].pop();DECK[sk+'_last']=k;return k}
const LIT=['fic','folk','poem','drama'];
function readQ(sk){const k=drawItem(sk),it=IT[k],es=ITES[k],P=passOf(it.p);
  const ch=it.c.map((c,i)=>L(c,es.c[i])),m=mc(ch[0],ch.slice(1));
  const evs=it.e.map((e,i)=>{const t=Array.isArray(e)?e[0]:0;return{t,en:Array.isArray(e)?e[1]:e,es:Array.isArray(es.e[i])?es.e[i][1]:es.e[i]}});
  const where=evs.map(e=>{const T=P.texts[e.t],u=unitOf(T.g),n=blockOf(T,e.en);return P.pair?L(`Text ${e.t+1}, ${u.en} ${n}`,`Texto ${e.t+1}, ${u.es} ${n}`):L(`${u.en} ${n}`,`${u.es} ${n}`)});
  const q=L(it.q,es.q||it.tr),x=L(it.x[0],es.x||it.x[1]);
  const g=evs.map((e,i)=>{const pe=shuf(unitsOf(P.texts[e.t]).filter(s=>s!==e.en&&s.length>=24)),ps=shuf(unitsOf(P.es[e.t]).filter(s=>s!==e.es&&s.length>=24));
    const right=L(e.en,e.es),em=mc(right,[0,1,2].map(j=>L(pe[j],ps[j])));
    const st=S1(SKP[it.s][Math.min(i,SKP[it.s].length-1)],em.ans,J(L('Look at ','Revisa: '),where[i],'.'),{choices:em.choices});st.ev=[right];st.at=right;return st});
  g.push(S1(q,m.ans,SKS[it.s],{choices:m.choices}));
  const whereAll=where.length>1?J(where[0],L(' and ',' y '),where[1]):where[0];
  const quote=s=>s.startsWith('"')?s:`“${s}”`;
  const lit=!P.pair&&LIT.includes(P.texts[0].g);
  return{type:'mc',text:q,pre:hl=>passageHTML(P,hl),choices:m.choices,ans:m.ans,ansText:ch[0],evs:evs.map(e=>L(e.en,e.es)),
    exLabel:lit?L('Story','Cuento'):L('Reading Passage','Lectura'),
    hint:J(L('Reread ','Vuelve a leer: '),whereAll,'. ',SKS[it.s]),g,
    steps:[SKS[it.s],...evs.map(e=>P.pair?L(`Text ${e.t+1}: ${quote(e.en)}`,`Texto ${e.t+1}: ${quote(e.es)}`):L(`Evidence: ${quote(e.en)}`,`Evidencia: ${quote(e.es)}`)),x]}}
const G={};for(const sk of['4.6F','4.6G','4.3B','4.7D','4.6H','4.8B','4.8C','4.10A','4.9E'])G[sk]=()=>readQ(sk);

/* ---------- Spanish passages (same paragraph order as the English versions) ---------- */
const PSES={
p1:{t:`El plan del jardín`,b:[
`Lucía miró el pedazo de tierra vacío detrás de la casa de Abuela. "Este va a ser el mejor jardín de la calle Maple", anunció. "Podemos sembrar todo hoy y tener tomates para la próxima semana."`,
`Abuela se rió suavemente y le dio un sobrecito de papel con semillas. "Los jardines no funcionan tan rápido, mija. Primero removemos la tierra, luego sembramos y luego esperamos."`,
`Lucía frunció el ceño. Esperar no era lo que más le gustaba. Aun así, agarró una pala y cavó hasta que le dolieron los brazos. Juntas metieron semillitas en hileras ordenadas y las rociaron con agua.`,
`Cada mañana durante una semana, Lucía salió corriendo a revisar el jardín. Cada mañana, no vio nada más que tierra. El octavo día, pateó un terrón con frustración y vio cómo el pedazo de tierra se deshacía. "Tal vez las semillas están descompuestas", refunfuñó.`,
`Abuela se arrodilló a su lado y señaló. Un rizo verde, no más grande que una uña, estaba saliendo de la tierra. "Mira bien", dijo Abuela. "Las cosas buenas crecen en silencio."`,
`Para julio, el jardín estaba lleno de enredaderas y hojas. Cuando Lucía cortó su primer tomate maduro, lo levantó como si fuera un trofeo. "Valió la pena esperar", dijo, y esta vez lo decía en serio.`]},
p2:{t:`Capitán por un día`,b:[
`La entrenadora Reyes sopló su silbato. "Marcus, vas a ser el capitán en el partido del sábado", dijo. Marcus sonrió tanto que le dolieron las mejillas. Por fin, todos verían lo gran jugador que era.`,
`El sábado, Marcus decidió que el mejor plan era sencillo: él haría todos los tiros. Regateó entre sus compañeros, ignoró a Jada, que agitaba los brazos cerca de la portería, y pateó el balón con todas sus fuerzas. El balón pasó por encima de la red. Lo intentó una y otra vez, pero el marcador seguía 0 a 2.`,
`En el medio tiempo, el equipo se sentó en silencio. Por fin, Jada habló. "Nosotros también somos parte del equipo, ¿sabes?", dijo en voz baja. "No has pasado el balón ni una vez."`,
`Marcus abrió la boca para discutir, pero las palabras no le salían. Miró las caras cansadas y desilusionadas a su alrededor y sintió un nudo en el estómago. Jada tenía razón.`,
`En el segundo tiempo, Marcus jugó de otra manera. Cuando dos defensores le bloquearon el paso, vio a Jada sola por la izquierda y le mandó un pase perfecto. ¡Ella anotó! Diez minutos después, Jada le pasó a Leo, y Leo empató el partido.`,
`El silbato final sonó con el marcador 2 a 2. No fue una victoria, pero mientras sus compañeros lo rodeaban y le daban palmadas en la espalda, Marcus se dio cuenta de que se sentía mejor que cualquier gol que hubiera anotado él solo.`]},
p3:{t:`El colibrí y el fuego`,b:[
`Hace mucho tiempo, un gran incendio barrió el bosque. En solo unos minutos, corrió de árbol en árbol y cubrió todo el valle. Todos los animales huyeron a la orilla del río, donde se quedaron mirando cómo se quemaba su hogar.`,
`Solo una criatura no se quedó quieta. Un pequeño colibrí voló al río, recogió una sola gota de agua con el pico y la llevó hasta las llamas. Luego regresó por otra gota, y por otra más.`,
`El oso se rió de él. "¿Qué haces, pequeñito? ¡Tus gotas de agua no pueden apagar un fuego tan grande!"`,
`El jaguar movió la cabeza. "Estás gastando tus fuerzas", dijo. "No hay esperanza."`,
`El colibrí no se detuvo. Al pasar volando junto a ellos una vez más, les gritó: "Estoy haciendo lo que puedo."`,
`Los animales se quedaron callados. Uno por uno, miraron el río y luego el fuego. El oso metió sus enormes patas en el agua y la salpicó sobre las llamas. El venado, los monos y hasta el jaguar empezaron a cargar agua también. Juntos hicieron lo que un pajarito nunca habría podido hacer solo, y por fin el fuego chisporroteó y se apagó.`]},
p4:{t:`Tormenta en la pradera`,b:[
`El cielo de la tarde era un moretón morado,\npesado y bajo sobre la loma.\nEl ganado se juntó junto a la cerca.\nEl molino de viento se quedó quieto de repente.`,
`Luego el trueno llegó como un tren de carga\ny sacudió el porche y la puerta.\nLa lluvia vino corriendo por el pastizal\ny tamborileó sobre el viejo piso de madera.`,
`Los robles se inclinaron ante la furiosa canción del viento,\nel pasto alto quedó plano como un tapete.\nEl abuelo y yo mirábamos desde la ventana\ny contábamos los truenos desde nuestro asiento.`,
`Después, silencio. Las nubes se fueron hacia el este.\nLos charcos reflejaban el sol.\nTodo el mundo, recién lavado, destellaba y relucía\ncomo si comenzara un nuevo día.`]},
p5:{t:`El mapa perdido`,b:[
`(Escenario: Un parque de la ciudad un sábado soleado. MAYA y OWEN, hermanos, están junto a una fuente durante una búsqueda del tesoro del vecindario.)`,
`OWEN: (frustrado) ¡Yo te di el mapa! Ahora nunca vamos a encontrar la última pista.`,
`MAYA: No me lo diste. Tú lo tenías cuando nos fuimos de la banca.`,
`OWEN: (cruzándose de brazos) Pues ahora no lo tengo. Todo esto es tu culpa.`,
`MAYA: (respirando hondo) Discutir no nos va a ayudar a ganar. Volvamos sobre nuestros pasos. Debemos regresar por el mismo camino por donde vinimos: primero la banca, luego la resbaladilla y luego la fuente.`,
`(Caminan despacio con la vista en el suelo. OWEN mete la mano en su chamarra y se queda inmóvil.)`,
`OWEN: (sacando un papel doblado, avergonzado) Maya, mira. Estaba en mi bolsillo todo el tiempo. Perdón por echarte la culpa.`,
`MAYA: (riéndose) Disculpa aceptada. ¡Ahora lee la última pista antes de que algo más desaparezca!`,
`OWEN: (leyendo en voz alta) "Busca donde baila el agua." (Los dos voltean hacia la fuente.) ¡La fuente! ¡Vamos!`]},
p6:{t:`Murciélagos bajo el puente`,b:[
`Cada tarde de verano en Austin, Texas, se reúnen multitudes cerca del puente de Congress Avenue. No esperan un desfile ni un concierto. Esperan a los murciélagos.`,
`Alrededor de un millón y medio de murciélagos mexicanos de cola libre viven en las grietas angostas debajo del puente. Estos murciélagos viven juntos en un grupo llamado colonia, y es la colonia urbana de murciélagos más grande de América del Norte. Al ponerse el sol, los murciélagos salen de debajo del puente en una cinta oscura y retorcida que puede durar casi una hora.`,
`Hace años, mucha gente les tenía miedo a los murciélagos. Cuando la colonia llegó en la década de 1980, algunas personas querían que los sacaran. Los científicos explicaron que los murciélagos no eran peligrosos si la gente los dejaba en paz. También explicaron que los murciélagos eran útiles.`,
`Los murciélagos son excelentes cazadores de insectos. En una sola noche, los murciélagos del puente pueden comerse miles de libras de insectos, entre ellos polillas que dañan los cultivos de los agricultores. Eso significa que los agricultores no necesitan usar tantos químicos para proteger sus campos.`,
`Hoy, los murciélagos son un orgullo para la ciudad. Visitantes de todo el mundo vienen a verlos, lo cual ayuda a los negocios locales. Los murciélagos del puente demuestran que las personas y los animales silvestres pueden compartir una ciudad, y que ambos pueden beneficiarse.`]},
p7:{t:`Queremos más recreo`,b:[
`La mayoría de los estudiantes de la Primaria Oak Hill tienen solo quince minutos de recreo al día. Eso no es suficiente. Nuestra escuela debería darles a los estudiantes por lo menos treinta minutos de recreo todos los días.`,
`Primero, el recreo ayuda a los estudiantes a aprender. Los estudios muestran que los niños que toman descansos activos prestan más atención cuando regresan al salón. Un recreo más largo significaría menos estudiantes inquietos y más alumnos concentrados.`,
`El recreo también es importante para la salud de los estudiantes. Los médicos recomiendan que los niños hagan por lo menos sesenta minutos de actividad física todos los días. Muchos estudiantes se van en autobús o en carro después de la escuela, así que el recreo puede ser su mejor oportunidad para moverse.`,
`Por último, el recreo enseña habilidades que son difíciles de aprender en un escritorio. En el patio, los estudiantes inventan juegos, comparten el equipo y resuelven sus desacuerdos por su cuenta. Son habilidades que usarán toda la vida.`,
`Algunas personas temen que un recreo más largo signifique menos tiempo para aprender. Sin embargo, las investigaciones muestran lo contrario: los descansos activos ayudan a los estudiantes a aprender más. Quince minutos más de recreo es un cambio pequeño que podría hacer una gran diferencia. Ya es hora de que Oak Hill deje jugar a sus estudiantes.`]},
p8:{t:`Todos los estudiantes deberían aprender a nadar`,b:[
`Texas tiene miles de lagos, ríos, playas y albercas en los patios. Aun así, muchos niños de aquí no saben nadar. Todas las escuelas primarias de Texas deberían ofrecer clases de natación gratis a sus estudiantes.`,
`La razón más importante es la seguridad. Ahogarse es una de las principales causas de muerte de los niños pequeños en Estados Unidos. Los niños que han tomado clases de natación tienen menos probabilidades de ahogarse, según la Academia Estadounidense de Pediatría.`,
`Las clases de natación también abren la puerta a actividades divertidas y saludables. Un niño que sabe nadar puede unirse a un equipo de natación, andar en kayak o simplemente jugar en la playa con sus amigos. Nadar es un ejercicio que se puede disfrutar toda la vida.`,
`Algunas personas dicen que las clases de natación cuestan demasiado. Pero muchas ciudades ya tienen albercas públicas que están vacías durante el horario escolar. Las escuelas podrían asociarse con estas albercas y trabajar junto con ellas para mantener bajos los costos.`,
`Aprender a nadar no es solo un extra divertido. Es una habilidad que puede salvar una vida. Nuestras escuelas deberían asegurarse de que cada estudiante tenga la oportunidad de aprender.`]},
p9:{t:`Abejas en acción`,b:[
`Una abeja puede ser pequeña, pero tiene un gran trabajo. Las abejas ayudan a las plantas a producir semillas y frutos mediante un proceso llamado polinización.`,
`Cuando una abeja se posa en una flor para tomar su dulce néctar, un polvo amarillo llamado polen se le pega en los pelitos del cuerpo. Cuando la abeja vuela a la siguiente flor, se le cae un poco de ese polen. Llevar polen de una flor a otra ayuda a la planta a producir semillas.`,
`Muchos de los alimentos que comemos dependen de la polinización. Las manzanas, las almendras, los arándanos y los pepinos son solo algunos de los cultivos que necesitan a las abejas. Sin abejas, sería mucho más difícil cultivar estos alimentos.`,
`Dentro de la colmena, cada abeja tiene una función. La reina pone los huevos. Las obreras recolectan alimento, construyen panales de cera y cuidan a las abejas jóvenes. Algunas obreras incluso hacen guardia en la entrada para proteger la colmena.`,
`En los últimos años, las abejas han tenido problemas como enfermedades y la pérdida de las flores silvestres de las que se alimentan. La gente puede ayudar sembrando flores, evitando químicos dañinos en sus jardines y comprando miel de apicultores locales.`]},
p10:{t:`La colmena de al lado`,b:[
`Cuando el señor Okafor puso dos cajas blancas en su patio, Sofía lo observó desde la ventana de su cuarto. Luego vio las abejas. Cientos de ellas zumbaban alrededor de las cajas como chispas.`,
`"¡Mamá, el vecino tiene abejas!", gritó. "¿Y si me pican?" Durante el resto de la semana, Sofía se negó a jugar en su propio patio.`,
`El sábado, el señor Okafor tocó a la puerta con un frasquito de miel dorada. "Esta miel es de mis colmenas", dijo sonriendo. "¿Te gustaría ver cómo la hicieron las abejas?"`,
`Sofía se escondió detrás de su mamá. Pero la curiosidad la jalaba, y quería saber más. Con un sombrero prestado que tenía un velo de malla, siguió al señor Okafor hasta las colmenas. Él levantó un marco cubierto de abejas, y Sofía contuvo la respiración. A las abejas no les importaba ella para nada. Estaban ocupadas caminando sobre la cera y llenándola de miel.`,
`"Cada abeja tiene un trabajo", explicó el señor Okafor. "Unas hacen cera, otras cuidan a las crías y otras vigilan la puerta. Solo pican si creen que la colmena está en peligro."`,
`Esa primavera, Sofía ayudó a su mamá a sembrar lavanda y girasoles junto a la cerca. "Son para las abejas", le dijo con orgullo al señor Okafor. Ahora, en lugar de esconderse, pasaba las tardes viendo a las abejas volar de flor en flor.`]},
p11:{t:`El largo viaje de la mariposa monarca`,b:[
`Cada otoño, millones de mariposas monarca comienzan uno de los viajes más largos de cualquier insecto. Vuelan desde Canadá y el norte de Estados Unidos hasta las montañas del centro de México, un viaje de hasta 3,000 millas.`,
`Muchas monarcas pasan por Texas en su camino al sur. En octubre, la gente de Texas puede ver racimos de mariposas anaranjadas, muy apretadas unas con otras, descansando en los árboles y tomando néctar de las flores de otoño. Las mariposas necesitan este alimento como energía para su largo vuelo.`,
`Cuando las monarcas llegan a México, se juntan por millones en los oyameles, en lo alto de las montañas. El aire fresco las ayuda a descansar durante el invierno. Luego, en primavera, comienzan a volar otra vez hacia el norte.`,
`El viaje al norte dura varias generaciones. Una monarca pone sus huevos en plantas de algodoncillo y luego muere. Sus orugas comen solo algodoncillo. Cuando se convierten en mariposas, continúan el viaje. Pueden pasar tres o cuatro generaciones para llegar a Canadá.`,
`Hoy, las monarcas están en peligro porque el algodoncillo está desapareciendo de muchos lugares. Científicos, estudiantes y familias están sembrando jardines de algodoncillo a lo largo de la ruta de las monarcas. Estos jardines les dan a las mariposas lugares para poner huevos y encontrar alimento en su increíble viaje.`]},
p12:{t:`Esperando a las monarcas`,b:[
`La abuela de Diego tenía un calendario en la pared de la cocina con una fecha marcada en anaranjado: 15 de octubre. "Ese día pasan las monarcas", dijo Abuelita. "Todos los años, como viejas amigas."`,
`Pero este año, la familia de Diego se había mudado a un apartamento nuevo en San Antonio. No había jardín, solo un pequeño balcón de concreto. "Las mariposas no van a parar aquí", dijo Diego con tristeza. "No hay nada para que coman."`,
`Abuelita se tocó la barbilla. Luego llevó a Diego a un vivero, donde compraron tres macetas, una bolsa de tierra y dos plantitas de algodoncillo. "Las mariposas son viajeras", dijo. "Y los viajeros necesitan lugares para descansar."`,
`Diego regó las plantas todos los días. Agregó una maceta de cinias anaranjadas para el néctar. Aun así, para el 14 de octubre, no había aparecido ni una monarca. Diego empezó a preocuparse de que su balcón fuera demasiado pequeño para importar.`,
`A la mañana siguiente, Diego abrió la cortina y se quedó sin aliento. Una monarca estaba posada en una cinia, muy quieta, abriendo y cerrando las alas despacio. Para la tarde, ya había cuatro.`,
`"¿Ves?", susurró Abuelita, apretándole el hombro. "Hasta un jardín pequeño puede ser una parada en un largo viaje."`]}};

{c:[`para mostrar que los expertos están de acuerdo en que las clases de natación protegen a los niños`,`para mostrar que a los médicos les gusta nadar`,`para explicar cómo unirse a un equipo de natación`,`para decirles a los lectores dónde hay una alberca`],e:[`Los niños que han tomado clases de natación tienen menos probabilidades de ahogarse, según la Academia Estadounidense de Pediatría.`]},
{c:[`proponiendo que las escuelas usen albercas públicas que están vacías durante el día`,`diciendo que el dinero no importa`,`pidiéndoles a las familias que paguen las clases`,`explicando que andar en kayak es barato`],e:[`Pero muchas ciudades ya tienen albercas públicas que están vacías durante el horario escolar.`]},
{c:[`convencer a los lectores de que las escuelas deberían enseñar a nadar`,`entretener a los lectores con un cuento sobre un viaje a la playa`,`explicar cómo se nada`,`describir los lagos de Texas`],e:[`Nuestras escuelas deberían asegurarse de que cada estudiante tenga la oportunidad de aprender.`]},
{q:`En el párrafo 4, ¿qué significa "asociarse"?`,c:[`trabajar junto con alguien`,`competir contra alguien`,`construir algo nuevo`,`cerrar un lugar`],e:[`Las escuelas podrían asociarse con estas albercas y trabajar junto con ellas para mantener bajos los costos.`],x:`La oración lo explica enseguida: asociarse significa trabajar junto con alguien.`},
// p9
{q:`¿Cuál es la idea central de "Abejas en acción"?`,c:[`Las abejas hacen un trabajo importante que ayuda a las plantas y a las personas, así que hay que protegerlas.`,`Las abejas hacen miel dentro de panales de cera.`,`La reina pone todos los huevos de la colmena.`,`Las almendras y los arándanos son alimentos populares.`],e:[`Una abeja puede ser pequeña, pero tiene un gran trabajo.`]},
{q:`¿Qué significa "polinización" en este artículo?`,c:[`llevar polen de flor en flor para que las plantas produzcan semillas`,`tomar néctar de una flor`,`construir panales de cera en la colmena`,`hacer guardia en la entrada de la colmena`],e:[`Llevar polen de una flor a otra ayuda a la planta a producir semillas.`]},
{c:[`Ayudan a la abeja a llevar polen de una flor a otra.`,`Mantienen a la abeja caliente en invierno.`,`Ayudan a la abeja a hacer miel.`,`Protegen a la abeja de los piquetes.`],e:[`Cuando una abeja se posa en una flor para tomar su dulce néctar, un polvo amarillo llamado polen se le pega en los pelitos del cuerpo.`]},
{c:[`para explicar los problemas que enfrentan las abejas y cómo puede ayudar la gente`,`para describir lo que hace la abeja reina`,`para hacer una lista de alimentos que necesitan abejas`,`para explicar cómo se pega el polen a las abejas`],e:[`La gente puede ayudar sembrando flores, evitando químicos dañinos en sus jardines y comprando miel de apicultores locales.`]},
{q:`¿Cuál es el mejor resumen de "Abejas en acción"?`,c:[`Las abejas polinizan muchas plantas de las que dependemos para comer. Trabajan juntas en colmenas, pero enfrentan problemas, y la gente puede ayudar a protegerlas.`,`Las abejas son los animales más importantes del mundo.`,`Una abeja toma néctar. El polen se le pega a los pelitos. Luego vuela a otra flor.`,`La reina pone huevos y las obreras construyen panales.`],e:[`Las abejas ayudan a las plantas a producir semillas y frutos mediante un proceso llamado polinización.`,`La gente puede ayudar sembrando flores, evitando químicos dañinos en sus jardines y comprando miel de apicultores locales.`]},
// p10
{c:[`Pasa de tenerles miedo a las abejas a preocuparse por ellas.`,`Pasa de querer a las abejas a tenerles miedo.`,`Decide hacerse apicultora de inmediato.`,`Deja de hablarle al señor Okafor.`],e:[`Ahora, en lugar de esconderse, pasaba las tardes viendo a las abejas volar de flor en flor.`]},
{c:[`Le muestra las abejas de cerca para que aprenda sobre ellas.`,`Cambia sus colmenas a otro patio.`,`Le dice que se quede adentro.`,`Le regala un disfraz de abeja.`],e:[`"¿Te gustaría ver cómo la hicieron las abejas?"`]},
{c:[`Sofía ve al señor Okafor levantar un marco cubierto de abejas.`,`Sofía ve las cajas blancas desde su ventana.`,`El señor Okafor toca a la puerta con miel.`,`Sofía siembra lavanda y girasoles.`],e:[`Él levantó un marco cubierto de abejas, y Sofía contuvo la respiración.`]},
{c:[`Está nerviosa por estar tan cerca de las abejas.`,`Intenta no oler la miel.`,`Tiene muchas ganas de probar la miel.`,`Está cansada de caminar hasta las colmenas.`],e:[`Sofía se escondió detrás de su mamá.`]},
{c:[`Sofía les tiene miedo a las abejas del vecino hasta que él le muestra cómo trabajan. Aprende que las abejas están ocupadas, no son malas, y siembra flores para ayudarlas.`,`El señor Okafor le da a Sofía un frasco de miel.`,`Sofía usa un sombrero con velo. Luego ve unas cajas blancas.`,`Las abejas hacen cera, cuidan a las crías y vigilan la puerta.`],e:[`Durante el resto de la semana, Sofía se negó a jugar en su propio patio.`,`Esa primavera, Sofía ayudó a su mamá a sembrar lavanda y girasoles junto a la cerca.`]},
{c:[`Aprender sobre algo puede cambiar el miedo por comprensión.`,`Las abejas son peligrosas y hay que evitarlas.`,`Los vecinos siempre deben compartir su miel.`,`Las flores son el mejor regalo.`],e:[`Solo pican si creen que la colmena está en peligro."`]},
// p11
{q:`¿Cuál es la idea central de "El largo viaje de la mariposa monarca"?`,c:[`Las monarcas hacen un largo viaje cada año y necesitan algodoncillo y flores en el camino para sobrevivir.`,`Las monarcas son mariposas anaranjadas.`,`Los oyameles crecen en lo alto de las montañas de México.`,`A los estudiantes les gusta sembrar jardines.`],e:[`Cada otoño, millones de mariposas monarca comienzan uno de los viajes más largos de cualquier insecto.`]},
{q:`En el párrafo 2, ¿qué significa "racimos"?`,c:[`grupos muy apretados`,`mariposas que vuelan solas`,`tipos de flores`,`vuelos largos hacia el sur`],e:[`En octubre, la gente de Texas puede ver racimos de mariposas anaranjadas, muy apretadas unas con otras, descansando en los árboles y tomando néctar de las flores de otoño.`],x:`La oración dice que las mariposas están "muy apretadas unas con otras", lo que explica "racimos".`},
{c:[`Las monarcas no tendrían dónde poner huevos y habría muchas menos.`,`Las monarcas comerían otra planta.`,`Las monarcas se quedarían en México todo el año.`,`Las monarcas volarían más rápido.`],e:[`Sus orugas comen solo algodoncillo.`]},
{c:[`para ayudar a los lectores a seguir el viaje de principio a fin`,`para comparar las monarcas con otros insectos`,`para convencer a los lectores de visitar México`,`para contar un cuento inventado sobre una mariposa`],e:[`Luego, en primavera, comienzan a volar otra vez hacia el norte.`],x:`Palabras como "cada otoño", "cuando llegan" y "luego, en primavera" ordenan el viaje en el tiempo para que sea fácil de seguir.`},
{c:[`Las monarcas vuelan hasta 3,000 millas a México cada otoño y regresan al norte durante varias generaciones. Sembrar algodoncillo ayuda a protegerlas en su viaje.`,`Las monarcas son hermosas y todos deberían quererlas.`,`En octubre, las monarcas descansan en los árboles de Texas.`,`Una monarca pone huevos en el algodoncillo. Luego muere.`],e:[`Vuelan desde Canadá y el norte de Estados Unidos hasta las montañas del centro de México, un viaje de hasta 3,000 millas.`,`Científicos, estudiantes y familias están sembrando jardines de algodoncillo a lo largo de la ruta de las monarcas.`]},
// p12
{c:[`Lo ayuda a convertir su preocupación en acción sembrando un jardín en el balcón.`,`Le dice que se olvide de las monarcas.`,`Lo regresa a su casa anterior.`,`Le compra un libro sobre mariposas.`],e:[`Luego llevó a Diego a un vivero, donde compraron tres macetas, una bolsa de tierra y dos plantitas de algodoncillo.`]},
{c:[`Diego ve una monarca en su balcón.`,`La familia de Diego se muda a San Antonio.`,`Diego y Abuelita compran algodoncillo.`,`Diego riega las plantas todos los días.`],e:[`Una monarca estaba posada en una cinia, muy quieta, abriendo y cerrando las alas despacio.`]},
{c:[`Está sorprendido y emocionado porque llegó una monarca.`,`Le da miedo la mariposa.`,`Está triste porque sus plantas se secaron.`,`Tiene frío porque es octubre.`],e:[`Diego empezó a preocuparse de que su balcón fuera demasiado pequeño para importar.`]},
{q:`En el párrafo 5, ¿qué significa "posada"?`,c:[`descansando encima de algo`,`volando en círculos`,`escondida debajo de las hojas`,`comiendo rápido`],e:[`Una monarca estaba posada en una cinia, muy quieta, abriendo y cerrando las alas despacio.`],x:`La mariposa está "muy quieta" sobre la flor; "posada" significa descansando encima.`},
{c:[`Después de mudarse a un apartamento, Diego teme que las monarcas no lo visiten. Él y Abuelita siembran un pequeño jardín en el balcón, y las monarcas paran ahí.`,`Abuelita tiene un calendario con el 15 de octubre marcado.`,`A Diego le gustan las cinias anaranjadas y el algodoncillo.`,`Las monarcas viajan al sur cada otoño hacia México.`],e:[`"Las mariposas no van a parar aquí", dijo Diego con tristeza.`,`"Hasta un jardín pequeño puede ser una parada en un largo viaje."`]},
{c:[`Las acciones pequeñas pueden hacer una gran diferencia.`,`Mudarse a un lugar nuevo siempre es difícil.`,`Los abuelos deberían tener calendarios.`,`Las mariposas prefieren los jardines grandes.`],e:[`"Hasta un jardín pequeño puede ser una parada en un largo viaje."`]},
// pairs
{c:[`Las abejas de una colmena tienen distintos trabajos.`,`Las abejas pican a cualquiera que se les acerque.`,`Las abejas solo visitan girasoles.`,`Las abejas duermen todo el invierno.`],e:[[0,`Dentro de la colmena, cada abeja tiene una función.`],[1,`"Cada abeja tiene un trabajo", explicó el señor Okafor.`]]},
{q:`¿Cómo se relaciona la decisión de Sofía de sembrar flores con "Abejas en acción"?`,c:[`El Texto 1 dice que sembrar flores es una manera de ayudar a las abejas.`,`El Texto 1 dice que a las abejas solo les gusta la lavanda.`,`El Texto 1 dice que las flores alejan a las abejas de las casas.`,`El Texto 1 dice que no hay que sembrar flores cerca de las colmenas.`],e:[[0,`La gente puede ayudar sembrando flores, evitando químicos dañinos en sus jardines y comprando miel de apicultores locales.`],[1,`Esa primavera, Sofía ayudó a su mamá a sembrar lavanda y girasoles junto a la cerca.`]]},
{c:[`El Texto 1 da datos sobre las abejas, y el Texto 2 cuenta la historia de una niña que aprende sobre ellas.`,`El Texto 1 cuenta una historia, y el Texto 2 da datos.`,`El Texto 1 trata de mariposas, y el Texto 2 de abejas.`,`Los dos textos son poemas sobre la miel.`],e:[[0,`Una abeja puede ser pequeña, pero tiene un gran trabajo.`],[1,`Cuando el señor Okafor puso dos cajas blancas en su patio, Sofía lo observó desde la ventana de su cuarto.`]]},
{c:[`Las monarcas ponen sus huevos en el algodoncillo, y sus orugas comen solo algodoncillo.`,`Las monarcas descansan en los oyameles de México.`,`Las monarcas vuelan hasta 3,000 millas.`,`Las monarcas toman néctar de las flores de otoño.`],e:[[0,`Una monarca pone sus huevos en plantas de algodoncillo y luego muere.`],[1,`Luego llevó a Diego a un vivero, donde compraron tres macetas, una bolsa de tierra y dos plantitas de algodoncillo.`]]},
{c:[`La gente puede ayudar a las monarcas sembrando jardines a lo largo de su ruta.`,`Las monarcas les tienen miedo a las personas.`,`Las monarcas solo viven en San Antonio.`,`Las monarcas viajan solas.`],e:[[0,`Científicos, estudiantes y familias están sembrando jardines de algodoncillo a lo largo de la ruta de las monarcas.`],[1,`"Hasta un jardín pequeño puede ser una parada en un largo viaje."`]]},
{c:[`Dice que muchas monarcas pasan por Texas en octubre camino a México.`,`Dice que las monarcas nacen en San Antonio.`,`Dice que a las monarcas les gustan los apartamentos.`,`Dice que las monarcas vuelan al norte en octubre.`],e:[[0,`En octubre, la gente de Texas puede ver racimos de mariposas anaranjadas, muy apretadas unas con otras, descansando en los árboles y tomando néctar de las flores de otoño.`],[1,`"Ese día pasan las monarcas", dijo Abuelita.`]]}];

      return{type:'mc',text:L('Which verb correctly completes the sentence?','¿Qué verbo completa correctamente la oración?'),disp:draft(esc(`${S0} _____ ${pr[3]}.`)),choices:m.choices,ans:m.ans,ansText:right,hint,g:g0,steps}}

    g0.push(S1(L('What change should be made?','¿Qué cambio se debe hacer?'),m.ans,hint,{choices:m.choices}));
    return{type:'mc',text:L('What change, if any, should be made in this sentence?','¿Qué cambio, si hay alguno, se debe hacer en esta oración?'),disp:draft(`${esc(S0)} <u>${esc(wrong)}</u> ${esc(pr[3])}.`),choices:m.choices,ans:m.ans,ansText:`Change ${wrong} to ${right}`,hint,g:g0,steps}}
  if(k==='run'){const[A,B,c]=pick(RUN),splice=Math.random()<.5,shown=splice?`${A}, ${B}.`:`${A} ${B}.`,fix=`${A}, ${c} ${B}.`;const oc=['and','but','so'].filter(x=>x!==c);
    const m=mc(fix,shuf([`${A}, ${B}.`,`${A} ${c}, ${B}.`,`${A}, ${pick(oc)} ${B}.`,`${A} ${B}.`].filter(x=>x!==shown)));const cm=mc(c,oc);
    return{type:'mc',text:L('This sentence is a run-on. What is the best way to fix it?','Esta oración está mal unida (run-on). ¿Cuál es la mejor manera de corregirla?'),disp:draft(esc(shown)),choices:m.choices,ans:m.ans,ansText:fix,
