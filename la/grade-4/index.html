const LES={
'4.6F':{idea:[L('An inference is a smart conclusion about something the author does not say directly. You make one by combining a clue from the text with what you already know.','Una inferencia es una conclusión inteligente sobre algo que el autor no dice directamente. La haces juntando una pista del texto con lo que ya sabes.'),
  M(L('text clue + what I know = inference','pista del texto + lo que sé = inferencia')),L('Example: "Ana slammed the door and stomped up the stairs." The text never says Ana is angry, but slamming and stomping are clues you already understand.','Ejemplo: "Ana azotó la puerta y subió las escaleras dando pisotones." El texto no dice que Ana está enojada, pero azotar la puerta y dar pisotones son pistas que ya entiendes.'),
  L('On STAAR, always be ready to point to the sentence that supports your inference. That sentence is your text evidence.','En STAAR, siempre debes poder señalar la oración que apoya tu inferencia. Esa oración es tu evidencia del texto.')],
  vocab:[['inference','inferencia'],['evidence','evidencia'],['clue','pista'],['conclude','concluir']],
  watch:L('If you cannot point to a sentence that supports an answer, it is a guess, not an inference.','Si no puedes señalar una oración que apoye la respuesta, es una adivinanza, no una inferencia.')},
'4.6G':{idea:[L('Not every detail is equally important. Key ideas are the ones the whole text is built around.','No todos los detalles son igual de importantes. Las ideas clave son aquellas alrededor de las cuales se construye todo el texto.'),
  L('In informational text, the central idea is what the whole article is mostly about. Often the title, the first paragraph, and the last paragraph point to it.','En un texto informativo, la idea central es de lo que trata principalmente todo el artículo. Muchas veces el título, el primer párrafo y el último lo señalan.'),
  M(L('Ask: Does every paragraph connect to this idea?','Pregúntate: ¿cada párrafo se relaciona con esta idea?')),L('A detail that is interesting but only appears once is a supporting detail, not the central idea.','Un detalle interesante que aparece una sola vez es un detalle de apoyo, no la idea central.')],
  vocab:[['central idea','idea central'],['key idea','idea clave'],['supporting detail','detalle de apoyo'],['mostly about','trata principalmente de']],
  watch:L('A true statement from the text is not always the central idea. Check that it covers the whole text.','Una oración verdadera del texto no siempre es la idea central. Revisa que abarque todo el texto.')},
'4.3B':{idea:[L('When you meet an unfamiliar word, the words around it often explain it. These are context clues.','Cuando encuentras una palabra desconocida, las palabras que la rodean muchas veces la explican. Esas son las pistas de contexto.'),
  L('Look for a definition ("a group called a colony"), a restatement ("a clod... the lump"), an example, or an opposite.','Busca una definición ("un grupo llamado colonia"), una reformulación ("un terrón... el pedazo de tierra"), un ejemplo o un antónimo.'),
  M(L('Read around the word → predict → test each choice in its place','Lee alrededor de la palabra → predice → prueba cada opción en su lugar')),L('Some words have more than one meaning, like "swept" (cleaned with a broom, or moved quickly). Context tells you which meaning fits.','Algunas palabras tienen más de un significado, como "barrer" (limpiar con escoba, o pasar rápido por un lugar). El contexto te dice cuál va.')],
  vocab:[['context','contexto'],['multiple-meaning word','palabra de varios significados'],['definition','definición'],['unfamiliar','desconocido']],
  watch:L('Do not pick the meaning you know best. Pick the meaning that makes sense in this sentence.','No escojas el significado que mejor conoces. Escoge el que tiene sentido en esta oración.')},
'4.7D':{idea:[L('A summary retells the most important parts of a text in a few sentences, in your own words, in the order they happen.','Un resumen vuelve a contar las partes más importantes de un texto en pocas oraciones, con tus propias palabras y en orden.'),
  M(L('Fiction: Somebody → Wanted → But → So → Then\nInformational: topic + main ideas in order','Ficción: Alguien → Quería → Pero → Así que → Entonces\nInformativo: tema + ideas principales en orden')),L('Leave out small details, examples, and your own opinions.','Deja fuera los detalles pequeños, los ejemplos y tus opiniones.')],
  vocab:[['summary','resumen'],['main events','sucesos principales'],['in order','en orden'],['opinion','opinión']],
  watch:L('A choice that tells only one detail, or tells events out of order, is not a good summary.','Una opción que cuenta un solo detalle, o cuenta los sucesos en desorden, no es un buen resumen.')},
'4.6H':{idea:[L('Synthesizing means putting ideas from two texts together to understand something new.','Sintetizar significa juntar ideas de dos textos para entender algo nuevo.'),
  L('STAAR often pairs an informational text with a story on the same topic. One gives facts; the other shows a character living through them.','STAAR muchas veces junta un texto informativo con un cuento del mismo tema. Uno da datos; el otro muestra a un personaje que los vive.'),
  M(L('Text 1 says ___.  Text 2 shows ___.  Together they show ___.','El Texto 1 dice ___.  El Texto 2 muestra ___.  Juntos muestran ___.')),L('For "both texts" questions, the answer must be true for Text 1 and for Text 2.','En preguntas de "ambos textos", la respuesta debe ser cierta para el Texto 1 y para el Texto 2.')],
  vocab:[['synthesize','sintetizar'],['compare','comparar'],['contrast','contrastar'],['both','ambos']],
  watch:L('A detail that appears in only one text cannot answer a "both texts" question.','Un detalle que aparece en un solo texto no puede responder una pregunta de "ambos textos".')},
'4.8B':{idea:[L('Characters reveal themselves through what they say, do, think, and feel, and through how other characters react to them.','Los personajes se revelan por lo que dicen, hacen, piensan y sienten, y por cómo reaccionan los demás.'),
  L('Many characters change. To explain a change, compare the character at the beginning and at the end, and find what caused it, often another character.','Muchos personajes cambian. Para explicar un cambio, compara al personaje al principio y al final, y busca qué lo causó; muchas veces es otro personaje.'),
  M(L('Beginning: ___  →  Because ___  →  End: ___','Al principio: ___  →  Porque ___  →  Al final: ___'))],
  vocab:[['character','personaje'],['interaction','interacción'],['trait','rasgo'],['change','cambio']],
  watch:L('A change is about how a character thinks or acts, not just about something that happens to them.','Un cambio tiene que ver con cómo piensa o actúa el personaje, no solo con algo que le sucede.')},
'4.8C':{idea:[L('Plot is the series of events in a story. It builds toward a turning point and then settles down.','La trama es la serie de sucesos de un cuento. Va creciendo hasta un punto decisivo y luego se calma.'),
  M(L('problem → rising action → CLIMAX → falling action → resolution','problema → acción creciente → CLÍMAX → acción decreciente → resolución')),
  L('The climax is the moment of greatest tension, when things turn. The resolution is how the problem is finally solved.','El clímax es el momento de mayor tensión, cuando todo cambia. La resolución es cómo se soluciona finalmente el problema.')],
  vocab:[['plot','trama'],['rising action','acción creciente'],['climax','clímax'],['resolution','resolución']],
  watch:L('The climax is usually not the very last event. It is the turning point before the ending.','El clímax casi nunca es el último suceso. Es el punto decisivo antes del final.')},
'4.10A':{idea:[L("The author's purpose is why the author wrote: to inform (teach facts), to persuade (convince), or to entertain (tell a story or poem).",'El propósito del autor es por qué escribió: para informar (enseñar datos), para persuadir (convencer) o para entretener (contar un cuento o poema).'),
  L('The message, or theme, is the big lesson the reader should take away. It usually fits life, not just this one story.','El mensaje o tema es la gran lección que el lector debe llevarse. Por lo general aplica a la vida, no solo a este cuento.'),
  M(L('Topic: bees.   Message: Learning about something can replace fear.','Tema: las abejas.   Mensaje: Conocer algo puede reemplazar el miedo.')),L('Authors also choose why to include a paragraph or a stanza. Ask what that part adds.','Los autores también deciden por qué incluir un párrafo o una estrofa. Pregúntate qué aporta esa parte.')],
  vocab:[['purpose','propósito'],['inform','informar'],['persuade','persuadir'],['theme','tema']],
  watch:L('A message is a full idea, like "Small actions matter," not one word like "friendship."','Un mensaje es una idea completa, como "Las acciones pequeñas importan", no una sola palabra como "amistad".')},
'4.9E':{idea:[L('An argumentative text tries to convince you. The claim is the main point the author wants you to agree with. It often uses "should."','Un texto argumentativo intenta convencerte. La afirmación es la idea principal que el autor quiere que aceptes. Muchas veces usa "debería".'),
  L('Authors support claims with reasons and facts: numbers, research, and expert information. Strong arguments also answer people who disagree (a counterclaim).','Los autores apoyan sus afirmaciones con razones y datos: números, investigaciones e información de expertos. Los buenos argumentos también responden a quienes no están de acuerdo (contraargumento).'),
  M(L('Claim: Schools should ___.  Reason: ___.  Fact: ___.','Afirmación: Las escuelas deberían ___.  Razón: ___.  Dato: ___.'))],
  vocab:[['claim','afirmación'],['reason','razón'],['fact','dato'],['counterclaim','contraargumento']],
  watch:L('A fact in the essay is not the claim. The claim is what the facts are trying to prove.','Un dato del ensayo no es la afirmación. La afirmación es lo que los datos intentan demostrar.')},
'4.11Di':{idea:[L('A complete sentence has a subject (who or what) and a predicate (what they do), and it expresses a complete thought.','Una oración completa tiene sujeto (quién o qué) y predicado (lo que hace), y expresa un pensamiento completo.'),
  M('Agreement:  The dog barks.   The dogs bark.\nThe box of books sits here.  (box = singular)'),
  L('A run-on joins two complete thoughts with no punctuation, or with only a comma. Fix it with a comma plus and, but, or so, or make two sentences.','Una oración mal unida (run-on) junta dos pensamientos completos sin puntuación o solo con una coma. Corrígela con coma más and, but o so, o forma dos oraciones.'),
  L('A fragment is a piece of a sentence, like "Because the bus was late." Join it to a complete sentence.','Un fragmento es un pedazo de oración, como "Because the bus was late." Únelo a una oración completa.')],
  vocab:[['subject','sujeto'],['verb','verbo'],['run-on sentence','oración mal unida'],['fragment','fragmento']],
  watch:L('Ignore the phrase between the subject and the verb. In "The box of old books sits," the subject is box, not books.','No hagas caso de la frase entre el sujeto y el verbo. En "The box of old books sits", el sujeto es box, no books.')},
'4.11Dii':{idea:[L('Most verbs add -ed to show the past: walk → walked. Irregular verbs change in their own way, so you have to learn them.','La mayoría de los verbos agregan -ed para el pasado: walk → walked. Los verbos irregulares cambian a su manera, así que hay que aprenderlos.'),
  M('go → went    bring → brought    catch → caught\nswim → swam  write → wrote     think → thought'),
  L('Words like yesterday, last night, or two days ago are time clues that tell you to use the past tense.','Palabras como yesterday, last night o two days ago son pistas de tiempo que te dicen que uses el pasado.'),
  L('Do not use a helping-verb form by itself: "I swam," not "I swum." "Swum" needs "have": "I have swum."','No uses sola la forma con verbo auxiliar: "I swam", no "I swum". "Swum" necesita "have": "I have swum".')],
  vocab:[['past tense','tiempo pasado'],['irregular verb','verbo irregular'],['time clue','pista de tiempo'],['present tense','tiempo presente']],
  watch:L('Never add -ed to an irregular verb: goed, bringed, and catched are not words.','Nunca agregues -ed a un verbo irregular: goed, bringed y catched no existen.')},
'4.11C':{idea:[L('Revising makes writing clearer. On STAAR, you choose the best change to a student draft.','Revisar hace que la escritura sea más clara. En STAAR, escoges el mejor cambio para el borrador de un estudiante.'),
  M('Combine:  Mia ran. Mia jumped. → Mia ran and jumped.\nConnect:  However, / For example, / As a result, / Next,'),
  L('Combine short sentences that repeat the same subject or the same action. Use transitions to show how ideas connect. Keep only details that support the main idea.','Combina oraciones cortas que repiten el mismo sujeto o la misma acción. Usa transiciones para mostrar cómo se conectan las ideas. Deja solo los detalles que apoyan la idea principal.')],
  vocab:[['revise','revisar'],['combine','combinar'],['transition','transición'],['main idea','idea principal']],
  watch:L('Joining two sentences with only a comma creates a run-on. Effective combining removes repeated words.','Unir dos oraciones solo con una coma crea un error. Combinar bien quita las palabras repetidas.')},
'4.2B':{idea:[L('Homophones sound the same but have different spellings and meanings: their / there / they\'re. Decide what the sentence means, then pick the spelling.','Los homófonos suenan igual, pero se escriben distinto y significan cosas distintas: their / there / they\'re. Decide qué quiere decir la oración y luego escoge la ortografía.'),
  L('When you add a suffix, the base word sometimes changes:','Cuando agregas un sufijo, a veces la palabra base cambia:'),
  M('drop e:      hope + ing → hoping\nchange y→i:  happy + ness → happiness\ndouble:      stop + ed → stopped\nkeep y:      carry + ing → carrying')],
  vocab:[['homophone','homófono'],['suffix','sufijo'],['base word','palabra base'],['silent e','e muda']],
  watch:L('Before -ing, keep the y: carrying, trying. Change y to i only for endings like -ed, -es, -er, -est, -ness.','Antes de -ing, conserva la y: carrying, trying. Cambia la y por i solo con terminaciones como -ed, -es, -er, -est, -ness.')}};

/* ---------- state ---------- */
const prog=id=>S.p[id]||(S.p[id]={a:0,c:0,s:0,m:false,chk:null});
function status(id){const p=S.p[id];if(!p)return'new';if(p.m)return'mastered';if(p.chk===false||(p.a>=3&&p.c/p.a<.6))return'gap';if(p.a>0)return'working';if(p.chk===true)return'ok';return'new'}
function nextUp(exclude){for(const want of['gap','working','new','ok'])for(const id of ORDER)if(id!==exclude&&status(id)===want)return id;return null}
let mode={t:'study'};let cur=null;let resetArm=null;
function setView(view){cur.view=view;cur.err=false;cur.ps=0;cur.mk=0;
  if(view==='learn'){cur.ex=G[cur.id]();cur.exStep=1}
  else if(view==='guided'){cur.gq=G[cur.id]();cur.gi=0;cur.gt=0;cur.gshow=false;cur.gval='';cur.gpick=null;cur.glog=[]}
  else{cur.q=G[cur.id]();cur.done=false;cur.pick=null;cur.hint=false;cur.res=null;cur.val='';cur.justMastered=false}}
function openSkill(id,view){cur={id};if(!view){const st=status(id);view=(st==='new'||st==='gap')?'learn':'practice'}setView(view)}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
function renderChrome(){document.documentElement.lang=S.lang;$('#sub').textContent=tx(U.sub);
  $('#lang-en').setAttribute('aria-pressed',S.lang==='en');$('#lang-es').setAttribute('aria-pressed',S.lang==='es');
  $('#btn-check').textContent=tx(U.check);$('#btn-reset').textContent=tx(resetArm?U.resetSure:U.reset);$('#btn-reset').classList.toggle('warn',!!resetArm);
  $('#foot').textContent=tx(U.foot)}
function renderMap(){const nu=nextUp();let h=`<h2>${tx(U.map)}</h2><p class="note">${tx(U.mapNote)}</p>`;
  for(const c of CATS){h+=`<div class="cat"><div class="cat-h"><span>${tx(c.n)}</span><b>${tx(c.items)}</b></div>`;
    for(const id of c.sk){const st=status(id),p=S.p[id],on=cur&&cur.id===id&&mode.t==='study';
      h+=`<button class="sk" data-skill="${id}" aria-current="${on}"><span class="code">${id}</span><span class="nm">${tx(NAMES[id])}${id===nu&&!on?`<span class="nx">${tx(U.nextUp)}</span>`:''}</span><span class="pill st-${st}" title="${p&&p.a?p.c+'/'+p.a:''}">${tx(U[st])}</span></button>`}
    h+='</div>'}
  $('#map').innerHTML=h}
const lineHTML=s=>s&&s.m?`<span class="m">${esc(tx(s.m))}</span>`:esc(tx(s));
function stepsHTML(st,n){return`<ol class="steps">${st.slice(0,n??st.length).map(s=>`<li${s&&s.m?' class="m"':''}>${lineHTML(s)}</li>`).join('')}</ol>`}
function probHTML(q,hl){return(q.pre?q.pre(hl||[]):'')+`<p class="qtext">${esc(tx(q.text))}</p>`+(q.tr&&S.lang==='es'?`<p class="qtr">${esc(q.tr)}</p>`:'')+(q.disp?`<div class="vis">${q.disp()}</div>`:'')}
function choicesHTML(list,attr,sel,done,ans,mono){return`<div class="choices">${list.map((ch,i)=>{let cl='choice'+(mono?'':' txt');
  if(done){if(i===ans)cl+=' right';else if(i===sel)cl+=' wrongpick'}else if(i===sel)cl+=' sel';
  return`<button class="${cl}" ${attr}="${i}" ${done?'disabled':''}>${esc(tx(ch))}</button>`}).join('')}</div>`}
function tabsHTML(){return`<nav class="tabs" aria-label="stages">${[['learn',U.learn],['guided',U.guided],['practice',U.own]].map(([v,l],i)=>`<button data-view="${v}" aria-current="${cur.view===v}"><span class="tn">${i+1}</span>${tx(l)}</button>`).join('')}</nav>`}

function learnHTML(){const les=S.lang==='es'&&LES_ES[cur.id]?LES_ES[cur.id]:LES[cur.id],q=cur.ex,n=q.steps.length,all=cur.exStep>=n;
  let h=`<div class="lesson"><div class="idea">${les.idea.map(x=>x.m?`<div class="formula">${esc(tx(x.m))}</div>`:`<p>${esc(tx(x))}</p>`).join('')}</div>
    <div class="side"><div class="words"><h4>${tx(U.words)}</h4><dl>${les.vocab.map(([e,s])=>`<div><dt>${esc(S.lang==='en'?e:s)}</dt>${S.lang==='en'?`<dd>${esc(s)}</dd>`:''}</div>`).join('')}</dl></div>
    <div class="watch"><h4>${tx(U.watch)}</h4><p>${esc(tx(les.watch))}</p></div></div></div>`;
  h+=`<div class="example"><h3>${tx(q.exLabel||U.example)}</h3>${probHTML(q,cur.exStep>=2?q.evs:null)}${stepsHTML(q.steps,cur.exStep)}`;
  if(all)h+=`<p class="exans"><b>${tx(U.answerIs)}</b> <span class="m">${esc(tx(q.ansText))}</span></p>`;
  h+=`<div class="actions">${all?`<button class="btn primary" data-act="to-guided">${tx(U.tryTogether)} →</button><button class="btn" data-act="new-example">${tx(U.another)}</button>`:`<button class="btn primary" data-act="ex-step">${tx(U.showStep)}</button>`}</div></div>`;
  return h}

function guidedHTML(){const q=cur.gq,g=q.g,n=g.length;let h=probHTML(q,g.slice(0,cur.gi).flatMap(s=>s.ev||[]))+`<ol class="gsteps">`;
  for(let i=0;i<n&&i<=cur.gi;i++){const s=g[i];
    if(i<cur.gi){const lg=cur.glog[i];h+=`<li class="gs done"><span class="gn ${lg?'help':'ok'}">${lg?'•':'✓'}</span><div><p>${esc(tx(s.p))}</p><p class="ga m">${esc(tx(s.at))}</p></div></li>`}
    else{h+=`<li class="gs now"><span class="gn">${i+1}</span><div class="gbody"><p class="eyebrow">${tx(U.stepOf(i+1,n))}</p><p class="gp">${esc(tx(s.p))}</p>`;
      if(s.type==='mc')h+=choicesHTML(s.choices,'data-gchoice',cur.gpick,cur.gshow,s.ans,s.mono);
      else h+=`<div class="answer"><input id="gans" inputmode="${s.type==='txt'?'text':'decimal'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="answer" ${cur.gshow?'disabled':''} value="${esc(cur.gshow?tx(s.at):cur.gval||'')}"></div>`;
      if(cur.err)h+=`<div class="hintbox">${tx(cur.errT?U.badT:U.bad)}</div>`;
      if(cur.gt>0&&!cur.gshow)h+=`<div class="hintbox"><b>${tx(U.stepHint)}</b> ${esc(tx(s.h))}</div>`;
      if(cur.gshow)h+=`<div class="hintbox"><b>${tx(U.answerIs)}</b> <span class="m">${esc(tx(s.at))}</span>. ${tx(U.shown)}</div>`;
      h+=`<div class="actions">${cur.gshow?`<button class="btn primary" data-act="g-cont">${tx(U.cont)}</button>`:`<button class="btn primary" data-act="g-check" ${s.type==='mc'&&cur.gpick==null?'disabled':''}>${tx(U.check1)}</button>`}</div></div></li>`}}
  h+='</ol>';
  if(cur.gi>=n){const helped=cur.glog.filter(Boolean).length;h+=`<div class="fb ok" aria-live="polite"><strong>${tx(U.solved)}</strong><div>${tx(U.solvedB(n,helped))} ${tx(helped===0?U.readyOwn:U.oneMore)}</div></div>
    <div class="actions">${helped===0?`<button class="btn primary" data-act="to-own">${tx(U.goOwn)} →</button><button class="btn" data-act="to-guided">${tx(U.anotherG)}</button>`:`<button class="btn primary" data-act="to-guided">${tx(U.anotherG)}</button><button class="btn" data-act="to-own">${tx(U.goOwn)}</button>`}</div>`}
  return h}

function practiceHTML(){const q=cur.q;let h=probHTML(q,cur.done?q.evs:null);
  if(q.type==='mc')h+=choicesHTML(q.choices,'data-choice',cur.pick,cur.done,q.ans,q.mono);
  else h+=`<div class="answer"><input id="ans" inputmode="${q.type==='txt'?'text':'decimal'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="answer" ${cur.done?'disabled':''} value="${esc(cur.val||'')}"></div><p class="help">${tx(q.type==='txt'?U.txtHelp:U.numHelp)}</p>`;
  if(cur.err)h+=`<div class="hintbox">${tx(cur.errT?U.badT:U.bad)}</div>`;
  if(cur.hint&&!cur.done)h+=`<div class="hintbox">${esc(tx(q.hint))}</div>`;
  if(cur.done){const ok=cur.res;h+=`<div class="fb ${ok?'ok':'no'}" aria-live="polite"><strong>${ok?tx(U.correct):tx(U.wrong)+' '}${ok?'':`<span class="ansv">${esc(tx(q.ansText))}</span>`}</strong>`;
    if(cur.justMastered)h+=`<div>${tx(U.masteredNow)}</div>`;
    h+=ok?`<details><summary>${tx(U.steps)}</summary>${stepsHTML(q.steps)}</details>`:`<div><b>${tx(U.steps)}</b>${stepsHTML(q.steps)}</div>`;h+='</div>'}
  h+=`<div class="actions">`;
  if(!cur.done){h+=`<button class="btn primary" data-act="submit" ${q.type==='mc'&&cur.pick==null?'disabled':''}>${tx(U.submit)}</button>`;if(mode.t==='study'&&!cur.hint)h+=`<button class="btn" data-act="hint">${tx(U.hint)}</button>`}
  else{h+=`<button class="btn primary" data-act="next">${tx(U.next)}</button>`;
    if(mode.t==='study'&&!cur.res)h+=`<button class="btn" data-act="to-guided">${tx(U.walk)}</button><button class="btn ghost" data-act="to-learn">${tx(U.review)}</button>`;
    if(mode.t==='study'&&cur.justMastered&&nextUp(cur.id))h+=`<button class="btn" data-act="go-next">${tx(U.goNext)} · ${tx(NAMES[nextUp(cur.id)])}</button>`}
  return h+'</div>'}

function renderMain(){const m=$('#main');let h='';
  if(mode.t==='summary'){const res=mode.results;const n=Object.keys(res).length,ok=Object.values(res).filter(Boolean).length;const gaps=ORDER.filter(id=>res[id]===false);
    h=`<section class="sum"><h3>${tx(U.sumT)}</h3><p>${tx(U.sumB(ok,n))}</p>`+(gaps.length?`<ol class="gaplist">${gaps.map(id=>`<li><span class="code">${id}</span><span>${tx(NAMES[id])}</span><span class="w">${tx(catOf(id).items)}</span></li>`).join('')}</ol>`:`<p>${tx(U.noGaps)}</p>`)+
      `<p class="help">${tx(U.stage)}</p><div class="actions"><button class="btn primary" data-act="practice-first">${tx(U.practice)}</button></div></section>`;m.innerHTML=h;return}
  const anyWork=Object.values(S.p).some(p=>p.a>0||p.chk!==null);
  if(mode.t==='study'&&!anyWork)h+=`<div class="banner"><div><h3>${tx(U.welT)}</h3><p>${tx(U.welB)}</p></div><button class="btn primary" data-act="start-check">${tx(U.start)}</button></div>`;
  const p=prog(cur.id),c=catOf(cur.id);
  const top=mode.t==='check'?`<span class="eyebrow">${tx(U.qOf(mode.i+1,mode.queue.length))}</span><button class="btn ghost" data-act="exit-check">${tx(U.exit)}</button>`
    :`<div class="ttl"><span class="eyebrow"><span class="code">${cur.id}</span>${tx(c.n)}</span><h2>${tx(NAMES[cur.id])}</h2></div>`+(cur.view==='practice'?`<span class="pips" aria-label="${Math.min(p.s,3)} ${tx(U.streak)}">${[0,1,2].map(i=>`<span class="pip ${i<Math.min(p.s,3)?'on':''}"></span>`).join('')} ${tx(U.streak)}</span>`:'');
  h+=`<section class="card"><div class="card-top">${top}</div>${mode.t==='study'?tabsHTML():''}<div class="paper">${cur.view==='learn'?learnHTML():cur.view==='guided'?guidedHTML():practiceHTML()}</div></section>`;
  m.innerHTML=h;
  const pz=$('.passage');if(pz){const mk=pz.querySelectorAll('mark');if(mk.length&&mk.length!==cur.mk)pz.scrollTop=Math.max(0,mk[0].offsetTop-48);else pz.scrollTop=cur.ps||0;
    cur.mk=mk.length;pz.addEventListener('scroll',()=>{cur.ps=pz.scrollTop},{passive:true})}
  const inp=$('#ans');if(inp&&!cur.done){inp.addEventListener('input',e=>{cur.val=e.target.value});inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}
  const gin=$('#gans');if(gin&&!cur.gshow){gin.addEventListener('input',e=>{cur.gval=e.target.value});gin.addEventListener('keydown',e=>{if(e.key==='Enter')gCheck()})}}
function render(){renderChrome();renderMap();renderMain()}
const focusSoon=sel=>{const el=document.querySelector(sel);if(el)el.focus({preventScroll:true})};

/* ---------- actions ---------- */
function submit(){const q=cur.q;let ok;
  if(q.type==='mc'){if(cur.pick==null)return;ok=cur.pick===q.ans}
  else if(q.type==='txt'){const v=normT(cur.val);if(!v){cur.err=true;cur.errT=true;renderMain();return}ok=q.acc.includes(v)}
  else{const v=parseNum(cur.val||'');if(isNaN(v)){cur.err=true;cur.errT=false;renderMain();return}ok=Math.abs(v-q.ans)<=(q.tol??.001)}
  cur.err=false;cur.done=true;cur.res=ok;const p=prog(cur.id);
  if(mode.t==='check'){p.chk=ok;mode.results[cur.id]=ok}
  else{p.a++;if(ok){p.c++;p.s++;if(p.s>=3&&!p.m){p.m=true;cur.justMastered=true}}else p.s=0}
  save();render();focusSoon('[data-act="next"]')}
function gCheck(){const s=cur.gq.g[cur.gi];let ok;
  if(s.type==='mc'){if(cur.gpick==null)return;ok=cur.gpick===s.ans}
  else if(s.type==='txt'){const v=normT(cur.gval);if(!v){cur.err=true;cur.errT=true;renderMain();return}ok=s.acc.includes(v)}
  else{const v=parseNum(cur.gval||'');if(isNaN(v)){cur.err=true;cur.errT=false;renderMain();return}ok=Math.abs(v-s.ans)<=s.tol}
  cur.err=false;
  if(ok){cur.glog.push(cur.gt>0);gAdvance()}
  else{cur.gt++;cur.gpick=null;if(cur.gt>=2)cur.gshow=true;renderMain();focusSoon(cur.gshow?'[data-act="g-cont"]':'#gans')}}
function gAdvance(){cur.gi++;cur.gt=0;cur.gshow=false;cur.gval='';cur.gpick=null;renderMain();focusSoon('#gans')}
function goStudy(id,view){mode={t:'study'};openSkill(id,view);render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.lang){S.lang=t.dataset.lang;save();if(cur&&GRAM.includes(cur.id)&&mode.t!=='summary'&&!(cur.view==='practice'&&cur.done))setView(cur.view);render();return}
  if(t.id==='btn-reset'){if(resetArm){clearTimeout(resetArm);resetArm=null;S.p={};save();goStudy(nextUp())}else{resetArm=setTimeout(()=>{resetArm=null;renderChrome()},4000);renderChrome()}return}
  if(t.id==='btn-check'||t.dataset.act==='start-check'){mode={t:'check',queue:ORDER.slice(),i:0,results:{}};cur={id:ORDER[0]};setView('practice');render();return}
  if(t.dataset.skill){goStudy(t.dataset.skill);return}
  if(t.dataset.view){setView(t.dataset.view);render();return}
  if(t.dataset.choice!=null){cur.pick=+t.dataset.choice;renderMain();return}
  if(t.dataset.gchoice!=null){cur.gpick=+t.dataset.gchoice;renderMain();return}
  const a=t.dataset.act;
  if(a==='submit')submit();
  else if(a==='hint'){cur.hint=true;renderMain()}
  else if(a==='ex-step'){cur.exStep++;renderMain()}
  else if(a==='new-example'){setView('learn');renderMain()}
  else if(a==='to-guided'){setView('guided');render();focusSoon('#gans')}
  else if(a==='to-own'){setView('practice');render();focusSoon('#ans')}
  else if(a==='to-learn'){setView('learn');render()}
  else if(a==='g-check')gCheck();
  else if(a==='g-cont'){cur.glog.push(true);gAdvance()}
  else if(a==='next'){if(mode.t==='check'){mode.i++;if(mode.i>=mode.queue.length){mode={t:'summary',results:mode.results};renderMain();renderMap()}else{cur={id:mode.queue[mode.i]};setView('practice');render()}}else{setView('practice');render();focusSoon('#ans')}}
  else if(a==='go-next')goStudy(nextUp(cur.id));
  else if(a==='exit-check'||a==='practice-first')goStudy(nextUp()||ORDER[0]);
});
goStudy(nextUp()||ORDER[0]);
</script>

</body></html>
