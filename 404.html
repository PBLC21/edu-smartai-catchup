<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Edu-SmartAI Catch-Up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--bg:#eef3f4;--surface:#fff;--ink:#132228;--muted:#566870;--line:#d3dee1;--accent:#0a6a70;--on-accent:#fff;--marker:#f0b429;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e171a;--surface:#152227;--ink:#e3ecee;--muted:#93a6ad;--line:#26383e;--accent:#4cc3c4;--on-accent:#08201f;--marker:#f3c14f;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;padding:24px 16px;box-sizing:border-box}
main{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:460px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:28px;line-height:1.1}
p{margin:0;color:var(--muted)}
a{align-self:flex-start;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
a:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This grade may not be ready yet, or the link has a typo. / Este grado aún no está listo o el enlace tiene un error.</p>
  <a href="/">See all grades / Ver todos los grados</a>
</main>
</body>
</html>
